<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart School AI — JNV Result Automation</title>
<meta name="theme-color" content="#123f29">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--g:#123f29;--g2:#245d3e;--bg:#f4f7f5;--card:#fff;--txt:#18231d;--muted:#68756e;--line:#dce5df;--danger:#b3261e;--warn:#9a6500}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;background:linear-gradient(145deg,#092f1e,#174d31);display:grid;place-items:center;padding:20px}.login{width:min(500px,100%);background:#fff;border-radius:25px;padding:32px;box-shadow:0 20px 60px #0005}.logo{width:90px;height:90px;border-radius:25px;background:#edf4ef;display:grid;place-items:center;margin:auto;color:var(--g);font-weight:900;text-align:center}.login h1{text-align:center;margin:16px 0 5px}.sub,.year{text-align:center;color:var(--muted)}.year{font-weight:bold}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:90px}.primary,.secondary,.danger,.ghost{padding:10px 14px;border-radius:10px;font-weight:750;border:0}.primary{background:var(--g);color:#fff}.secondary{background:#eaf2ed;color:var(--g)}.danger{background:#fff0ef;color:var(--danger)}.ghost{background:#fff;border:1px solid var(--line)}.full{width:100%}.err{color:var(--danger);margin-top:10px;font-weight:700}.hint{font-size:12px;color:var(--muted);margin-top:10px}.app{display:flex;min-height:100vh}.side{width:255px;background:#103a25;color:#fff;position:fixed;inset:0 auto 0 0;padding:15px;overflow:auto;z-index:10}.brand{font-size:22px;font-weight:900;margin:8px}.school{font-size:11px;color:#b9d1c4;padding:5px 8px 15px;line-height:1.4}.nav button{display:block;width:100%;text-align:left;background:none;color:#dceae2;border:0;padding:10px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#285d41;color:#fff}.main{margin-left:255px;width:calc(100% - 255px);padding:20px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.top h2{margin:0}.role{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #173a2010}.kpi .label{color:var(--muted)}.kpi .num{font-size:32px;font-weight:900;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}.toolbar>*{width:auto}.toolbar .search{min-width:220px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;gap:10px}.section-title h3{margin:0}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{background:#f4f7f5;font-size:12px;position:sticky;top:0}.actions{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:bold}.badge.warn{background:#fff5dc;color:var(--warn)}.badge.danger{background:#fff0ef;color:var(--danger)}.notice{background:#eef6f1;border:1px solid #d6e8dc;padding:13px;border-radius:12px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:30}.modal-box{background:#fff;width:min(950px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0}.close{border:0;border-radius:50%;width:34px;height:34px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.analysis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0}.analysis .card{padding:12px}.analysis .num{font-size:22px;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.track{height:8px;background:#e7eee9;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--g2)}.report{background:#fff;border:1px solid #ccd9d0;padding:22px;max-width:900px;margin:auto}.report table{width:100%;border-collapse:collapse}.report th,.report td{border:1px solid #ccd9d0;padding:7px;font-size:12px}.report th{background:#eef5f0}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:40px;text-align:center}.sign div{border-top:1px solid #555;padding-top:5px}.toast{position:fixed;right:18px;bottom:18px;color:#fff;background:#187a45;padding:12px 16px;border-radius:10px;z-index:50;font-weight:bold}.marks-table input{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px}.mini{font-size:12px;color:var(--muted)}.danger-text{color:var(--danger)}.success-text{color:var(--g)}
@media(max-width:1100px){.analysis{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.side{width:70px;padding:8px}.brand{font-size:0;text-align:center}.brand:after{content:"SS";font-size:19px}.school{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:23px}.main{margin-left:70px;width:calc(100% - 70px);padding:12px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.two,.analysis{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{flex-direction:column}.toolbar>*{width:100%}.sign{grid-template-columns:1fr;gap:30px}.login{padding:24px}}@media print{.side,.top,.toolbar,.no-print{display:none!important}.main{margin:0;width:100%;padding:5px}.report{border:0;box-shadow:none}}
</style></head><body><div id="root"></div>
<script>
const CONFIG={SUPABASE_URL:"https://mnilsvgjuwnniquukedk.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_7chu45G-OQ6LfdEd4rL-qw_V1VNNbXi"};
const SCHOOL="PM SHRI Jawahar Navodaya Vidyalaya, Wargal, Siddipet",YEAR="2026-27";
const S={sb:null,user:null,profile:null,page:"dashboard",classes:[],sections:[],students:[],subjects:[],exams:[],teachers:[],assignments:[]};
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const C=id=>S.classes.find(x=>x.id===id)?.name||"",SEC=id=>S.sections.find(x=>x.id===id)?.name||"",SUB=id=>S.subjects.find(x=>x.id===id)?.name||"",TC=id=>S.teachers.find(x=>x.id===id)?.full_name||"";
const isAdmin=()=>String(S.profile?.role||"teacher").toLowerCase()==="admin";
function toast(x,ok=true){const e=$("toast");if(!e)return;e.textContent=x;e.style.background=ok?"#187a45":"#b3261e";e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),3000)}
function login(){document.body.innerHTML=`<div class="login-wrap"><div class="login"><div class="logo">SMART<br>SCHOOL</div><h1>Smart School AI</h1><div class="sub">School Management • Examination • Analytics</div><div class="year">${YEAR}</div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary full" onclick="signIn()">Sign in</button><button class="ghost full" style="margin-top:8px" onclick="resetPassword()">Forgot password?</button><div id="loginErr" class="err"></div><div class="hint">Authentication is handled by Supabase. Never share your password or OTP.</div></div></div>`;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()})}
function nav(p,l,i){return `<button class="${S.page===p?"active":""}" onclick="go('${p}')">${i} &nbsp;${l}</button>`}
function shell(){document.body.innerHTML=`<div class="app"><aside class="side"><div class="brand">Smart School</div><div class="school">${SCHOOL}<br>Academic Year ${YEAR}</div><div class="nav">${nav("dashboard","Dashboard","▣")}${nav("students","Students","●")}${nav("classes","Classes & Sections","◆")}${nav("subjects","Subjects","◇")}${nav("teachers","Teachers","♟")}${nav("assign","Assignments","⇄")}${nav("exams","Examinations","▤")}${nav("marks","Marks Entry","✎")}${nav("attendance","Attendance","✓")}${nav("results","Results & Analytics","★")}${nav("reportcards","Report Cards","▣")}${nav("questions","Question Bank","☷")}${nav("quiz","Online Quiz","⚡")}${nav("timetable","Timetable","▦")}${nav("certificates","Certificates","✦")}${nav("ai","AI Assistant","✧")}<button onclick="signOut()">⇥ &nbsp;Sign out</button></div></aside><main class="main"><div class="top"><div><h2 id="title">Dashboard</h2><small>${SCHOOL}</small></div><div class="role">${esc(S.profile?.full_name||S.user?.email||"")} · ${esc(S.profile?.role||"teacher")}</div></div><div id="content"></div></main></div><div id="modal"></div><div id="toast" class="toast hidden"></div>`}
async function init(){if(!window.supabase?.createClient){document.body.innerHTML='<div class="card" style="margin:30px">Supabase library failed to load. Check internet/CDN access.</div>';return}S.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);const {data:{session}}=await S.sb.auth.getSession();if(!session){login();return}S.user=session.user;await loadProfile();shell();await go('dashboard');S.sb.auth.onAuthStateChange((_e,s)=>{if(!s)location.reload()})}
async function loadProfile(){const r=await S.sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();S.profile=r.data||{id:S.user.id,full_name:S.user.email,role:'teacher',active:true}}
async function signIn(){const err=$("loginErr"),btn=$("loginBtn");err.textContent='';btn.disabled=true;try{const email=$("email").value.trim().toLowerCase(),password=$("password").value;if(!email||!password)throw new Error('Enter email and password.');const r=await S.sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;S.user=r.data.user;await loadProfile();shell();await go('dashboard')}catch(e){err.textContent=e.message||String(e)}finally{btn.disabled=false}}
async function resetPassword(){const email=$("email").value.trim();if(!email){$("loginErr").textContent='Enter email first.';return}const r=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});$("loginErr").textContent=r.error?r.error.message:'Password reset email sent.'}
async function signOut(){await S.sb.auth.signOut();location.reload()}
function modal(title,body){$("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){$("modal").innerHTML=''}
async function lookups(){const [a,b,c,d,e,f,g]=await Promise.all([S.sb.from('classes').select('*').order('display_order'),S.sb.from('sections').select('*').order('name'),S.sb.from('students').select('*').order('roll_no'),S.sb.from('subjects').select('*').order('name'),S.sb.from('examinations').select('*').order('exam_date',{ascending:false}),S.sb.from('profiles').select('*').order('full_name'),S.sb.from('teacher_subjects').select('*')]);for(const r of[a,b,c,d,e,f,g])if(r.error)throw r.error;S.classes=a.data||[];S.sections=b.data||[];S.students=c.data||[];S.subjects=d.data||[];S.exams=e.data||[];S.teachers=f.data||[];S.assignments=g.data||[]}
function pageTitle(p){return ({assign:'Assignments',reportcards:'Report Cards',results:'Results & Analytics',marks:'Marks Entry',exams:'Examinations',ai:'AI Assistant',questions:'Question Bank',quiz:'Online Quiz',timetable:'Timetable',certificates:'Certificates'})[p]||p[0].toUpperCase()+p.slice(1)}
async function go(p){S.page=p;shell();$("title").textContent=pageTitle(p);$("content").innerHTML='<div class="card">Loading…</div>';try{const m={dashboard,students,classes,subjects,teachers,assign:assignments,exams,marks,attendance,results,reportcards:reports,questions};if(m[p])await m[p]();else if(p==='quiz')simple('Online Quiz','Quiz tables are connected.');else if(p==='timetable')simple('Timetable','Timetable table is connected.');else if(p==='certificates')simple('Certificates','Certificate module is connected.');else if(p==='ai')ai();}catch(e){$("content").innerHTML=`<div class="card"><b>Module error</b><div class="err">${esc(e.message)}</div></div>`}}
function tbl(head,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="99" style="text-align:center;color:#68756e;padding:25px">No records.</td></tr>'}</tbody></table></div>`}
async function dashboard(){const vals=await Promise.all(['students','classes','subjects','examinations'].map(async t=>{const r=await S.sb.from(t).select('*',{count:'exact',head:true});return r.count||0}));$("content").innerHTML=`<div class="grid">${[['Students',vals[0]],['Classes',vals[1]],['Subjects',vals[2]],['Examinations',vals[3]]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div><div class="section-title"><h3>Multi-subject result system</h3></div><div class="notice"><b>Unlimited subjects enabled.</b> Results, analytics and report cards dynamically read every subject/examination in the database. There is no six-subject limit.</div>`}
async function students(){await lookups();renderStudents(S.students)}
function renderStudents(arr){$("content").innerHTML=`<div class="toolbar"><input class="search" id="studentSearch" placeholder="Search student / roll / admission" oninput="filterStudents()"><button class="primary" onclick="studentForm()">+ Add Student</button><button class="secondary" onclick="importStudents()">⇧ Bulk Import</button><button class="ghost" onclick="studentTemplate()">⇩ Template</button></div>${tbl(['Roll','Admission','Name','Class','Section','House','Action'],arr.map(x=>`<tr><td>${esc(x.roll_no)}</td><td>${esc(x.admission_no)}</td><td><b>${esc(x.full_name)}</b></td><td>${C(x.class_id)}</td><td>${SEC(x.section_id)}</td><td>${esc(x.house)}</td><td class="actions"><button class="secondary" onclick="studentForm('${x.id}')">Edit</button><button class="danger" onclick="del('students','${x.id}','Student')">Delete</button></td></tr>`).join(''))}`}
function filterStudents(){const q=$("studentSearch").value.toLowerCase();renderStudents(S.students.filter(x=>(x.full_name+' '+x.roll_no+' '+x.admission_no).toLowerCase().includes(q)))}
function studentForm(id){const x=S.students.find(a=>a.id===id)||{};modal(id?'Edit Student':'Add Student',`<div class="form-grid"><div class="field"><label>Admission No</label><input id="ad" value="${esc(x.admission_no)}"></div><div class="field"><label>Roll No</label><input id="ro" value="${esc(x.roll_no)}"></div><div class="field wide"><label>Full Name</label><input id="nm" value="${esc(x.full_name)}"></div><div class="field"><label>Gender</label><select id="ge"><option>Male</option><option ${x.gender==='Female'?'selected':''}>Female</option><option ${x.gender==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Class</label><select id="cl">${S.classes.map(c=>`<option value="${c.id}" ${x.class_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Section</label><select id="se">${S.sections.map(c=>`<option value="${c.id}" ${x.section_id===c.id?'selected':''}>${C(c.class_id)} - ${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>House</label><input id="ho" value="${esc(x.house)}"></div><div class="field"><label>Father Name</label><input id="fa" value="${esc(x.father_name)}"></div><div class="field"><label>Mother Name</label><input id="mo" value="${esc(x.mother_name)}"></div><div class="field"><label>Parent Phone</label><input id="ph" value="${esc(x.parent_phone||x.phone)}"></div><div class="field wide"><label>Address</label><textarea id="addr">${esc(x.address)}</textarea></div></div><button class="primary full" onclick="saveStudent('${id||''}')">Save Student</button>`)}
async function saveStudent(id){const o={admission_no:$("ad").value.trim(),roll_no:$("ro").value.trim(),full_name:$("nm").value.trim(),gender:$("ge").value,class_id:$("cl").value,section_id:$("se").value,house:$("ho").value,father_name:$("fa").value,mother_name:$("mo").value,parent_phone:$("ph").value,address:$("addr").value,active:true};const r=id?await S.sb.from('students').update(o).eq('id',id):await S.sb.from('students').insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast('Student saved');students()}
function importStudents(){modal('Bulk Import Students',`<div class="notice">Use XLSX/CSV headers: admission_no, roll_no, full_name, gender, class_id, section_id, house, father_name, mother_name, parent_phone, address.</div><div class="field"><input id="studentFile" type="file" accept=".csv,.xlsx,.xls"></div><button class="primary" onclick="doStudentImport()">Import</button>`)}
async function doStudentImport(){try{const f=$("studentFile").files[0];if(!f)return toast('Select a file',false);let rows;if(/\.csv$/i.test(f.name)){const t=await f.text();const lines=t.split(/\r?\n/).filter(Boolean),h=lines.shift().split(',').map(x=>x.trim());rows=lines.map(line=>{const v=line.split(',');return Object.fromEntries(h.map((k,i)=>[k,v[i]||'']))})}else{const w=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''})}rows=rows.filter(x=>x.full_name).map(x=>({...x,active:true}));const r=await S.sb.from('students').insert(rows);if(r.error)throw r.error;closeModal();toast(rows.length+' students imported');students()}catch(e){toast(e.message,false)}}
function studentTemplate(){const w=XLSX.utils.book_new(),s=XLSX.utils.json_to_sheet([{admission_no:'1',roll_no:'1',full_name:'Student Name',gender:'Male',class_id:'',section_id:'',house:'Aravali',father_name:'',mother_name:'',parent_phone:'',address:''}]);XLSX.utils.book_append_sheet(w,s,'Students');XLSX.writeFile(w,'student_import_template.xlsx')}
async function classes(){await lookups();$("content").innerHTML=`<div class="section-title"><h3>Classes</h3><button class="primary" onclick="classForm()">+ Add Class</button></div>${tbl(['Class','Order','Active','Action'],S.classes.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.display_order}</td><td>${x.active?'Yes':'No'}</td><td class="actions"><button class="secondary" onclick="classForm('${x.id}')">Edit</button><button class="danger" onclick="del('classes','${x.id}','Class')">Delete</button></td></tr>`).join(''))}<div class="section-title"><h3>Sections</h3><button class="primary" onclick="sectionForm()">+ Add Section</button></div>${tbl(['Class','Section','Active','Action'],S.sections.map(x=>`<tr><td>${C(x.class_id)}</td><td>${esc(x.name)}</td><td>${x.active?'Yes':'No'}</td><td class="actions"><button class="secondary" onclick="sectionForm('${x.id}')">Edit</button><button class="danger" onclick="del('sections','${x.id}','Section')">Delete</button></td></tr>`).join(''))}`}
function classForm(id){const x=S.classes.find(a=>a.id===id)||{};modal(id?'Edit Class':'Add Class',`<div class="field"><label>Name</label><input id="cn" value="${esc(x.name)}"></div><div class="field"><label>Display Order</label><input id="co" type="number" value="${x.display_order||1}"></div><button class="primary full" onclick="saveClass('${id||''}')">Save</button>`)}
async function saveClass(id){const o={name:$("cn").value.trim(),display_order:+$("co").value||1,active:true};const r=id?await S.sb.from('classes').update(o).eq('id',id):await S.sb.from('classes').insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast('Class saved');classes()}
function sectionForm(id){const x=S.sections.find(a=>a.id===id)||{};modal(id?'Edit Section':'Add Section',`<div class="field"><label>Class</label><select id="sc">${S.classes.map(c=>`<option value="${c.id}" ${x.class_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Section</label><input id="sn" value="${esc(x.name)}"></div><button class="primary full" onclick="saveSection('${id||''}')">Save</button>`)}
async function saveSection(id){const o={class_id:$("sc").value,name:$("sn").value.trim(),active:true};const r=id?await S.sb.from('sections').update(o).eq('id',id):await S.sb.from('sections').insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast('Section saved');classes()}
async function subjects(){await lookups();$("content").innerHTML=`<div class="toolbar"><button class="primary" onclick="subjectForm()">+ Add Subject</button><button class="secondary" onclick="bulkSubjects()">⇧ Bulk Add</button></div>${tbl(['Code','Subject','Active','Action'],S.subjects.map(x=>`<tr><td>${esc(x.code)}</td><td><b>${esc(x.name)}</b></td><td>${x.active?'Yes':'No'}</td><td class="actions"><button class="secondary" onclick="subjectForm('${x.id}')">Edit</button><button class="danger" onclick="del('subjects','${x.id}','Subject')">Delete</button></td></tr>`).join(''))}`}
function subjectForm(id){const x=S.subjects.find(a=>a.id===id)||{};modal(id?'Edit Subject':'Add Subject',`<div class="form-grid"><div class="field"><label>Code</label><input id="subcode" value="${esc(x.code)}"></div><div class="field"><label>Subject Name</label><input id="subname" value="${esc(x.name)}"></div></div><button class="primary full" onclick="saveSubject('${id||''}')">Save Subject</button>`)}
async function saveSubject(id){const o={code:$("subcode").value.trim(),name:$("subname").value.trim(),active:true};if(!o.name)return toast('Subject name required',false);const r=id?await S.sb.from('subjects').update(o).eq('id',id):await S.sb.from('subjects').insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast('Subject saved');subjects()}
function bulkSubjects(){modal('Bulk Add Subjects',`<div class="field"><label>Enter one subject per line as CODE | NAME</label><textarea id="bulkSub" placeholder="Eng | English\nHN | HINDI\nMT | Maths\nSc | Science\nSSc | Social Science\nTs | TELUGU\nPhy | Physics"></textarea></div><button class="primary" onclick="saveBulkSubjects()">Add Subjects</button>`)}
async function saveBulkSubjects(){const rows=$("bulkSub").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const [code,...name]=x.split('|');return {code:code.trim(),name:name.join('|').trim(),active:true}}).filter(x=>x.name);if(!rows.length)return toast('Enter subjects',false);const r=await S.sb.from('subjects').insert(rows);if(r.error)return toast(r.error.message,false);closeModal();toast(rows.length+' subjects added');subjects()}
async function teachers(){await lookups();const staff=S.teachers;$('content').innerHTML=`<div class="grid"><div class="card kpi"><div class="label">Total Staff Profiles</div><div class="num">${staff.length}</div></div><div class="card kpi"><div class="label">Active</div><div class="num">${staff.filter(x=>x.active!==false).length}</div></div><div class="card kpi"><div class="label">Administrators</div><div class="num">${staff.filter(x=>String(x.role).toLowerCase()==='admin').length}</div></div><div class="card kpi"><div class="label">Teachers</div><div class="num">${staff.filter(x=>String(x.role).toLowerCase()!=='admin').length}</div></div></div><div class="section-title"><h3>Teacher Management</h3><button class="primary" onclick="teacherForm()">+ Add Teacher Details</button></div><div class="notice">Teacher details use the existing <b>profiles</b> table: Employee ID, Name, Designation, Phone and Role.</div>${tbl(['Employee ID','Name','Designation','Phone','Role','Status','Action'],staff.map(x=>`<tr><td>${esc(x.employee_id)}</td><td>${esc(x.full_name)}</td><td>${esc(x.designation)}</td><td>${esc(x.phone)}</td><td>${esc(x.role)}</td><td>${x.active===false?'<span class="badge danger">Inactive</span>':'<span class="badge">Active</span>'}</td><td class="actions"><button class="secondary" onclick="teacherForm('${x.id}')">Edit</button><button class="danger" onclick="del('profiles','${x.id}','Teacher profile')">Delete</button></td></tr>`).join(''))}`}
function teacherForm(id){const x=S.teachers.find(a=>a.id===id)||{};modal(id?'Edit Teacher Details':'Add Teacher Details',`<div class="form-grid"><div class="field"><label>Employee ID</label><input id="eid" value="${esc(x.employee_id)}"></div><div class="field"><label>Full Name</label><input id="tname" value="${esc(x.full_name)}"></div><div class="field"><label>Designation</label><input id="tdes" value="${esc(x.designation)}"></div><div class="field"><label>Phone</label><input id="tphone" value="${esc(x.phone)}"></div><div class="field"><label>Role</label><select id="trole"><option value="teacher" ${String(x.role||'teacher')==='teacher'?'selected':''}>Teacher</option><option value="admin" ${String(x.role||'')==='admin'?'selected':''}>Admin</option></select></div></div><button class="primary full" onclick="saveTeacher('${id||''}')">Save Details</button>`)}
async function saveTeacher(id){const o={employee_id:$("eid").value.trim(),full_name:$("tname").value.trim(),designation:$("tdes").value.trim(),phone:$("tphone").value.trim(),role:$("trole").value,active:true};if(!o.full_name)return toast('Teacher name required',false);const r=id?await S.sb.from('profiles').update(o).eq('id',id):await S.sb.from('profiles').insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast('Teacher details saved');teachers()}
async function assignments(){await lookups();$("content").innerHTML=`<div class="section-title"><h3>Teacher → Subject → Class → Section</h3><button class="primary" onclick="assignmentForm()">+ New Assignment</button></div>${tbl(['Teacher','Subject','Class','Section','Academic Year','Status','Action'],S.assignments.map(x=>`<tr><td>${TC(x.teacher_id)}</td><td>${SUB(x.subject_id)}</td><td>${C(x.class_id)}</td><td>${SEC(x.section_id)}</td><td>${esc(x.academic_year||YEAR)}</td><td>${x.active!==false?'<span class="badge">Active</span>':'<span class="badge danger">Inactive</span>'}</td><td class="actions"><button class="secondary" onclick="assignmentForm('${x.id}')">Edit</button><button class="danger" onclick="del('teacher_subjects','${x.id}','Assignment')">Delete</button></td></tr>`).join(''))}`}
function assignmentForm(id){const x=S.assignments.find(a=>a.id===id)||{};modal(id?'Edit Assignment':'New Assignment',`<div class="form-grid"><div class="field"><label>Teacher</label><select id="at">${S.teachers.map(t=>`<option value="${t.id}" ${x.teacher_id===t.id?'selected':''}>${esc(t.full_name)}</option>`).join('')}</select></div><div class="field"><label>Subject</label><select id="as">${S.subjects.map(t=>`<option value="${t.id}" ${x.subject_id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Class</label><select id="ac">${S.classes.map(t=>`<option value="${t.id}" ${x.class_id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Section</label><select id="ase">${S.sections.map(t=>`<option value="${t.id}" ${x.section_id===t.id?'selected':''}>${C(t.class_id)} - ${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Academic Year</label><input id="ay" value="${esc(x.academic_year||YEAR)}"></div></div><button class="primary full" onclick="saveAssignment('${id||''}')">Save Assignment</button>`)}
async function saveAssignment(id){const o={teacher_id:$("at").value,subject_id:$("as").value,class_id:$("ac").value,section_id:$("ase").value,academic_year:$("ay").value,active:true};const table=id?'teacher_subjects':'teacher_subjects';const r=id?await S.sb.from(table).update(o).eq('id',id):await S.sb.from(table).insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast('Assignment saved');assignments()}
async function exams(){await lookups();$("content").innerHTML=`<div class="section-title"><h3>Examinations</h3><button class="primary" onclick="examForm()">+ Create Examination</button></div>${tbl(['Name','Year','Date','Class','Section','Subject','Max','Pass','Status','Action'],S.exams.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.academic_year)}</td><td>${esc(x.exam_date)}</td><td>${C(x.class_id)}</td><td>${SEC(x.section_id)}</td><td>${SUB(x.subject_id)}</td><td>${x.maximum_marks}</td><td>${x.pass_marks}</td><td><span class="badge">${esc(x.status)}</span></td><td class="actions"><button class="secondary" onclick="examForm('${x.id}')">Edit</button><button class="danger" onclick="del('examinations','${x.id}','Examination')">Delete</button></td></tr>`).join(''))}`}
function examForm(id){const x=S.exams.find(a=>a.id===id)||{};modal(id?'Edit Examination':'Create Examination',`<div class="form-grid"><div class="field"><label>Exam Name</label><input id="en" value="${esc(x.name||'PWT I')}"></div><div class="field"><label>Academic Year</label><input id="ey" value="${esc(x.academic_year||YEAR)}"></div><div class="field"><label>Exam Date</label><input id="ed" type="date" value="${esc(x.exam_date||'')}"></div><div class="field"><label>Class</label><select id="ec">${S.classes.map(c=>`<option value="${c.id}" ${x.class_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Section</label><select id="esec">${S.sections.map(c=>`<option value="${c.id}" ${x.section_id===c.id?'selected':''}>${C(c.class_id)} - ${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Subject</label><select id="esub">${S.subjects.map(c=>`<option value="${c.id}" ${x.subject_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Maximum Marks</label><input id="emax" type="number" value="${x.maximum_marks||100}"></div><div class="field"><label>Pass Marks</label><input id="epass" type="number" value="${x.pass_marks||33}"></div><div class="field"><label>Status</label><select id="estatus"><option ${x.status==='published'?'selected':''}>published</option><option ${x.status==='draft'?'selected':''}>draft</option></select></div></div><button class="primary full" onclick="saveExam('${id||''}')">Save Examination</button>`)}
async function saveExam(id){const o={name:$("en").value,academic_year:$("ey").value,exam_date:$("ed").value||null,class_id:$("ec").value,section_id:$("esec").value,subject_id:$("esub").value,maximum_marks:+$("emax").value||100,pass_marks:+$("epass").value||33,status:$("estatus").value};const r=id?await S.sb.from('examinations').update(o).eq('id',id):await S.sb.from('examinations').insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast('Examination saved');exams()}
async function marks(){await lookups();const exams=S.exams;$("content").innerHTML=`<div class="card"><div class="notice"><b>Assignment-based Marks Entry.</b> Select any examination. The subject is taken from that examination. All subjects are supported.</div><div class="toolbar" style="margin-top:12px"><div class="field" style="min-width:260px;flex:1"><label>Examination</label><select id="markExam" onchange="loadMarkSheet()">${exams.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.academic_year)} — ${C(e.class_id)} ${SEC(e.section_id)} — ${SUB(e.subject_id)}</option>`).join('')}</select></div></div><div id="markSheet"></div></div>`;if(exams.length)await loadMarkSheet()}
async function loadMarkSheet(){const ex=S.exams.find(x=>x.id===$("markExam").value);if(!ex){$("markSheet").innerHTML='<div class="notice">Create an examination first.</div>';return}const students=S.students.filter(s=>s.class_id===ex.class_id&&s.section_id===ex.section_id&&s.active!==false);const mr=await S.sb.from('marks').select('*').eq('examination_id',ex.id);if(mr.error)return toast(mr.error.message,false);const map=Object.fromEntries((mr.data||[]).map(x=>[x.student_id,x]));$("markSheet").innerHTML=`<div class="section-title"><h3>${esc(SUB(ex.subject_id))} — ${esc(C(ex.class_id))} ${esc(SEC(ex.section_id))}</h3><div>Max ${ex.maximum_marks}</div></div>${tbl(['Roll','Admission','Student','Marks / '+ex.maximum_marks,'Attendance','Status'],students.map(s=>{const m=map[s.id]||{};return `<tr><td>${esc(s.roll_no)}</td><td>${esc(s.admission_no)}</td><td><b>${esc(s.full_name)}</b></td><td class="marks-table"><input id="mk_${s.id}" type="number" min="0" max="${ex.maximum_marks}" value="${m.marks??''}"></td><td><select id="att_${s.id}"><option ${m.attendance_status!=='Absent'?'selected':''}>Present</option><option ${m.attendance_status==='Absent'?'selected':''}>Absent</option></select></td><td>${m.status?'<span class="badge">'+esc(m.status)+'</span>':'—'}</td></tr>`}).join(''))}<div class="toolbar" style="justify-content:flex-end;margin-top:12px"><button class="secondary" onclick="saveMarks('draft')">Save Draft</button><button class="primary" onclick="saveMarks('submitted')">Submit Marks</button></div>`}
async function saveMarks(status){const ex=S.exams.find(x=>x.id===$("markExam").value);if(!ex)return;const students=S.students.filter(s=>s.class_id===ex.class_id&&s.section_id===ex.section_id&&s.active!==false);const rows=students.map(s=>{const v=$("mk_"+s.id).value;return {examination_id:ex.id,student_id:s.id,subject_id:ex.subject_id,marks:v===''?null:+v,max_marks:ex.maximum_marks,attendance_status:$("att_"+s.id).value,status,entered_by:S.user.id,updated_at:new Date().toISOString()}});for(const row of rows){const q=await S.sb.from('marks').select('id').eq('examination_id',row.examination_id).eq('student_id',row.student_id).maybeSingle();let r=q.data?await S.sb.from('marks').update(row).eq('id',q.data.id):await S.sb.from('marks').insert(row);if(r.error)return toast(r.error.message,false)}toast('Marks '+status);loadMarkSheet()}
async function attendance(){await lookups();const today=new Date().toISOString().slice(0,10);$("content").innerHTML=`<div class="card"><div class="toolbar"><div class="field"><label>Date</label><input id="attDate" type="date" value="${today}"></div><div class="field"><label>Class</label><select id="attClass">${S.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Section</label><select id="attSec">${S.sections.map(c=>`<option value="${c.id}">${C(c.class_id)} - ${esc(c.name)}</option>`).join('')}</select></div><button class="primary" onclick="loadAttendance()">Load</button></div><div id="attSheet"></div></div>`}
async function loadAttendance(){const date=$("attDate").value,students=S.students.filter(s=>s.class_id===$("attClass").value&&s.section_id===$("attSec").value&&s.active!==false);const r=await S.sb.from('attendance').select('*').eq('attendance_date',date);if(r.error)return toast(r.error.message,false);const map=Object.fromEntries((r.data||[]).map(x=>[x.student_id,x]));$("attSheet").innerHTML=tbl(['Roll','Student','Status'],students.map(s=>{const a=map[s.id];return `<tr><td>${esc(s.roll_no)}</td><td>${esc(s.full_name)}</td><td><select id="a_${s.id}"><option ${!a||a.status==='Present'?'selected':''}>Present</option><option ${a?.status==='Absent'?'selected':''}>Absent</option></select></td></tr>`}).join('') )+`<div class="toolbar" style="justify-content:flex-end;margin-top:10px"><button class="primary" onclick="saveAttendance()">Save Attendance</button></div>`}
async function saveAttendance(){const date=$("attDate").value,students=S.students.filter(s=>s.class_id===$("attClass").value&&s.section_id===$("attSec").value&&s.active!==false);for(const s of students){const status=$("a_"+s.id).value;const q=await S.sb.from('attendance').select('id').eq('student_id',s.id).eq('attendance_date',date).maybeSingle();const o={student_id:s.id,attendance_date:date,status,marked_by:S.user.id,updated_at:new Date().toISOString()};const r=q.data?await S.sb.from('attendance').update(o).eq('id',q.data.id):await S.sb.from('attendance').insert(o);if(r.error)return toast(r.error.message,false)}toast('Attendance saved');loadAttendance()}
async function results(){await lookups();const groups=[...new Set(S.exams.map(e=>e.name+'||'+e.academic_year+'||'+e.class_id+'||'+e.section_id))];$("content").innerHTML=`<div class="card"><div class="toolbar"><div class="field" style="min-width:300px;flex:1"><label>Result Group</label><select id="resultGroup" onchange="loadResults()">${groups.map(g=>{const [n,y,c,s]=g.split('||');return `<option value="${esc(g)}">${esc(n)} — ${esc(y)} — ${C(c)} ${SEC(s)}</option>`}).join('')}</select></div><button class="secondary" onclick="exportResults('xlsx')">⇩ Excel</button><button class="secondary" onclick="exportResults('csv')">⇩ CSV</button><button class="ghost" onclick="window.print()">🖨 Print</button></div><div id="resultBody"></div></div>`;if(groups.length)await loadResults();else $("resultBody").innerHTML='<div class="notice">No examinations found.</div>'}
async function getResultData(group){const [name,year,classId,sectionId]=group.split('||');const ex=S.exams.filter(e=>e.name===name&&e.academic_year===year&&e.class_id===classId&&e.section_id===sectionId);const ids=ex.map(e=>e.id);const mr=ids.length?await S.sb.from('marks').select('*').in('examination_id',ids):{data:[]};if(mr.error)throw mr.error;const byEx=Object.fromEntries(ex.map(e=>[e.id,e]));const students=S.students.filter(s=>s.class_id===classId&&s.section_id===sectionId&&s.active!==false);const byStudent={};students.forEach(s=>byStudent[s.id]={student:s,subjects:[]});(mr.data||[]).forEach(m=>{if(!byStudent[m.student_id])return;const e=byEx[m.examination_id];byStudent[m.student_id].subjects.push({exam:e,mark:m,subject:SUB(e?.subject_id)})});const rows=Object.values(byStudent).map(x=>{const valid=x.subjects.filter(z=>z.mark.marks!==null&&z.mark.marks!==undefined&&z.mark.attendance_status!=='Absent');const total=valid.reduce((a,z)=>a+Number(z.mark.marks||0),0),max=valid.reduce((a,z)=>a+Number(z.mark.max_marks||z.exam.maximum_marks||0),0);const pct=max?total/max*100:0;const failed=x.subjects.some(z=>z.mark.attendance_status!=='Absent'&&z.mark.marks!==null&&Number(z.mark.marks)<Number(z.exam.pass_marks||0));const absent=x.subjects.some(z=>z.mark.attendance_status==='Absent');return {...x,total,max,pct,failed,absent}});rows.sort((a,b)=>b.pct-a.pct);rows.forEach((r,i)=>r.rank=i+1);return {name,year,classId,sectionId,ex,rows}}
function grade(p){if(p>=91)return'A1';if(p>=81)return'A2';if(p>=71)return'B1';if(p>=61)return'B2';if(p>=51)return'C1';if(p>=41)return'C2';if(p>=33)return'D';return'E'}
async function loadResults(){try{const d=await getResultData($("resultGroup").value);const appeared=d.rows.filter(r=>r.subjects.length&&r.subjects.some(z=>z.mark.marks!==null&&z.mark.attendance_status!=='Absent')).length;const passed=d.rows.filter(r=>r.subjects.length&&r.pct>=33&&!r.failed&&!r.absent).length;const avg=d.rows.length?d.rows.reduce((a,r)=>a+r.pct,0)/d.rows.length:0;const high=d.rows.length?Math.max(...d.rows.map(r=>r.pct)):0,low=d.rows.length?Math.min(...d.rows.map(r=>r.pct)):0;const subjectMap={};d.rows.forEach(r=>r.subjects.forEach(z=>{const k=z.exam.subject_id;if(!subjectMap[k])subjectMap[k]={name:z.subject,marks:[],max:[]};if(z.mark.marks!==null&&z.mark.attendance_status!=='Absent'){subjectMap[k].marks.push(Number(z.mark.marks));subjectMap[k].max.push(Number(z.mark.max_marks||z.exam.maximum_marks||100))}}));$("resultBody").innerHTML=`<div class="analysis">${[['Students',d.rows.length],['Appeared',appeared],['Passed',passed],['Failed',d.rows.filter(r=>r.failed||r.absent).length],['Pass %',d.rows.length?(passed/d.rows.length*100).toFixed(2)+'%':'0%'],['Average',avg.toFixed(2)+'%'],['Highest',high.toFixed(2)+'%'],['Lowest',low.toFixed(2)+'%']].map(x=>`<div class="card"><div class="mini">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div><div class="two"><div class="card"><h3>Subject-wise Analysis</h3>${Object.values(subjectMap).map(s=>{const p=s.marks.length?s.marks.reduce((a,v,i)=>a+v/s.max[i]*100,0)/s.marks.length:0;return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b><span>${p.toFixed(2)}%</span></div><div class="track"><div class="fill" style="width:${Math.min(100,p)}%"></div></div></div>`}).join('')||'<div class="mini">No marks entered.</div>'}</div><div class="card"><h3>Performance Summary</h3><p>Pass Rate: <b>${d.rows.length?(passed/d.rows.length*100).toFixed(2):0}%</b></p><p>Class Average: <b>${avg.toFixed(2)}%</b></p><p>Highest: <b>${high.toFixed(2)}%</b></p><p>Lowest: <b>${low.toFixed(2)}%</b></p></div></div><div class="section-title"><h3>Top Performers</h3></div>${tbl(['Rank','Roll','Name','Total','%','Grade','Status'],d.rows.slice(0,10).map(r=>`<tr><td>${r.rank}</td><td>${esc(r.student.roll_no)}</td><td>${esc(r.student.full_name)}</td><td>${r.total.toFixed(2)} / ${r.max.toFixed(2)}</td><td>${r.pct.toFixed(2)}%</td><td>${grade(r.pct)}</td><td>${r.failed||r.absent?'<span class="badge danger">FAIL</span>':'<span class="badge">PASS</span>'}</td></tr>`).join(''))}<div class="section-title"><h3>Student-wise Consolidated Result</h3><button class="primary" onclick="generateAllReportCards()">Generate All Report Cards</button></div>${tbl(['Rank','Roll','Admission','Name','Subjects','Total','%','Grade','Status','Report'],d.rows.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.student.roll_no)}</td><td>${esc(r.student.admission_no)}</td><td>${esc(r.student.full_name)}</td><td>${r.subjects.length}</td><td>${r.total.toFixed(2)} / ${r.max.toFixed(2)}</td><td>${r.pct.toFixed(2)}%</td><td>${grade(r.pct)}</td><td>${r.failed||r.absent?'<span class="badge danger">FAIL</span>':'<span class="badge">PASS</span>'}</td><td><button class="secondary" onclick="openReport('${r.student.id}','${esc($("resultGroup").value)}')">PDF/Web</button></td></tr>`).join(''))}`;S.currentResult=d}catch(e){$("resultBody").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function exportResults(type){const d=S.currentResult;if(!d)return toast('Load results first',false);const rows=d.rows.map(r=>({Rank:r.rank,Roll:r.student.roll_no,Admission:r.student.admission_no,Name:r.student.full_name,Subjects:r.subjects.length,Total:r.total,Max:r.max,Percentage:+r.pct.toFixed(2),Grade:grade(r.pct),Status:r.failed||r.absent?'FAIL':'PASS'}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');XLSX.writeFile(wb,`result_${d.name}_${d.classId}.xlsx`)}
async function reports(){await lookups();const groups=[...new Set(S.exams.map(e=>e.name+'||'+e.academic_year+'||'+e.class_id+'||'+e.section_id))];$("content").innerHTML=`<div class="card"><div class="toolbar"><div class="field" style="min-width:300px;flex:1"><label>Examination Group</label><select id="rcGroup" onchange="loadReportStudents()">${groups.map(g=>{const [n,y,c,s]=g.split('||');return `<option value="${esc(g)}">${esc(n)} — ${esc(y)} — ${C(c)} ${SEC(s)}</option>`}).join('')}</select></div><button class="ghost" onclick="window.print()">Print</button></div><div id="rcStudents"></div></div>`;if(groups.length)loadReportStudents()}
async function loadReportStudents(){const g=$("rcGroup").value,d=await getResultData(g);$("rcStudents").innerHTML=tbl(['Roll','Admission','Student','Subjects','Percentage','Grade','Action'],d.rows.map(r=>`<tr><td>${esc(r.student.roll_no)}</td><td>${esc(r.student.admission_no)}</td><td>${esc(r.student.full_name)}</td><td>${r.subjects.length}</td><td>${r.pct.toFixed(2)}%</td><td>${grade(r.pct)}</td><td><button class="secondary" onclick="openReport('${r.student.id}','${esc(g)}')">View Report</button></td></tr>`).join(''))}
async function openReport(studentId,group){const d=await getResultData(group),r=d.rows.find(x=>x.student.id===studentId);if(!r)return toast('Student result not found',false);const rows=r.subjects.slice().sort((a,b)=>a.subject.localeCompare(b.subject));const subjectRows=rows.map(z=>`<tr><td>${esc(z.subject)}</td><td>${z.mark.marks??'—'}</td><td>${z.mark.max_marks||z.exam.maximum_marks}</td><td>${z.mark.marks!=null?(Number(z.mark.marks)/Number(z.mark.max_marks||z.exam.maximum_marks)*100).toFixed(1):'—'}</td><td>${z.mark.marks!=null?grade(Number(z.mark.marks)/Number(z.mark.max_marks||z.exam.maximum_marks)*100):'—'}</td><td>${z.mark.attendance_status==='Absent'?'ABSENT':(z.mark.marks!=null&&Number(z.mark.marks)>=Number(z.exam.pass_marks||0)?'PASS':'FAIL')}</td></tr>`).join('');modal('Student Progress Report',`<div id="reportArea" class="report"><div style="text-align:center"><h2>${SCHOOL}</h2><h3>STUDENT PROGRESS REPORT</h3><div>Academic Year: ${esc(d.year)}</div></div><hr><div class="two"><div><b>Student:</b> ${esc(r.student.full_name)}<br><b>Admission No:</b> ${esc(r.student.admission_no)}<br><b>Roll No:</b> ${esc(r.student.roll_no)}<br><b>Class:</b> ${esc(C(r.student.class_id))} &nbsp; <b>Section:</b> ${esc(SEC(r.student.section_id))}<br><b>House:</b> ${esc(r.student.house)}</div><div><b>Examination:</b> ${esc(d.name)}<br><b>Exam Group:</b> ${esc(d.year)}<br><b>Result Rank:</b> ${r.rank}<br><b>Percentage:</b> ${r.pct.toFixed(2)}%<br><b>Grade:</b> ${grade(r.pct)}</div></div><div class="section-title"><h3>Scholastic Areas — All Subjects</h3></div><table><thead><tr><th>Subject</th><th>Marks</th><th>Max</th><th>%</th><th>Grade</th><th>Result</th></tr></thead><tbody>${subjectRows||'<tr><td colspan="6">No marks entered.</td></tr>'}</tbody></table><div style="margin-top:18px"><b>Overall Total:</b> ${r.total.toFixed(2)} / ${r.max.toFixed(2)} &nbsp;&nbsp; <b>Percentage:</b> ${r.pct.toFixed(2)}% &nbsp;&nbsp; <b>Grade:</b> ${grade(r.pct)} &nbsp;&nbsp; <b>Result:</b> ${r.failed||r.absent?'FAIL':'PASS'}</div><div class="section-title"><h3>Co-Scholastic & Holistic Development</h3></div><table><tbody>${['Work Education','Art Education','Health & Physical Education','Discipline','Co-Curricular Activities (CCA)','Yoga','Sports','Health Status'].map(x=>`<tr><td>${x}</td><td>—</td></tr>`).join('')}</tbody></table><div class="sign"><div>Class Teacher</div><div>Principal</div></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:12px"><button class="secondary" onclick="printReport()">Print</button><button class="primary" onclick="downloadReportPDF()">Download PDF</button></div>`)}
function printReport(){const r=$("reportArea");if(!r)return;const w=window.open('','_blank');w.document.write(`<html><head><title>Student Report</title><style>body{font-family:Arial;padding:25px}.report{max-width:900px;margin:auto}.report table{width:100%;border-collapse:collapse}.report th,.report td{border:1px solid #aaa;padding:7px;font-size:12px}.report th{background:#eef5f0}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:60px;text-align:center}.sign div{border-top:1px solid #555;padding-top:5px}</style></head><body>${r.outerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function downloadReportPDF(){const r=$("reportArea");if(!r||!window.jspdf)return toast('PDF library unavailable',false);const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});let y=40;doc.setFontSize(14);doc.text(SCHOOL,40,y);y+=22;doc.setFontSize(12);doc.text('STUDENT PROGRESS REPORT',40,y);y+=20;const text=r.innerText.split('\n').map(x=>x.trim()).filter(Boolean);doc.setFontSize(9);for(const line of text){const parts=doc.splitTextToSize(line,510);for(const p of parts){if(y>780){doc.addPage();y=40}doc.text(p,40,y);y+=12}}doc.save('student_report.pdf')}
async function generateAllReportCards(){if(!S.currentResult)return toast('Load results first',false);toast('Use individual PDF buttons for browser-safe generation. Bulk export is available from Results Excel.')}
async function questions(){simple('Question Bank','Question bank table is connected. Fields include subject, question type, difficulty, chapter, marks and answer key.');}
function simple(title,text){$("content").innerHTML=`<div class="card"><h3>${title}</h3><div class="notice">${text}</div></div>`}
function ai(){simple('AI Assistant','Use this area for future AI-generated notices, result observations, remedial plans and school reports.');}
async function del(table,id,label){if(!confirm(`Delete ${label}? This action cannot be undone.`))return;const r=await S.sb.from(table).delete().eq('id',id);if(r.error)return toast(r.error.message,false);toast(label+' deleted');go(S.page)}
window.addEventListener('error',e=>{console.error(e.error||e.message)});window.addEventListener('unhandledrejection',e=>console.error(e.reason));
init();
</script></body></html>
