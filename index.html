<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JNV Result Automation 2026–27</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--g:#103d29;--g2:#236344;--bg:#f4f7f5;--card:#fff;--txt:#18231d;--muted:#69766f;--line:#dce5df;--ok:#187a45;--danger:#b3261e;--warn:#9a6500}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login-wrap{min-height:100vh;background:linear-gradient(145deg,#092f1e,#174d31);display:grid;place-items:center;padding:20px}.login{width:min(500px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 25px 70px #0005}.login-logo{width:112px;height:112px;border-radius:50%;background:#edf4ef;display:grid;place-items:center;margin:auto;font-size:43px;font-weight:850;color:var(--g)}
h1{font-size:31px;line-height:1.05;margin:18px 0 8px;text-align:center}.sub,.year{text-align:center;color:var(--muted)}.year{font-weight:800}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}.field textarea{min-height:80px}
.primary{background:var(--g);color:#fff;padding:11px 16px;border-radius:11px;font-weight:750}.primary.full{width:100%}.secondary{background:#eaf2ed;color:var(--g);padding:10px 14px;border-radius:10px;font-weight:750}.danger{background:#fff0ef;color:var(--danger);padding:10px 14px;border-radius:10px;font-weight:750}.ghost{background:#fff;border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;font-weight:700}.err{color:var(--danger);font-weight:650;margin-top:12px}.hint{color:var(--muted);font-size:12px;margin-top:12px}
.app{display:flex;min-height:100vh}.side{width:250px;background:#103a25;color:#fff;padding:16px;position:fixed;inset:0 auto 0 0;z-index:10;overflow:auto}.brand{font-size:22px;font-weight:850;margin:8px 8px 20px}.school-mini{font-size:11px;color:#b9d1c4;padding:0 8px 16px;line-height:1.35}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dceae2;padding:11px;border-radius:10px;margin:2px 0}.nav button.active,.nav button:hover{background:#285d41;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.top h2{margin:0;font-size:29px}.role{background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 3px 14px #173a2010}.kpi .label{color:var(--muted)}.kpi .num{font-size:34px;font-weight:850;margin-top:6px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 11px}.section-title h3{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{background:#f4f7f5;font-size:12px;position:sticky;top:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:800}.badge.warn{background:#fff5dc;color:var(--warn)}.badge.danger{background:#fff0ef;color:var(--danger)}.empty{padding:32px;text-align:center;color:var(--muted)}.notice{background:#eef6f1;border:1px solid #d6e8dc;padding:14px;border-radius:14px;color:#24563c}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.quick .card{min-height:140px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:30}.modal-box{background:#fff;width:min(920px,100%);max-height:94vh;overflow:auto;border-radius:20px;padding:21px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:#eee;border-radius:50%;width:35px;height:35px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.import-box{border:2px dashed #c9d8cf;padding:22px;border-radius:15px;text-align:center;background:#f8fbf9}.sticky-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px;margin:12px -21px -21px;display:flex;gap:8px;justify-content:flex-end}.marks-table input{width:95px}.small{font-size:12px}.photo-thumb{width:44px;height:54px;object-fit:cover;border:1px solid var(--line);border-radius:6px}.branding-preview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;align-items:center;text-align:center}.branding-preview img{max-width:110px;max-height:90px;object-fit:contain}.logo-upload{display:flex;gap:12px;align-items:center}.logo-box{width:100px;height:80px;border:1px dashed #aaa;display:grid;place-items:center;background:#fafafa}.pill{padding:5px 9px;border-radius:999px;background:#eef5f0;font-size:11px;font-weight:700}
.report-card{background:#fff;border:1px solid #cfd8d2;padding:20px;max-width:900px;margin:auto}.report-head{display:grid;grid-template-columns:100px 1fr 100px;gap:15px;align-items:center;text-align:center}.report-head img{max-width:90px;max-height:90px;object-fit:contain}.report-title{font-weight:850;font-size:18px}.report-table{width:100%;border-collapse:collapse;margin-top:8px}.report-table th,.report-table td{border:1px solid #cbd5cf;padding:5px;font-size:11px}.report-table th{background:#eef4f0}.student-photo{width:92px;height:110px;object-fit:cover;border:1px solid #777}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:38px;text-align:center}.sig-line{border-top:1px solid #555;padding-top:7px}.report-actions{display:flex;gap:8px;justify-content:center;margin-top:15px}
@media(max-width:900px){.side{width:72px;padding:9px}.brand{font-size:0;text-align:center}.brand:after{content:"JNV";font-size:19px}.school-mini{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:24px}.main{margin-left:72px;width:calc(100% - 72px);padding:14px}.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid,.quick{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.login{padding:25px}.report-head{grid-template-columns:70px 1fr 90px}.signatures{gap:20px}.report-card{padding:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CONFIG={
 SUPABASE_URL:"https://mnilsvgjuwnniquukedk.supabase.co",
 SUPABASE_ANON_KEY:"sb_publishable_7chu45G-OQ6LfdEd4rL-qw_V1VNNbXi"
};
const DEFAULT_SCHOOL="PM SHRI Jawahar Navodaya Vidyalaya, Wargal, Siddipet";
const YEAR="2026-27";
const state={sb:null,user:null,profile:null,page:"dashboard",settings:{school_name:DEFAULT_SCHOOL,logo_left:"",logo_right:"",vp_signature:"",principal_signature:""},classes:[],sections:[],students:[],subjects:[],exams:[],teachers:[],assignments:[],resultRows:[]};
let importRows=[],teacherRows=[],assignmentRows=[];

function $(id){return document.getElementById(id)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function isAdmin(){return String(state.profile?.role||"teacher").toLowerCase()==="admin"}
function schoolName(){return state.settings.school_name||DEFAULT_SCHOOL}
function toast(msg,ok=true){const e=$("toast");if(!e)return;e.textContent=msg;e.style.background=ok?"#187a45":"#b3261e";e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),3500)}
function nav(page,label,icon){return `<button class="${state.page===page?"active":""}" onclick="go('${page}')">${icon} &nbsp;${label}</button>`}
function imgOrPlaceholder(url,label){return url?`<img src="${esc(url)}" alt="${esc(label)}">`:`<div style="font-weight:800;color:#777">${esc(label)}</div>`}
function loginHTML(){return `<div class="login-wrap"><div class="login"><div class="login-logo">JNV</div><h1>JNV Result Automation</h1><div class="sub">Online Multi-User School Result System</div><div class="year">Academic Year ${YEAR}</div><div class="field"><label>Email address</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="signBtn" class="primary full" onclick="signIn()">Sign in</button><button class="ghost full" style="margin-top:8px;width:100%" onclick="resetPassword()">Forgot password?</button><div id="loginErr" class="err"></div></div></div>`}
function shellHTML(){return `<div class="app"><aside class="side"><div class="brand">JNV Result</div><div class="school-mini">${esc(schoolName())}<br>Academic Year ${YEAR}</div><div class="nav">
${nav("dashboard","Dashboard","▣")}${nav("students","Students","●")}${nav("classes","Classes & Sections","◆")}${nav("subjects","Subjects","◇")}${nav("exams","Examinations","▤")}${nav("marks","Marks Entry","✎")}${nav("attendance","Attendance","✓")}${nav("coscholastic","Co-Scholastic","◆")}${nav("results","Results & Analytics","★")}${nav("reports","Report Cards","▧")}${isAdmin()?nav("teachers","Teachers","♟"):""}${isAdmin()?nav("assign","Assignments","⇄"):""}${isAdmin()?nav("settings","School & Branding","⚙"):""}<button onclick="signOut()">⇥ Sign out</button>
</div></aside><main class="main"><div class="top"><div><h2 id="pageTitle">Dashboard</h2><div style="color:var(--muted);font-size:13px">${esc(schoolName())}</div></div><div class="role">${esc(state.profile?.designation||state.profile?.role||"teacher")} · ${esc(state.profile?.full_name||"")}</div></div><div id="content"></div></main></div><div id="modal"></div><div id="toast" class="hidden" style="position:fixed;right:18px;bottom:18px;color:#fff;padding:12px 16px;border-radius:10px;z-index:50;font-weight:750"></div>`}

async function init(){
 state.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
 const {data:{session}}=await state.sb.auth.getSession();
 if(!session){document.body.innerHTML=loginHTML();return}
 state.user=session.user;await loadProfile();await loadSettings();renderShell();await go("dashboard");
 state.sb.auth.onAuthStateChange((_e,s)=>{state.user=s?.user||null;if(!s)location.reload()});
}
async function signIn(){
 const err=$("loginErr"),btn=$("signBtn");err.textContent="";
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){err.textContent="Please enter both email and password.";return}
 btn.disabled=true;btn.textContent="Signing in…";
 try{const {data,error}=await state.sb.auth.signInWithPassword({email,password});if(error)throw error;state.user=data.user;await loadProfile();await loadSettings();renderShell();await go("dashboard")}
 catch(e){err.textContent="Sign-in error: "+(e?.message||e)}
 finally{btn.disabled=false;btn.textContent="Sign in"}
}
async function resetPassword(){const email=$("email").value.trim(),err=$("loginErr");if(!email){err.textContent="Enter email first.";return}const {error}=await state.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});err.textContent=error?"Reset error: "+error.message:"Password reset email sent."}
async function signOut(){await state.sb.auth.signOut();location.reload()}
async function loadProfile(){const r=await state.sb.from("profiles").select("*").eq("id",state.user.id).maybeSingle();state.profile=r.data||{role:"teacher",full_name:state.user.email}}
async function loadSettings(){try{const r=await state.sb.from("school_settings").select("*").limit(1).maybeSingle();if(r.data)state.settings={...state.settings,...r.data}}catch(e){}}
function renderShell(){document.body.innerHTML=shellHTML()}
async function go(page){
 state.page=page;renderShell();$("content").innerHTML='<div class="card">Loading…</div>';
 const titles={dashboard:"Dashboard",students:"Students",classes:"Classes & Sections",subjects:"Subjects",exams:"Examinations",marks:"Marks Entry",attendance:"Attendance",coscholastic:"Co-Scholastic Grades",results:"Results & Analytics",reports:"Report Cards",teachers:"Teachers",assign:"Teacher Assignments",settings:"School & Branding"};
 $("pageTitle").textContent=titles[page]||"JNV Result";
 try{
  if(page==="dashboard")await dashboard();else if(page==="students")await students();else if(page==="classes")await classes();else if(page==="subjects")await subjects();else if(page==="exams")await exams();else if(page==="marks")await marks();else if(page==="attendance")await attendance();else if(page==="coscholastic")await coscholastic();else if(page==="results")await results();else if(page==="reports")await reports();else if(page==="teachers")await teachers();else if(page==="assign")await assignments();else if(page==="settings")await settingsPage();
 }catch(e){$("content").innerHTML=`<div class="card"><b>Module error</b><div class="err">${esc(e.message||e)}</div></div>`}
}
async function count(table){const r=await state.sb.from(table).select("*",{count:"exact",head:true});if(r.error)throw r.error;return r.count||0}
async function dashboard(){
 const vals=await Promise.all(["students","classes","subjects","examinations"].map(count));
 $("content").innerHTML=`<div class="grid">${["Students","Classes","Subjects","Examinations"].map((x,i)=>`<div class="card kpi"><div class="label">${x}</div><div class="num">${vals[i]}</div></div>`).join("")}</div>
 <div class="section-title"><h3>Quick actions</h3></div><div class="quick">
 <div class="card"><h3>Students</h3><p>Individual entry, edit, delete and CSV bulk upload.</p><button class="secondary" onclick="go('students')">Open Students</button></div>
 <div class="card"><h3>Marks Entry</h3><p>Exam, class, section and subject-wise marks entry.</p><button class="secondary" onclick="go('marks')">Enter Marks</button></div>
 <div class="card"><h3>Attendance</h3><p>Daily attendance with term totals and percentage.</p><button class="secondary" onclick="go('attendance')">Open Attendance</button></div>
 <div class="card"><h3>Report Cards</h3><p>JNV-style report card with logos, student photo and signatures.</p><button class="secondary" onclick="go('reports')">Open Report Cards</button></div></div>
 <div class="section-title"><h3>Workflow</h3></div><div class="notice">Admin: Classes → Sections → Subjects → Students → Teachers → Assignments → Examinations → Marks → Attendance → Co-Scholastic → Results → Report Cards.</div>`;
}
async function loadLookups(){
 const [c,s,st,sub,e,t,a]=await Promise.all([
  state.sb.from("classes").select("*").order("display_order",{ascending:true}),
  state.sb.from("sections").select("*").order("name"),
  state.sb.from("students").select("*").order("roll_no"),
  state.sb.from("subjects").select("*").order("name"),
  state.sb.from("examinations").select("*").order("exam_date",{ascending:false}),
  state.sb.from("profiles").select("*").order("full_name"),
  state.sb.from("teacher_subjects").select("*")
 ]);
 if(c.error)throw c.error;if(s.error)throw s.error;if(st.error)throw st.error;if(sub.error)throw sub.error;if(e.error)throw e.error;
 state.classes=c.data||[];state.sections=s.data||[];state.students=st.data||[];state.subjects=sub.data||[];state.exams=e.data||[];state.teachers=t.data||[];state.assignments=a.data||[];
}
function className(id){return state.classes.find(x=>x.id===id)?.name||id||""}
function sectionName(id){return state.sections.find(x=>x.id===id)?.name||id||""}
function subjectName(id){return state.subjects.find(x=>x.id===id)?.name||id||""}
function teacherName(id){return state.teachers.find(x=>x.id===id)?.full_name||id||""}
function sectionsFor(classId){return state.sections.filter(s=>s.class_id===classId&&s.active!==false)}

async function students(){
 await loadLookups();
 $("content").innerHTML=`<div class="toolbar"><input id="studentSearch" placeholder="Search name / roll / admission" oninput="filterStudents()">${isAdmin()?'<button class="primary" onclick="studentModal()">+ Add Student</button><button class="secondary" onclick="importStudentsModal()">⇧ Bulk Upload</button><button class="ghost" onclick="downloadStudentTemplate()">⇩ Template</button>':""}</div><div id="studentTable"></div>`;
 renderStudentTable();
}
function filterStudents(){renderStudentTable(($("studentSearch")?.value||"").toLowerCase())}
function renderStudentTable(q=""){
 const d=state.students.filter(s=>!q||[s.full_name,s.roll_no,s.admission_no,s.apar_id,className(s.class_id),sectionName(s.section_id)].some(x=>String(x||"").toLowerCase().includes(q)));
 $("studentTable").innerHTML=d.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Photo</th><th>Roll</th><th>Admission</th><th>Name</th><th>Class</th><th>Section</th><th>APAAR ID</th><th>House</th><th>Action</th></tr></thead><tbody>${d.map(s=>`<tr><td>${s.photo_url?`<img class="photo-thumb" src="${esc(s.photo_url)}">`:"—"}</td><td>${esc(s.roll_no)}</td><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(className(s.class_id))}</td><td>${esc(sectionName(s.section_id))}</td><td>${esc(s.apar_id)}</td><td>${esc(s.house)}</td><td class="actions">${isAdmin()?`<button class="secondary" onclick="studentModal('${s.id}')">Edit</button><button class="danger" onclick="deleteStudent('${s.id}')">Delete</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:'<div class="card empty">No students found.</div>';
}
function studentModal(id=""){
 const s=state.students.find(x=>x.id===id)||{};
 $("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>${id?"Edit":"Add"} Student</h3><button class="close" onclick="closeModal()">×</button></div>
 <div class="form-grid"><div class="field"><label>Admission No *</label><input id="s_adm" value="${esc(s.admission_no)}"></div><div class="field"><label>Roll No *</label><input id="s_roll" value="${esc(s.roll_no)}"></div><div class="field full"><label>Full Name *</label><input id="s_name" value="${esc(s.full_name)}"></div>
 <div class="field"><label>Gender</label><select id="s_gender"><option value="">Select</option><option ${s.gender==="Male"?"selected":""}>Male</option><option ${s.gender==="Female"?"selected":""}>Female</option></select></div><div class="field"><label>Date of Birth</label><input id="s_dob" type="date" value="${esc(s.date_of_birth)}"></div>
 <div class="field"><label>Class *</label><select id="s_class" onchange="studentSectionOptions()">${state.classes.map(x=>`<option value="${x.id}" ${s.class_id===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section *</label><select id="s_section">${sectionsFor(s.class_id||state.classes[0]?.id).map(x=>`<option value="${x.id}" ${s.section_id===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
 <div class="field"><label>APAAR ID</label><input id="s_apar" value="${esc(s.apar_id)}"></div><div class="field"><label>House</label><input id="s_house" value="${esc(s.house)}"></div><div class="field"><label>Father Name</label><input id="s_father" value="${esc(s.father_name)}"></div><div class="field"><label>Mother Name</label><input id="s_mother" value="${esc(s.mother_name)}"></div>
 <div class="field full"><label>Student Photo</label><input id="s_photo_file" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewStudentPhoto(event)"><div class="small">Choose a JPG, PNG or WEBP photo (maximum 2 MB).</div><div id="studentPhotoPreview" style="margin-top:10px;">${s.photo_url?`<img src="${esc(s.photo_url)}" style="width:90px;height:110px;object-fit:cover;border:1px solid #ccc;border-radius:6px"><div class="small">Existing photo. Choose a new file to replace it.</div>`:`<div class="small">No photo uploaded.</div>`}</div></div></div>
 <button class="primary full" onclick="saveStudent('${id}')">Save Student</button></div></div>`;
}
function previewStudentPhoto(e){const f=e.target.files?.[0];if(!f)return;if(!["image/jpeg","image/png","image/webp"].includes(f.type)){toast("Please select JPG, PNG or WEBP image.",false);e.target.value="";return}if(f.size>2*1024*1024){toast("Student photo must be below 2 MB.",false);e.target.value="";return}const r=new FileReader();r.onload=ev=>{$("studentPhotoPreview").innerHTML=`<img src="${ev.target.result}" style="width:90px;height:110px;object-fit:cover;border:1px solid #ccc;border-radius:6px"><div class="small">Photo selected. Click Save Student to upload.</div>`};r.readAsDataURL(f)}
async function uploadStudentPhoto(studentId,file){if(!file)return null;const allowed=["image/jpeg","image/png","image/webp"];if(!allowed.includes(file.type))throw new Error("Only JPG, PNG and WEBP images are allowed.");if(file.size>2*1024*1024)throw new Error("Student photo must be below 2 MB.");const ext=file.name.split(".").pop().toLowerCase();const path=`${studentId}/${Date.now()}.${ext}`;const u=await state.sb.storage.from("student-photos").upload(path,file,{cacheControl:"3600",upsert:true,contentType:file.type});if(u.error)throw u.error;return state.sb.storage.from("student-photos").getPublicUrl(path).data.publicUrl}
function studentSectionOptions(){const cid=$("s_class").value,old=$("s_section").value;$("s_section").innerHTML=sectionsFor(cid).map(x=>`<option value="${x.id}" ${old===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}
async function saveStudent(id){
 try{
  const x={admission_no:$("s_adm").value.trim(),roll_no:$("s_roll").value.trim(),full_name:$("s_name").value.trim(),gender:$("s_gender").value||null,date_of_birth:$("s_dob").value||null,class_id:$("s_class").value||null,section_id:$("s_section").value||null,apar_id:$("s_apar").value.trim()||null,house:$("s_house").value.trim()||null,father_name:$("s_father").value.trim()||null,mother_name:$("s_mother").value.trim()||null};
  if(!x.admission_no||!x.roll_no||!x.full_name){toast("Admission No, Roll No and Name are required",false);return}
  let studentId=id;
  if(id){const r=await state.sb.from("students").update(x).eq("id",id).select("id").single();if(r.error){toast(r.error.message,false);return}studentId=r.data.id}else{const r=await state.sb.from("students").insert(x).select("id").single();if(r.error){toast(r.error.message,false);return}studentId=r.data.id}
  const input=$("s_photo_file");

async function loadMarksGrid(){
 const ex=$("m_exam")?.value,cl=$("m_class")?.value,se=$("m_section")?.value,sub=$("m_subject")?.value;if(!ex||!cl||!se||!sub)return;
 if(!teacherAllowed(sub,cl,se)){$("marksGrid").innerHTML='<div class="card empty">Teacher is not assigned to this subject/class/section.</div>';return}
 const students=state.students.filter(s=>s.class_id===cl&&s.section_id===se).sort((a,b)=>String(a.roll_no).localeCompare(String(b.roll_no),undefined,{numeric:true}));
 const mr=await state.sb.from("marks").select("*").eq("examination_id",ex).eq("subject_id",sub);if(mr.error){$("marksGrid").innerHTML=`<div class="card err">${esc(mr.error.message)}</div>`;return}
 const map=new Map((mr.data||[]).map(x=>[x.student_id,x]));
 $("marksGrid").innerHTML=`<div class="section-title"><h3>${esc(subjectName(sub))} — ${esc(className(cl))} ${esc(sectionName(se))}</h3><div><button class="secondary" onclick="saveMarks(false)">Save Draft</button><button class="primary" style="margin-left:6px" onclick="saveMarks(true)">Submit Marks</button></div></div><div class="table-wrap marks-table"><table class="table"><thead><tr><th>Roll</th><th>Admission</th><th>Student</th><th>Max</th><th>Marks</th><th>Attendance</th><th>Status</th></tr></thead><tbody>${students.map(s=>{const m=map.get(s.id);return `<tr><td>${esc(s.roll_no)}</td><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td><input class="maxmark" data-id="${s.id}" type="number" value="${m?.max_marks??100}" min="0"></td><td><input class="markval" data-id="${s.id}" type="number" value="${m?.marks??""}" min="0"></td><td><select class="attval" data-id="${s.id}"><option ${!m||m.attendance_status==="Present"?"selected":""}>Present</option><option ${m?.attendance_status==="Absent"?"selected":""}>Absent</option></select></td><td>${m?.status?`<span class="badge ${m.status==="submitted"?"":"warn"}">${esc(m.status)}</span>`:"<span class='badge'>New</span>"}</td></tr>`}).join("")}</tbody></table></div>`;
}
async function saveMarks(submit){
 const ex=$("m_exam").value,sub=$("m_subject").value,ids=[...document.querySelectorAll(".markval")].map(e=>e.dataset.id),rows=[];
 for(const id of ids){const markEl=document.querySelector(`.markval[data-id="${id}"]`),maxEl=document.querySelector(`.maxmark[data-id="${id}"]`),att=document.querySelector(`.attval[data-id="${id}"]`);const raw=markEl.value.trim();if(raw===""&&att.value==="Present")continue;const marks=raw===""?0:Number(raw),max_marks=Number(maxEl.value)||100;if(marks<0||marks>max_marks){toast("Invalid marks",false);return}rows.push({examination_id:ex,subject_id:sub,student_id:id,marks,max_marks,attendance_status:att.value,status:submit?"submitted":"draft",entered_by:state.user.id,entered_at:new Date().toISOString(),updated_at:new Date().toISOString()})}
 if(!rows.length){toast("No marks entered",false);return}
 for(const row of rows){const old=await state.sb.from("marks").select("id").eq("examination_id",row.examination_id).eq("subject_id",row.subject_id).eq("student_id",row.student_id).maybeSingle();if(old.error){toast(old.error.message,false);return}const r=old.data?await state.sb.from("marks").update(row).eq("id",old.data.id):await state.sb.from("marks").insert(row);if(r.error){toast("Save failed: "+r.error.message,false);return}}
 toast(`${rows.length} marks ${submit?"submitted":"saved"}`);loadMarksGrid();
}

function grade(p){return p>=90?"A1":p>=80?"A2":p>=70?"B1":p>=60?"B2":p>=50?"C":p>=40?"D":p>=33?"E":"F"}
async function buildResults(){
 const ex=$("r_exam").value,cl=$("r_class").value,se=$("r_section").value;let st=state.students.filter(s=>(!cl||s.class_id===cl)&&(!se||s.section_id===se));
 if(!isAdmin())st=st.filter(s=>state.assignments.some(a=>a.teacher_id===state.user.id&&a.class_id===s.class_id&&a.section_id===s.section_id&&a.active!==false));
 const mr=await state.sb.from("marks").select("student_id,marks,max_marks,subject_id,status,attendance_status").eq("examination_id",ex);if(mr.error)throw mr.error;
 const by=new Map();(mr.data||[]).forEach(m=>{if(!by.has(m.student_id))by.set(m.student_id,[]);by.get(m.student_id).push(m)});
 const rows=st.map(s=>{const a=by.get(s.id)||[],ev=a.filter(m=>m.attendance_status!=="Absent"),total=ev.reduce((x,m)=>x+(Number(m.marks)||0),0),max=ev.reduce((x,m)=>x+(Number(m.max_marks)||100),0),pct=max?total/max*100:0;return {...s,total,max,pct,grade:grade(pct),status:pct>=33?"PASS":"FAIL",entered:a.length}}).sort((a,b)=>b.pct-a.pct);
 rows.forEach((r,i)=>r.rank=r.pct>0?i+1:"—");state.resultRows=rows;
 $("resultTable").innerHTML=`<div class="toolbar"><button class="secondary" onclick="exportResults()">⇩ Export CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Roll</th><th>Name</th><th>Subjects</th><th>Total</th><th>%</th><th>Grade</th><th>Result</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.roll_no)}</td><td>${esc(r.full_name)}</td><td>${r.entered}</td><td>${r.total}/${r.max}</td><td>${r.pct.toFixed(2)}</td><td>${r.grade}</td><td><span class="badge ${r.status==="FAIL"?"danger":""}">${r.status}</span></td><td><button class="secondary" onclick="openReport('${r.id}','${ex}')">Report Card</button></td></tr>`).join("")}</tbody></table></div>`;
}
function exportResults(){const rows=state.resultRows||[];const csv=["Rank,Roll,Admission,Name,Total,Max,Percentage,Grade,Status",...rows.map(r=>[r.rank,r.roll_no,r.admission_no,`"${String(r.full_name).replaceAll('"','""')}"`,r.total,r.max,r.pct.toFixed(2),r.grade,r.status].join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="JNV_Consolidated_Result.csv";a.click()}

 <div style="margin-top:12px;font-size:11px"><b>Result:</b> ${pct>=33?"PASS":"FAIL"} &nbsp; <b>Percentage:</b> ${pct.toFixed(2)}% &nbsp; <b>Grade:</b> ${grade(pct)} &nbsp; <b>Rank:</b> ${rank}</div>
 <div class="signatures"><div><div style="height:55px">${state.settings.vp_signature?`<img src="${esc(state.settings.vp_signature)}" style="max-height:50px;max-width:150px">`:""}</div><div class="sig-line">Signature of Vice Principal</div></div><div><div style="height:55px">${state.settings.principal_signature?`<img src="${esc(state.settings.principal_signature)}" style="max-height:50px;max-width:150px">`:""}</div><div class="sig-line">Signature of Principal</div></div></div>
 <div class="report-actions"><button class="primary" onclick="printReport()">Print Report Card</button><button class="secondary" onclick="downloadReportPDF()">Download PDF</button></div></div>`;
}
function printReport(){const html=$("printReport")?.outerHTML;if(!html)return;const w=window.open("","_blank");w.document.write(`<html><head><title>Report Card</title><style>body{font-family:Arial;padding:20px}.report-card{max-width:900px;margin:auto}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{border:1px solid #777;padding:5px;font-size:11px}.report-head{display:grid;grid-template-columns:100px 1fr 100px;align-items:center;text-align:center}.report-head img{max-width:90px;max-height:90px}.student-photo{width:92px;height:110px;object-fit:cover;border:1px solid #777}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:38px;text-align:center}.sig-line{border-top:1px solid #555;padding-top:7px}.report-actions{display:none}</style></head><body>${html}</body></html>`);w.document.close();w.print()}
function downloadReportPDF(){printReport()}

async function settingsPage(){
 if(!isAdmin()){toast("Admin access required",false);return}
 $("content").innerHTML=`<div class="card"><div class="section-title"><h3>School Name & Report Card Branding</h3></div><div class="field"><label>School Name</label><input id="set_school" value="${esc(schoolName())}"></div><div class="branding-preview"><div><b>Top Left Logo</b><div class="logo-box">${imgOrPlaceholder(state.settings.logo_left,"Logo")}</div><input id="set_left" type="file" accept="image/*" style="margin-top:8px"></div><div><b>Student Photo</b><div class="logo-box">Uploaded in Student record</div></div><div><b>Top Right Logo</b><div class="logo-box">${imgOrPlaceholder(state.settings.logo_right,"PM SHRI")}</div><input id="set_right" type="file" accept="image/*" style="margin-top:8px"></div></div>
 <div class="form-grid" style="margin-top:20px"><div class="field"><label>Vice Principal Signature Image URL</label><input id="set_vp" value="${esc(state.settings.vp_signature)}"></div><div class="field"><label>Principal Signature Image URL</label><input id="set_pr" value="${esc(state.settings.principal_signature)}"></div></div>
 <div class="notice">Report card order: <b>Vice Principal signature on the left and Principal signature on the right</b>. Student photo is beside the APAAR/details block.</div>
 <button class="primary" onclick="saveSettings()">Save Branding Settings</button></div>`;
}
async function saveSettings(){
 let left=state.settings.logo_left,right=state.settings.logo_right;
 for(const id of ["set_left","set_right"]){const f=$(id).files[0];if(f){const data=await fileToDataURL(f);if(id==="set_left")left=data;else right=data}}
 const row={school_name:$("set_school").value.trim()||DEFAULT_SCHOOL,logo_left:left,logo_right:right,vp_signature:$("set_vp").value.trim()||"",principal_signature:$("set_pr").value.trim()||""};
 const old=await state.sb.from("school_settings").select("id").limit(1).maybeSingle();
 const r=old.data?.id?await state.sb.from("school_settings").update(row).eq("id",old.data.id):await state.sb.from("school_settings").insert(row);
 if(r.error){toast("Branding save failed: "+r.error.message,false);return}
 state.settings={...state.settings,...row};renderShell();await go("settings");toast("School branding saved");
}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function closeModal(){$("modal").innerHTML=""}
init();
</script>
