adding:0 8px 16px;line-height:1.35}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dceae2;padding:11px;border-radius:10px;margin:2px 0;border:0}.nav button.active,.nav button:hover{background:#285d41;color:#fff}.main{margin-left:255px;width:calc(100% - 255px);padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.top h2{margin:0;font-size:29px}.role{background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 3px 14px #173a2010}.kpi .label{color:var(--muted)}.kpi .num{font-size:34px;font-weight:850;margin-top:6px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 11px}.section-title h3{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{background:#f4f7f5;font-size:12px;position:sticky;top:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:800}.badge.warn{background:#fff5dc;color:var(--warn)}.badge.danger{background:#fff0ef;color:var(--danger)}.empty{padding:32px;text-align:center;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.notice{background:#eef6f1;border:1px solid #d6e8dc;padding:14px;border-radius:14px;color:#24563c}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:30}.modal-box{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:21px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:#eee;border-radius:50%;width:35px;height:35px;border:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.import-box{border:2px dashed #c9d8cf;padding:22px;border-radius:15px;text-align:center;background:#f8fbf9}.analysis-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.metric-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.metric-line:last-child{border-bottom:0}.marks-table input{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px}.mini-track{width:120px;height:8px;background:#e8efeb;border-radius:99px;overflow:hidden}.mini-track>div{height:100%;background:var(--g2);border-radius:99px}.stat-pill{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fafcfb}.ai-box{background:linear-gradient(135deg,#eef7f1,#fff);border:1px solid #cfe2d5;border-radius:18px;padding:18px}.ai-output{white-space:pre-wrap;line-height:1.55;margin-top:12px}.toast{position:fixed;right:18px;bottom:18px;color:#fff;padding:12px 16px;border-radius:10px;z-index:50;font-weight:750}.search{min-width:220px}.menu-mobile{display:none}

<body><div id="root"></div><script>
const CONFIG={SUPABASE_URL:"https://mnilsvgjuwnniquukedk.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_7chu45G-OQ6LfdEd4rL-qw_V1VNNbXi"};
const SCHOOL="PM SHRI Jawahar Navodaya Vidyalaya, Wargal, Siddipet",YEAR="2026-27";
const state={sb:null,user:null,profile:null,page:"dashboard",classes:[],sections:[],students:[],subjects:[],exams:[],teachers:[],assignments:[],marks:[],resultRows:[],attendance:[]};
const $=id=>document.getElementById(id); const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const isAdmin=()=>String(state.profile?.role||"teacher").toLowerCase()==="admin";
function toast(msg,ok=true){const e=$("toast");if(!e)return;e.textContent=msg;e.style.background=ok?"#187a45":"#b3261e";e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),3200)}
function configured(){return CONFIG.SUPABASE_URL.startsWith("http")&&CONFIG.SUPABASE_ANON_KEY.length>30}
function loginHTML(){return `<div class="login-wrap"><div class="login"><div class="logo">SMART<br>SCHOOL</div><h1>Smart School AI</h1><div class="sub">School Management • Examination • Analytics</div><div class="year">${YEAR}</div><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="signBtn" class="primary full" onclick="signIn()">Sign in</button><button class="ghost full" style="margin-top:8px" onclick="resetPassword()">Forgot password?</button><div id="loginErr" class="err"></div><div class="hint">Authentication is handled by Supabase. Never share your password or OTP.</div></div></div>`}
function nav(page,label,icon){return `<button class="${state.page===page?"active":""}" onclick="go('${page}')">${icon} &nbsp;${label}</button>`}
function shellHTML(){return `<div class="app"><aside class="side"><div class="brand">Smart School</div><div class="school-mini">${SCHOOL}<br>Academic Year ${YEAR}</div><div class="nav">${nav("dashboard","Dashboard","▣")}${nav("students","Students","●")}${nav("classes","Classes & Sections","◆")}${nav("subjects","Subjects","◇")}${nav("teachers","Teachers","♟")}${nav("assign","Assignments","⇄")}${nav("exams","Examinations","▤")}${nav("marks","Marks Entry","✎")}${nav("attendance","Attendance","✓")}${nav("results","Results & Analytics","★")}${nav("questions","Question Bank","☷")}${nav("quiz","Online Quiz","⚡")}${nav("timetable","Timetable","▦")}${nav("certificates","Certificates","✦")}${nav("ai","AI Assistant","✧")}<button onclick="signOut()">⇥ Sign out</button></div></aside><main class="main"><div class="top"><div><h2 id="pageTitle">Dashboard</h2><div style="color:var(--muted);font-size:13px">${SCHOOL}</div></div><div class="role">${esc(state.profile?.full_name||state.user?.email||"")} · ${esc(state.profile?.role||"teacher")}</div></div><div id="content"></div></main></div><div id="modal"></div><div id="toast" class="toast hidden"></div>`}
async function init(){if(!configured()){document.body.innerHTML=loginHTML();return}if(!window.supabase?.createClient){document.body.innerHTML=loginHTML();return}state.sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);const {data:{session}}=await state.sb.auth.getSession();if(!session){document.body.innerHTML=loginHTML();$("password")?.addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});return}state.user=session.user;await loadProfile();renderShell();await go("dashboard");state.sb.auth.onAuthStateChange((_e,s)=>{state.user=s?.user||null;if(!s)location.reload()})}
async function signIn(){const err=$("loginErr"),btn=$("signBtn");err.textContent="";const email=$("email").value.trim().toLowerCase(),password=$("password").value;if(!email||!password){err.textContent="Enter email and password.";return}btn.disabled=true;btn.textContent="Signing in…";try{const {data,error}=await state.sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.user){throw new Error("No user session returned.")}state.user=data.user;await loadProfile();renderShell();await go("dashboard")}catch(e){err.textContent=e.message||String(e)}finally{btn.disabled=false;btn.textContent="Sign in"}}
async function resetPassword(){const email=$("email").value.trim().toLowerCase(),err=$("loginErr");if(!email){err.textContent="Enter your email first.";return}const {error}=await state.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});err.style.color=error?"#b3261e":"#187a45";err.textContent=error?error.message:"Password reset email sent."}
async function signOut(){await state.sb.auth.signOut();location.reload()}
async function loadProfile(){const r=await state.sb.from("profiles").select("*").eq("id",state.user.id).maybeSingle();state.profile=r.data||{id:state.user.id,full_name:state.user.email,role:"teacher",active:true}}
function renderShell(){document.body.innerHTML=shellHTML()}
async function go(page){state.page=page;renderShell();$("content").innerHTML='<div class="card">Loading…</div>';const titles={dashboard:"Dashboard",students:"Students",classes:"Classes & Sections",subjects:"Subjects",teachers:"Teachers",assign:"Assignments",exams:"Examinations",marks:"Marks Entry",attendance:"Attendance",results:"Results & Analytics",questions:"Question Bank",quiz:"Online Quiz",timetable:"Timetable",certificates:"Certificates",ai:"AI Assistant"};$("pageTitle").textContent=titles[page]||"Smart School";try{if(page==="dashboard")await dashboard();else if(page==="students")await students();else if(page==="classes")await classes();else if(page==="subjects")await subjects();else if(page==="teachers")await teachers();else if(page==="assign")await assignments();else if(page==="exams")await exams();else if(page==="marks")await marks();else if(page==="attendance")await attendance();else if(page==="results")await results();else if(page==="questions")await questions();else if(page==="quiz")await quiz();else if(page==="timetable")await timetable();else if(page==="certificates")await certificates();else if(page==="ai")await aiAssistant()}catch(e){$("content").innerHTML=`<div class="card"><b>Module error</b><div class="err">${esc(e.message)}</div></div>`}}
async function count(t){const r=await state.sb.from(t).select("*",{count:"exact",head:true});if(r.error)throw r.error;return r.count||0}
async function dashboard(){const names=["students","classes","subjects","examinations"];const vals=await Promise.all(names.map(count));$("content").innerHTML=`<div class="grid">${[["Students",vals[0]],["Classes",vals[1]],["Subjects",vals[2]],["Examinations",vals[3]]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}</div><div class="section-title"><h3>Quick actions</h3></div><div class="quick"><div class="card"><h3>Student Database</h3><p>Bulk import, edit and manage student records.</p><button class="secondary" onclick="go('students')">Open</button></div><div class="card"><h3>Marks Entry</h3><p>Teacher-wise subject/class marks entry.</p><button class="secondary" onclick="go('marks')">Open</button></div><div class="card"><h3>Results</h3><p>Automatic result, rank and performance analysis.</p><button class="secondary" onclick="go('results')">Open</button></div><div class="card"><h3>AI Assistant</h3><p>Generate notices, reports and remedial plans.</p><button class="secondary" onclick="go('ai')">Open</button></div></div><div class="section-title"><h3>Recommended workflow</h3></div><div class="notice">Setup Classes → Sections → Subjects → Teachers → Assignments → Students → Examinations → Marks → Results. The new modules can be introduced without deleting your existing records.</div>`}
async function loadLookups(){const [c,s,st,sub,e,t,a]=await Promise.all([state.sb.from("classes").select("*").order("display_order"),state.sb.from("sections").select("*").order("name"),state.sb.from("students").select("*").order("roll_no"),state.sb.from("subjects").select("*").order("name"),state.sb.from("examinations").select("*").order("exam_date",{ascending:false}),state.sb.from("profiles").select("*").order("full_name"),state.sb.from("teacher_subjects").select("*")]);for(const r of [c,s,st,sub,e,t,a])if(r.error)throw r.error;state.classes=c.data||[];state.sections=s.data||[];state.students=st.data||[];state.subjects=sub.data||[];state.exams=e.data||[];state.teachers=t.data||[];state.assignments=a.data||[]}
const className=id=>state.classes.find(x=>x.id===id)?.name||id||"",sectionName=id=>state.sections.find(x=>x.id===id)?.name||id||"",subjectName=id=>state.subjects.find(x=>x.id===id)?.name||id||"",teacherName=id=>state.teachers.find(x=>x.id===id)?.full_name||id||"";
async function students(){await loadLookups();$("content").innerHTML=`<div class="toolbar"><input class="search" id="studentSearch" placeholder="Search student / roll / admission" oninput="filterStudents()">${isAdmin()?'<button class="primary" onclick="studentModal()">+ Add Student</button><button class="secondary" onclick="importStudentsModal()">⇧ Bulk Import</button><button class="ghost" onclick="downloadStudentTemplate()">⇩ Template</button>':""}</div><div id="studentTable"></div>`;renderStudentTable()}
function filterStudents(){renderStudentTable($("studentSearch").value.toLowerCase())}
function renderStudentTable(q=""){const d=state.students.filter(s=>!q||[s.full_name,s.roll_no,s.admission_no,className(s.class_id),sectionName(s.section_id)].some(x=>String(x||"").toLowerCase().includes(q)));$("studentTable").innerHTML=d.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Roll</th><th>Admission</th><th>Name</th><th>Class</th><th>Section</th><th>House</th><th>Action</th></tr></thead><tbody>${d.map(s=>`<tr><td>${esc(s.roll_no)}</td><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(className(s.class_id))}</td><td>${esc(sectionName(s.section_id))}</td><td>${esc(s.house)}</td><td>${isAdmin()?`<button class="secondary" onclick="studentModal('${s.id}')">Edit</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:'<div class="card empty">No students found.</div>'}
function studentModal(id=null){const s=id?state.students.find(x=>x.id===id):null;$("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>${s?"Edit Student":"Add Student"}</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Admission No *</label><input id="s_adm" value="${esc(s?.admission_no)}"></div><div class="field"><label>Roll No *</label><input id="s_roll" value="${esc(s?.roll_no)}"></div><div class="field full"><label>Full Name *</label><input id="s_name" value="${esc(s?.full_name)}"></div><div class="field"><label>Gender</label><select id="s_gender"><option value="">Select</option><option ${s?.gender==="Male"?"selected":""}>Male</option><option ${s?.gender==="Female"?"selected":""}>Female</option></select></div><div class="field"><label>DOB</label><input id="s_dob" type="date" value="${esc(s?.dob)}"></div><div class="field"><label>Class *</label><select id="s_class">${state.classes.map(x=>`<option value="${x.id}" ${x.id===s?.class_id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section *</label><select id="s_section">${state.sections.map(x=>`<option value="${x.id}" ${x.id===s?.section_id?"selected":""}>${esc(x.name)} — ${esc(className(x.class_id))}</option>`).join("")}</select></div><div class="field"><label>House</label><input id="s_house" value="${esc(s?.house)}"></div><div class="field"><label>Father Name</label><input id="s_father" value="${esc(s?.father_name)}"></div><div class="field"><label>Mother Name</label><input id="s_mother" value="${esc(s?.mother_name)}"></div></div><button class="primary full" onclick="saveStudent('${id||""}')">${s?"Update":"Save"}</button></div></div>`}
async function saveStudent(id=""){const x={admission_no:$("s_adm").value.trim(),roll_no:$("s_roll").value.trim(),full_name:$("s_name").value.trim(),gender:$("s_gender").value||null,dob:$("s_dob").value||null,class_id:$("s_class").value,section_id:$("s_section").value,house:$("s_house").value.trim()||null,father_name:$("s_father").value.trim()||null,mother_name:$("s_mother").value.trim()||null};if(!x.admission_no||!x.roll_no||!x.full_name){toast("Required fields are missing",false);return}const r=id?await state.sb.from("students").update(x).eq("id",id):await state.sb.from("students").insert(x);if(r.error){toast(r.error.message,false);return}closeModal();toast("Student saved");students()}
function downloadStudentTemplate(){const csv="admission_no,roll_no,full_name,gender,dob,class,section,house,father_name,mother_name\nADM001,1,Sample Student,Male,2012-01-15,VI,A,Aravali,Father Name,Mother Name\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Student_Import_Template.csv";a.click()}
function importStudentsModal(){$("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>Bulk Student Import</h3><button class="close" onclick="closeModal()">×</button></div><div class="import-box"><b>CSV columns</b><p>admission_no, roll_no, full_name, gender, dob, class, section, house, father_name, mother_name</p><input id="studentFile" type="file" accept=".csv" onchange="previewStudentImport(event)"></div><div id="importPreview"></div><div class="section-title"><button class="ghost" onclick="downloadStudentTemplate()">Template</button><button class="primary" onclick="runStudentImport()">Import</button></div></div></div>`}
let importRows=[];function previewStudentImport(e){const f=e.target.files[0];if(!f)return;Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{importRows=r.data||[];$("importPreview").innerHTML=`<div class="notice">${importRows.length} rows detected.</div>`}})}
async function runStudentImport(){if(!importRows.length){toast("Choose a CSV file",false);return}const cm=new Map(state.classes.map(x=>[String(x.name).toLowerCase(),x.id])),sm=new Map(state.sections.map(x=>[`${String(x.name).toLowerCase()}|${String(className(x.class_id)).toLowerCase()}`,x.id]));const rows=importRows.map(x=>({admission_no:String(x.admission_no||"").trim(),roll_no:String(x.roll_no||"").trim(),full_name:String(x.full_name||"").trim(),gender:x.gender||null,dob:x.dob||null,class_id:cm.get(String(x.class||"").trim().toLowerCase())||null,section_id:sm.get(`${String(x.section||"").trim().toLowerCase()}|${String(x.class||"").trim().toLowerCase()}`)||null,house:x.house||null,father_name:x.father_name||null,mother_name:x.mother_name||null})).filter(x=>x.admission_no&&x.roll_no&&x.full_name);if(rows.some(x=>!x.class_id||!x.section_id)){toast("Some Class/Section names do not match",false);return}const r=await state.sb.from("students").upsert(rows,{onConflict:"admission_no"});if(r.error){toast(r.error.message,false);return}closeModal();toast(`${rows.length} students imported`);students()}

async function teachers(){
 if(!isAdmin()){toast("Admin access required",false);return}
 const r=await state.sb.from("profiles").select("*").order("full_name");
 if(r.error)throw r.error;
 state.teachers=r.data||[];
 const active=state.teachers.filter(x=>x.active!==false).length;
 const admins=state.teachers.filter(x=>String(x.role||"").toLowerCase()==="admin"&&x.active!==false).length;
 $("content").innerHTML=`
 <div class="grid" style="margin-bottom:14px">
   <div class="card kpi"><div class="label">Total Staff Profiles</div><div class="num">${state.teachers.length}</div></div>
   <div class="card kpi"><div class="label">Active</div><div class="num">${active}</div></div>
   <div class="card kpi"><div class="label">Administrators</div><div class="num">${admins}</div></div>
   <div class="card kpi"><div class="label">Teachers</div><div class="num">${state.teachers.filter(x=>String(x.role||"").toLowerCase()==="teacher"&&x.active!==false).length}</div></div>
 </div>
 <div class="notice"><b>Teacher Management</b><br>Authentication accounts are created in Supabase Authentication. This module stores staff details and links each teacher to the Auth User UUID. Passwords and OTPs are never stored here.</div>
 <div class="toolbar" style="margin-top:12px">
   <input id="teacherSearch" class="search" placeholder="Search name / employee ID / designation" oninput="renderTeacherTable()">
   <select id="teacherStatus" onchange="renderTeacherTable()"><option value="all">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
   <button class="primary" onclick="teacherModal()">+ Add Teacher Details</button>
 </div>

function renderTeacherTable(){
 const q=String($("teacherSearch")?.value||"").toLowerCase().trim();
 const st=$("teacherStatus")?.value||"all";
 const rows=state.teachers.filter(x=>{
   const text=[x.full_name,x.employee_id,x.designation,x.phone,x.department,x.subject_specialization].map(v=>String(v||"").toLowerCase()).join(" ");
   const status=x.active===false?"inactive":"active";
   return (!q||text.includes(q))&&(st==="all"||status===st);
 });
 $("teacherTable").innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Employee ID</th><th>Designation</th><th>Department</th><th>Specialization</th><th>Phone</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(x=>`<tr>
 <td><b>${esc(x.full_name)}</b><div style="font-size:11px;color:var(--muted)">${esc(x.email||"")}</div></td>
 <td>${esc(x.employee_id)}</td><td>${esc(x.designation)}</td><td>${esc(x.department)}</td><td>${esc(x.subject_specialization)}</td><td>${esc(x.phone)}</td><td><span class="badge">${esc(x.role||"teacher")}</span></td>
 <td><span class="badge ${x.active===false?"danger":""}">${x.active===false?"Inactive":"Active"}</span></td>
 <td><div class="actions"><button class="secondary smallbtn" onclick="teacherModal('${x.id}')">Edit</button><button class="${x.active===false?"primary":"danger"} smallbtn" onclick="toggleTeacher('${x.id}',${x.active!==false})">${x.active===false?"Activate":"Deactivate"}</button><button class="danger smallbtn" onclick="deleteTeacher('${x.id}')">Delete</button></div></td>

async function saveTeacher(id=""){
 const authId=$("t_id").value.trim();
 const payload={employee_id:$("t_emp").value.trim(),full_name:$("t_name").value.trim(),email:$("t_email").value.trim()||null,phone:$("t_phone").value.trim()||null,designation:$("t_desig").value.trim()||null,department:$("t_dept").value.trim()||null,subject_specialization:$("t_spec").value.trim()||null,role:$("t_role").value,joining_date:$("t_join").value||null,active:$("t_active").value==="true",updated_at:new Date().toISOString()};
 if(!authId||!payload.employee_id||!payload.full_name){toast("Auth User ID, Employee ID and Full Name are required",false);return}
 if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(authId)){toast("Enter a valid Supabase Auth UUID",false);return}
 let r;
 if(id) r=await state.sb.from("profiles").update(payload).eq("id",id);
 else r=await state.sb.from("profiles").insert({id:authId,...payload});
 if(r.error){toast("Unable to save teacher details: "+r.error.message,false);return}
 closeModal();toast(id?"Teacher details updated":"Teacher details added");teachers();
}
async function toggleTeacher(id,currentActive){
 const r=await state.sb.from("profiles").update({active:!currentActive,updated_at:new Date().toISOString()}).eq("id",id);
 if(r.error){toast(r.error.message,false);return}
 toast(currentActive?"Teacher deactivated":"Teacher activated");teachers();
}
async function deleteTeacher(id){
 if(!isAdmin())return;
 const t=state.teachers.find(x=>x.id===id),name=t?.full_name||"this teacher";
 if(!confirm(`Permanently delete ${name}?\n\nThe profile and all teacher-subject assignments will be deleted. The Supabase Authentication login will NOT be deleted.\n\nIf historical records prevent deletion, use Deactivate instead.`))return;
 const a=await state.sb.from("teacher_subjects").delete().eq("teacher_id",id);
 if(a.error){toast("Could not remove teacher assignments: "+a.error.message,false);return}
 const r=await state.sb.from("profiles").delete().eq("id",id);
 if(r.error){toast("Teacher could not be deleted: "+r.error.message+". Use Deactivate instead.",false);return}
 toast("Teacher deleted successfully");teachers();
}

 <div id="assignmentTable"></div>`;
 renderAssignmentTable();

function renderAssignmentTable(forRows=null){
 const q=String($("assignmentSearch")?.value||"").toLowerCase().trim(),st=$("assignmentStatus")?.value||"all";
 const base=forRows||state.assignments;
 const rows=base.filter(x=>{const text=[teacherName(x.teacher_id),subjectName(x.subject_id),className(x.class_id),sectionName(x.section_id),x.academic_year].join(" ").toLowerCase();const status=x.active===false?"inactive":"active";return(!q||text.includes(q))&&(st==="all"||st===status)});
 $("assignmentTable").innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Teacher</th><th>Subject</th><th>Class</th><th>Section</th><th>Academic Year</th><th>Status</th>${isAdmin()?"<th>Action</th>":""}</tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(teacherName(x.teacher_id))}</td><td><b>${esc(subjectName(x.subject_id))}</b></td><td>${esc(className(x.class_id))}</td><td>${esc(sectionName(x.section_id))}</td><td>${esc(x.academic_year||YEAR)}</td><td><span class="badge ${x.active===false?"danger":""}">${x.active===false?"Inactive":"Active"}</span></td>${isAdmin()?`<td><div class="actions"><button class="secondary smallbtn" onclick="assignmentModal('${x.id}')">Edit</button><button class="${x.active===false?"primary":"danger"} smallbtn" onclick="toggleAssignment('${x.id}',${x.active!==false})">${x.active===false?"Activate":"Deactivate"}</button><button class="danger smallbtn" onclick="deleteAssignment('${x.id}')">Delete</button></div></td>`:""}</tr>`).join("")}</tbody></table></div>`:'<div class="card empty">No assignments found.</div>';
}
function assignmentModal(id=null){
 const x=id?state.assignments.find(v=>v.id===id):null;
 const teachers=state.teachers.filter(v=>v.active!==false),subjects=state.subjects.filter(v=>v.active!==false),classes=state.classes.filter(v=>v.active!==false);
 if(!teachers.length||!subjects.length||!classes.length){toast("Create at least one active teacher, subject and class first",false);return}
 $("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>${x?"Edit Teacher Assignment":"Assign Teacher"}</h3><button class="close" onclick="closeModal()">×</button></div>
 <div class="form-grid">
  <div class="field full"><label>Teacher *</label><select id="a_teacher">${teachers.map(v=>`<option value="${v.id}" ${v.id===x?.teacher_id?"selected":""}>${esc(v.full_name)} — ${esc(v.employee_id||"")}</option>`).join("")}</select></div>
  <div class="field"><label>Subject *</label><select id="a_subject">${subjects.map(v=>`<option value="${v.id}" ${v.id===x?.subject_id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div>
  <div class="field"><label>Class *</label><select id="a_class" onchange="assignmentSectionOptions()">${classes.map(v=>`<option value="${v.id}" ${v.id===x?.class_id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div>
  <div class="field"><label>Section *</label><select id="a_section"></select></div>

  <div class="field"><label>Status</label><select id="a_active"><option value="true" ${x?.active!==false?"selected":""}>Active</option><option value="false" ${x?.active===false?"selected":""}>Inactive</option></select></div>
 </div>
 <div class="hint">Duplicate active assignments for the same teacher + subject + class + section + academic year are blocked. Teachers can enter marks only for active assignments.</div>
 <button class="primary full" onclick="saveAssignment('${id||""}')">${x?"Update Assignment":"Save Assignment"}</button></div></div>`;

function assignmentSectionOptions(selectedId=""){
 const classId=$("a_class")?.value,sel=$("a_section");if(!sel)return;
 const list=state.sections.filter(v=>v.active!==false&&v.class_id===classId);
 sel.innerHTML=list.length?list.map(v=>`<option value="${v.id}" ${v.id===selectedId?"selected":""}>${esc(v.name)}</option>`).join(""):'<option value="">No sections for this class</option>';
}
async function saveAssignment(id=""){
 const p={teacher_id:$("a_teacher").value,subject_id:$("a_subject").value,class_id:$("a_class").value,section_id:$("a_section").value,academic_year:$("a_year").value.trim()||YEAR,active:$("a_active").value==="true",updated_at:new Date().toISOString()};
 if(!p.teacher_id||!p.subject_id||!p.class_id||!p.section_id){toast("Teacher, subject, class and section are required",false);return}
 const validSection=state.sections.some(s=>s.id===p.section_id&&s.class_id===p.class_id&&s.active!==false);if(!validSection){toast("Selected section does not belong to the selected class",false);return}
 const teacher=state.teachers.find(t=>t.id===p.teacher_id);if(!teacher||teacher.active===false){toast("Select an active teacher",false);return}
 const duplicate=state.assignments.find(a=>a.id!==id&&a.teacher_id===p.teacher_id&&a.subject_id===p.subject_id&&a.class_id===p.class_id&&a.section_id===p.section_id&&String(a.academic_year||YEAR)===p.academic_year&&a.active!==false);
 if(duplicate){toast("This teacher is already assigned to the same subject, class, section and year",false);return}
 const r=id?await state.sb.from("teacher_subjects").update(p).eq("id",id):await state.sb.from("teacher_subjects").insert(p);
 if(r.error){toast("Assignment save failed: "+r.error.message,false);return}
 closeModal();toast(id?"Assignment updated":"Assignment saved");assignments();
}
async function toggleAssignment(id,currentActive){
 if(!isAdmin())return;const r=await state.sb.from("teacher_subjects").update({active:!currentActive,updated_at:new Date().toISOString()}).eq("id",id);
 if(r.error){toast(r.error.message,false);return}toast(currentActive?"Assignment deactivated":"Assignment activated");assignments();
}
async function deleteAssignment(id){
 if(!isAdmin())return;const x=state.assignments.find(a=>a.id===id);if(!x)return;
 const label=`${teacherName(x.teacher_id)} — ${subjectName(x.subject_id)} — ${className(x.class_id)} ${sectionName(x.section_id)}`;
 if(!confirm(`Permanently delete this assignment?\n\n${label}\n\nThis cannot be undone.`))return;
 const r=await state.sb.from("teacher_subjects").delete().eq("id",id);if(r.error){toast("Assignment could not be deleted: "+r.error.message,false);return}
 toast("Assignment deleted successfully");assignments();
}

function examModal(){$("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>Create Examination</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Name</label><input id="e_name" placeholder="PWT I"></div><div class="field"><label>Date</label><input id="e_date" type="date"></div><div class="field"><label>Class</label><select id="e_class">${state.classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="e_section">${state.sections.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(className(x.class_id))}</option>`).join("")}</select></div><div class="field"><label>Maximum Marks</label><input id="e_max" type="number" value="100"></div><div class="field"><label>Pass Marks</label><input id="e_pass" type="number" value="33"></div></div><button class="primary full" onclick="saveExam()">Create</button></div></div>`}
async function saveExam(){const p={name:$("e_name").value.trim(),academic_year:YEAR,exam_date:$("e_date").value||null,class_id:$("e_class").value,section_id:$("e_section").value,maximum_marks:Number($("e_max").value)||100,pass_marks:Number($("e_pass").value)||33,status:"draft"};const r=await state.sb.from("examinations").insert({...p,created_by:state.user.id});if(r.error){toast(r.error.message,false);return}closeModal();toast("Examination created");exams()}
function teacherAllowed(subjectId,classId,sectionId){return isAdmin()||state.assignments.some(a=>a.teacher_id===state.user.id&&a.subject_id===subjectId&&a.class_id===classId&&a.section_id===sectionId&&a.active!==false)}
function marksForCurrentTeacher(){return state.assignments.filter(a=>(isAdmin()||a.teacher_id===state.user.id)&&a.active!==false)}
function updateMarksSections(){
 const cl=$("m_class")?.value,sel=$("m_section");if(!sel)return;
 const allowed=marksForCurrentTeacher().filter(a=>a.class_id===cl).map(a=>a.section_id);
 const ids=isAdmin()?[...new Set(state.sections.filter(s=>s.active!==false&&(!cl||s.class_id===cl)).map(s=>s.id))]:[...new Set(allowed)];
 const current=sel.value;sel.innerHTML=ids.length?ids.map(id=>{const x=state.sections.find(s=>s.id===id);return `<option value="${x.id}" ${x.id===current?"selected":""}>${esc(x.name)} — ${esc(className(x.class_id))}</option>`}).join(""):'<option value="">No assigned sections</option>';
 updateMarksSubjects();
}
function updateMarksSubjects(){
 const cl=$("m_class")?.value,se=$("m_section")?.value,sel=$("m_subject");if(!sel)return;
 let ids;
 if(isAdmin()) ids=state.subjects.filter(s=>s.active!==false).map(s=>s.id);
 else ids=[...new Set(marksForCurrentTeacher().filter(a=>a.class_id===cl&&a.section_id===se).map(a=>a.subject_id))];
 const current=sel.value;sel.innerHTML=ids.length?ids.map(id=>{const x=state.subjects.find(s=>s.id===id);return `<option value="${x.id}" ${x.id===current?"selected":""}>${esc(x.name)}</option>`}).join(""):'<option value="">No assigned subjects</option>';
 loadMarksGrid();
}
async function marks(){
 await loadLookups();
 const cs=isAdmin()?state.classes.filter(x=>x.active!==false):state.classes.filter(c=>marksForCurrentTeacher().some(a=>a.class_id===c.id));
 if(!cs.length){$("content").innerHTML='<div class="card empty">No active teaching assignments are available. Ask the administrator to assign a teacher, subject, class and section.</div>';return}
 $("content").innerHTML=`<div class="card"><div class="notice" style="margin-bottom:12px"><b>Assignment-based Marks Entry</b><br>${isAdmin()?"Admin can enter marks for any active class/subject/section.":"Only your active Subject → Class → Section assignments are available."}</div><div class="form-grid"><div class="field"><label>Examination</label><select id="m_exam" onchange="loadMarksGrid()">${state.exams.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.academic_year||YEAR)}</option>`).join("")}</select></div><div class="field"><label>Class</label><select id="m_class" onchange="updateMarksSections()">${cs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="m_section" onchange="updateMarksSubjects()"></select></div><div class="field"><label>Subject</label><select id="m_subject" onchange="loadMarksGrid()"></select></div></div></div><div id="marksGrid" style="margin-top:14px"></div>`;
 updateMarksSections();
}
async function loadMarksGrid(){
 const ex=$("m_exam")?.value,cl=$("m_class")?.value,se=$("m_section")?.value,sub=$("m_subject")?.value;if(!ex||!cl||!se||!sub||!$("marksGrid"))return;
 if(!teacherAllowed(sub,cl,se)){$("marksGrid").innerHTML='<div class="card empty">You are not assigned to this subject/class/section.</div>';return}
 const exi=state.exams.find(x=>x.id===ex)||{},max=Number(exi.maximum_marks)||100,st=state.students.filter(x=>x.class_id===cl&&x.section_id===se).sort((a,b)=>String(a.roll_no).localeCompare(String(b.roll_no),undefined,{numeric:true}));
 const r=await state.sb.from("marks").select("student_id,marks,attendance_status,status").eq("examination_id",ex).eq("subject_id",sub);if(r.error)throw r.error;
 const map=new Map((r.data||[]).map(x=>[x.student_id,x]));
 $("marksGrid").innerHTML=`<div class="section-title"><h3>${esc(subjectName(sub))} — ${esc(className(cl))} ${esc(sectionName(se))}</h3><div class="actions"><span class="badge">Max ${max}</span><button class="secondary" onclick="saveMarks(false)">Save Draft</button><button class="primary" onclick="saveMarks(true)">Submit</button></div></div><div class="table-wrap marks-table"><table class="table"><thead><tr><th>Roll</th><th>Admission</th><th>Student</th><th>Marks / ${max}</th><th>Attendance</th><th>Status</th></tr></thead><tbody>${st.map(s=>{const m=map.get(s.id);return `<tr><td>${esc(s.roll_no)}</td><td>${esc(s.admission_no)}</td><td><b>${esc(s.full_name)}</b></td><td><input class="markval" data-id="${s.id}" type="number" min="0" max="${max}" step="0.01" value="${m?.marks??""}"></td><td><select class="attval" data-id="${s.id}"><option ${!m||m.attendance_status!=="Absent"?"selected":""}>Present</option><option ${m?.attendance_status==="Absent"?"selected":""}>Absent</option></select></td><td><span class="badge ${m?.status==="submitted"?"":"warn"}">${esc(m?.status||"New")}</span></td></tr>`}).join("")}</tbody></table></div>`;
}
async function saveMarks(submit){
 const ex=$("m_exam").value,cl=$("m_class").value,se=$("m_section").value,sub=$("m_subject").value,exi=state.exams.find(x=>x.id===ex)||{},max=Number(exi.maximum_marks)||100;if(!teacherAllowed(sub,cl,se)){toast("Not authorised",false);return}
 let saved=0;
 for(const input of document.querySelectorAll(".markval")){
  const id=input.dataset.id,att=$(".attval[data-id=\""+id+"\"]")?.value,raw=input.value.trim();if(raw===""&&att!=="Absent")continue;
  const marks=raw===""?0:Number(raw);if(!Number.isFinite(marks)||marks<0||marks>max){toast(`Invalid marks. Maximum is ${max}.`,false);return}
  const row={examination_id:ex,subject_id:sub,student_id:id,marks,attendance_status:att,status:submit?"submitted":"draft",entered_by:state.user.id,updated_at:new Date().toISOString()};
  const old=await state.sb.from("marks").select("id").eq("examination_id",ex).eq("subject_id",sub).eq("student_id",id).maybeSingle();if(old.error)throw old.error;
  const r=old.data?await state.sb.from("marks").update(row).eq("id",old.data.id):await state.sb.from("marks").insert(row);if(r.error){toast("Marks save failed: "+r.error.message,false);return}saved++;
 }
 if(!saved){toast("No marks entered",false);return}toast(`${saved} marks ${submit?"submitted":"saved"}`);await loadMarksGrid();
}

async function attendance(){await loadLookups();$("content").innerHTML=`<div class="card"><div class="form-grid"><div class="field"><label>Class</label><select id="at_class">${state.classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="at_section">${state.sections.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(className(x.class_id))}</option>`).join("")}</select></div><div class="field"><label>Date</label><input id="at_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><button class="primary" onclick="loadAttendanceGrid()">Load Attendance</button></div><div id="attendanceGrid"></div>`}
async function loadAttendanceGrid(){const cl=$("at_class").value,se=$("at_section").value,dt=$("at_date").value,st=state.students.filter(x=>x.class_id===cl&&x.section_id===se),r=await state.sb.from("attendance").select("student_id,status").eq("attendance_date",dt);if(r.error)throw r.error;const map=new Map((r.data||[]).map(x=>[x.student_id,x.status]));$("attendanceGrid").innerHTML=`<div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Roll</th><th>Name</th><th>Status</th></tr></thead><tbody>${st.map(s=>`<tr><td>${esc(s.roll_no)}</td><td>${esc(s.full_name)}</td><td><select class="attendance-row" data-id="${s.id}"><option ${map.get(s.id)!=="Absent"?"selected":""}>Present</option><option ${map.get(s.id)==="Absent"?"selected":""}>Absent</option></select></td></tr>`).join("")}</tbody></table></div><button class="primary" style="margin-top:12px" onclick="saveAttendance()">Save Attendance</button>`}
async function saveAttendance(){const dt=$("at_date").value;for(const el of document.querySelectorAll(".attendance-row")){const p={student_id:el.dataset.id,attendance_date:dt,status:el.value,marked_by:state.user.id};const old=await state.sb.from("attendance").select("id").eq("student_id",p.student_id).eq("attendance_date",dt).maybeSingle();const r=old.data?await state.sb.from("attendance").update(p).eq("id",old.data.id):await state.sb.from("attendance").insert(p);if(r.error)throw r.error}toast("Attendance saved")}
async function questions(){await loadLookups();$("content").innerHTML=`<div class="toolbar"><button class="primary" onclick="questionModal()">+ Add Question</button></div><div class="notice">Question Bank supports MCQ, short answer, long answer and case-study questions. AI generation can be connected later through a secure server-side AI key; do not place private AI keys in this HTML file.</div><div id="questionTable" style="margin-top:12px"></div>`;const r=await state.sb.from("question_bank").select("*").order("created_at",{ascending:false});if(r.error){$("questionTable").innerHTML=`<div class="card empty">Run the supplied database migration to enable Question Bank.</div>`;return}$("questionTable").innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>Type</th><th>Question</th><th>Marks</th><th>Difficulty</th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${esc(subjectName(x.subject_id))}</td><td>${esc(x.question_type)}</td><td>${esc(x.question_text)}</td><td>${x.marks}</td><td>${esc(x.difficulty)}</td></tr>`).join("")}</tbody></table></div>`}
function questionModal(){$("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>Add Question</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Subject</label><select id="q_sub">${state.subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="form-grid"><div class="field"><label>Type</label><select id="q_type"><option>MCQ</option><option>Short Answer</option><option>Long Answer</option><option>Case Study</option></select></div><div class="field"><label>Difficulty</label><select id="q_diff"><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="field"><label>Marks</label><input id="q_marks" type="number" value="1"></div><div class="field full"><label>Question</label><textarea id="q_text"></textarea></div><div class="field full"><label>Answer / Key</label><textarea id="q_answer"></textarea></div></div><button class="primary full" onclick="saveQuestion()">Save Question</button></div></div>`}
async function saveQuestion(){const p={subject_id:$("q_sub").value,question_type:$("q_type").value,difficulty:$("q_diff").value,marks:Number($("q_marks").value)||1,question_text:$("q_text").value.trim(),answer_key:$("q_answer").value.trim(),created_by:state.user.id};const r=await state.sb.from("question_bank").insert(p);if(r.error){toast(r.error.message,false);return}closeModal();toast("Question saved");questions()}
async function quiz(){await loadLookups();$("content").innerHTML=`<div class="ai-box"><h3>Online Quiz</h3><p>Create timed quizzes from your Question Bank. This first release stores quiz definitions and questions; a public student attempt page can be added next.</p><button class="primary" onclick="quizModal()">+ Create Quiz</button></div><div class="section-title"><h3>Quiz Management</h3></div><div class="card empty">Use the database migration to activate quiz tables.</div>`}
function quizModal(){$("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>Create Quiz</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Quiz title</label><input id="quiz_title"></div><div class="field"><label>Duration (minutes)</label><input id="quiz_duration" type="number" value="30"></div><button class="primary full" onclick="saveQuiz()">Save Quiz</button></div></div>`}
async function saveQuiz(){const r=await state.sb.from("quizzes").insert({title:$("quiz_title").value.trim(),duration_minutes:Number($("quiz_duration").value)||30,created_by:state.user.id,status:"draft"});if(r.error){toast(r.error.message,false);return}closeModal();toast("Quiz created")}
async function timetable(){await loadLookups();$("content").innerHTML=`<div class="notice"><b>Timetable</b><br>This module is prepared for teacher/class period scheduling. The next migration adds periods and timetable entries with clash detection.</div><div class="section-title"><h3>Planning</h3><button class="primary" onclick="timetableModal()">+ Add Period</button></div><div class="card empty">Configure periods and teacher assignments before generating the no-clash timetable.</div>`}
function timetableModal(){$("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>Add Period</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Day</label><select id="tt_day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div><div class="field"><label>Period</label><input id="tt_period" type="number" value="1"></div><div class="field"><label>Teacher</label><select id="tt_teacher">${state.teachers.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join("")}</select></div><div class="field"><label>Subject</label><select id="tt_subject">${state.subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div></div><button class="primary full" onclick="savePeriod()">Save</button></div></div>`}
async function savePeriod(){const r=await state.sb.from("timetable").insert({day_name:$("tt_day").value,period_no:Number($("tt_period").value),teacher_id:$("tt_teacher").value,subject_id:$("tt_subject").value,academic_year:YEAR});if(r.error){toast(r.error.message,false);return}closeModal();toast("Timetable entry saved")}
async function certificates(){await loadLookups();$("content").innerHTML=`<div class="card"><h3>Certificate Generator</h3><p>Generate a simple PDF certificate for any student.</p><div class="toolbar"><select id="cert_student">${state.students.map(s=>`<option value="${s.id}">${esc(s.roll_no)} — ${esc(s.full_name)}</option>`).join("")}</select><input id="cert_title" value="Certificate of Achievement" placeholder="Certificate title"><button class="primary" onclick="generateCertificate()">Generate PDF</button></div></div>`}
async function generateCertificate(){const s=state.students.find(x=>x.id===$("cert_student").value),title=$("cert_title").value||"Certificate of Achievement",{jsPDF}=window.jspdf,d=new jsPDF({orientation:"landscape"});d.setLineWidth(2);d.rect(15,15,267,180);d.setFontSize(28);d.text(SCHOOL,148,45,{align:"center"});d.setFontSize(22);d.text(title,148,75,{align:"center"});d.setFontSize(18);d.text("This certificate is proudly presented to",148,100,{align:"center"});d.setFontSize(26);d.text(s.full_name,148,125,{align:"center"});d.setFontSize(14);d.text(`Class ${className(s.class_id)} — Roll No. ${s.roll_no}`,148,145,{align:"center"});d.save(`${s.full_name.replace(/\s+/g,"_")}_Certificate.pdf`)}
async function aiAssistant(){await loadLookups();$("content").innerHTML=`<div class="ai-box"><h3>Smart School AI Assistant</h3><p>This version provides a secure, key-free workspace for prompts. For production AI responses, connect an AI provider through a server-side Vercel function so secret keys are never exposed in the browser.</p><div class="field"><label>What do you need?</label><textarea id="ai_prompt" placeholder="Example: Prepare a remedial action plan for students scoring below 40% in Physics."></textarea></div><button class="primary" onclick="generateLocalAI()">Generate Draft</button><div id="ai_output" class="ai-output"></div></div>`}
function generateLocalAI(){const p=$("ai_prompt").value.trim();if(!p){toast("Enter a request",false);return}const out=`SMART SCHOOL AI DRAFT\n\nRequest:\n${p}\n\nSuggested workflow:\n1. Identify the class, subject and students involved.\n2. Review marks, attendance and topic-wise performance.\n3. Group students by learning need.\n4. Prepare targeted remedial activities and a short assessment.\n5. Record intervention and review improvement after 1–2 weeks.\n\nNote: Connect a server-side AI provider for fully generated school-specific responses.`;$("ai_output").textContent=out}
function closeModal(){$("modal").innerHTML=""}
init();
</script></body></html>
