<style>
:root{--g:#123f29;--g2:#245d3e;--bg:#f4f7f5;--card:#fff;--txt:#18231d;--muted:#68756e;--line:#dce5df;--ok:#187a45;--danger:#b3261e;--warn:#9a6500}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login-wrap{min-height:100vh;background:linear-gradient(145deg,#092f1e,#174d31);display:grid;place-items:center;padding:20px}.login{width:min(500px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 25px 70px #0005}.logo{width:112px;height:112px;border-radius:50%;background:#edf4ef;display:grid;place-items:center;margin:auto;font-size:43px;font-weight:850;color:var(--g)}
h1{font-size:31px;line-height:1.05;margin:18px 0 8px;text-align:center}.sub,.year{text-align:center;color:var(--muted)}.year{font-weight:800}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}.field textarea{min-height:80px}
.primary{background:var(--g);color:#fff;padding:11px 16px;border-radius:11px;font-weight:750}.primary.full{width:100%}.secondary{background:#eaf2ed;color:var(--g);padding:10px 14px;border-radius:10px;font-weight:750}.danger{background:#fff0ef;color:var(--danger);padding:10px 14px;border-radius:10px;font-weight:750}.smallbtn{padding:7px 10px!important;font-size:12px!important}.ghost{background:#fff;border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;font-weight:700}.err{color:var(--danger);font-weight:650;margin-top:12px}.hint{color:var(--muted);font-size:12px;margin-top:12px}
.app{display:flex;min-height:100vh}.side{width:250px;background:#103a25;color:#fff;padding:16px;position:fixed;inset:0 auto 0 0;z-index:10;overflow:auto}.brand{font-size:22px;font-weight:850;margin:8px 8px 20px}.school-mini{font-size:11px;color:#b9d1c4;padding:0 8px 16px;line-height:1.35}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dceae2;padding:11px;border-radius:10px;margin:2px 0}.nav button.active,.nav button:hover{background:#285d41;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.top h2{margin:0;font-size:29px}.role{background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 3px 14px #173a2010}.kpi .label{color:var(--muted)}.kpi .num{font-size:34px;font-weight:850;margin-top:6px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 11px}.section-title h3{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{background:#f4f7f5;font-size:12px;position:sticky;top:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:800}.badge.warn{background:#fff5dc;color:var(--warn)}.badge.danger{background:#fff0ef;color:var(--danger)}.empty{padding:32px;text-align:center;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.quick .card{min-height:140px}.notice{background:#eef6f1;border:1px solid #d6e8dc;padding:14px;border-radius:14px;color:#24563c}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:30}.modal-box{background:#fff;width:min(850px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:21px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:#eee;border-radius:50%;width:35px;height:35px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.import-box{border:2px dashed #c9d8cf;padding:22px;border-radius:15px;text-align:center;background:#f8fbf9}.progress{height:8px;background:#e5ece7;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--ok);width:0}.marks-table input{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px}.marks-table input:focus{outline:2px solid #a8c9b5}.sticky-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px;margin:12px -21px -21px;display:flex;gap:8px;justify-content:flex-end}
.analysis-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.analysis-row{margin:12px 0}.analysis-label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}.analysis-track{height:9px;background:#e8efeb;border-radius:99px;overflow:hidden}.analysis-fill{height:100%;background:var(--g2);border-radius:99px}.metric-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.metric-line:last-child{border-bottom:0}.mini-track{width:120px;height:8px;background:#e8efeb;border-radius:99px;overflow:hidden}.mini-track>div{height:100%;background:var(--g2);border-radius:99px}
@media(max-width:900px){.analysis-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.analysis-grid{grid-template-columns:1fr}.side{width:72px;padding:9px}.brand{font-size:0;text-align:center}.brand:after{content:"JNV";font-size:19px}.school-mini{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:24px}.main{margin-left:72px;width:calc(100% - 72px);padding:14px}.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.analysis-kpis{grid-template-columns:1fr 1fr}.grid,.quick{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.login{padding:25px}.modal{padding:8px}.modal-box{max-height:94vh;border-radius:18px;padding:16px}.field input,.field select{min-height:48px}.primary.full{min-height:48px}}
</style>

<body>
<div id="root"></div>
<script>
const CONFIG={
  SUPABASE_URL:"https://mnilsvgjuwnniquukedk.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_7chu45G-OQ6LfdEd4rL-qw_V1VNNbXi"
};
const SCHOOL="PM SHRI Jawahar Navodaya Vidyalaya, Wargal, Siddipet";
const YEAR="2026-27";
const state={sb:null,user:null,profile:null,page:"dashboard",classes:[],sections:[],students:[],subjects:[],exams:[],teachers:[],assignments:[],marks:[],resultRows:[]};

function $(id){return document.getElementById(id)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function isAdmin(){return String(state.profile?.role||"teacher").toLowerCase()==="admin"}
function toast(msg,ok=true){const e=$("toast");if(!e)return;e.textContent=msg;e.style.background=ok?"#187a45":"#b3261e";e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),3500)}
function configured(){return CONFIG.SUPABASE_URL.startsWith("http")&&!CONFIG.SUPABASE_URL.includes("YOUR_")&&CONFIG.SUPABASE_ANON_KEY.length>30&&!CONFIG.SUPABASE_ANON_KEY.includes("YOUR_")}
function loginHTML(){return `<div class="login-wrap"><div class="login"><div class="logo">JNV</div><h1>JNV Result Automation</h1><div class="sub">Online Multi-User System</div><div class="year">Academic Year ${YEAR}</div><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="signBtn" class="primary full" onclick="signIn()">Sign in</button><button class="ghost full" style="margin-top:8px;width:100%" onclick="resetPassword()">Forgot password?</button><div id="loginErr" class="err"></div><div class="hint">Connected to your Supabase project. Authentication is handled securely by Supabase.</div></div></div>`}
function nav(page,label,icon){return `<button class="${state.page===page?"active":""}" onclick="go('${page}')">${icon} &nbsp;${label}</button>`}
function shellHTML(){return `<div class="app"><aside class="side"><div class="brand">JNV Result</div><div class="school-mini">${SCHOOL}<br>Academic Year ${YEAR}</div><div class="nav">
${nav("dashboard","Dashboard","▣")}${nav("students","Students","●")}${nav("classes","Classes & Sections","◆")}${nav("subjects","Subjects","◇")}${nav("exams","Examinations","▤")}${nav("marks","Marks Entry","✎")}${nav("results","Results","★")}${isAdmin()?nav("teachers","Teachers","♟"):""}${isAdmin()?nav("assign","Assignments","⇄"):""}<button onclick="signOut()">⇥ Sign out</button>
</div></aside><main class="main"><div class="top"><div><h2 id="pageTitle">Dashboard</h2><div style="color:var(--muted);font-size:13px">${SCHOOL}</div></div><div class="role">${esc(state.profile?.role||"teacher")}</div></div><div id="content"></div></main></div><div id="modal"></div><div id="toast" class="hidden" style="position:fixed;right:18px;bottom:18px;color:#fff;padding:12px 16px;border-radius:10px;z-index:50;font-weight:750"></div>`}

async function init(){
 if(!configured()){document.body.innerHTML=loginHTML()+`<div style="position:fixed;bottom:12px;left:12px;right:12px;background:#fff;padding:12px;border-radius:10px;border:1px solid #ddd;text-align:center">Replace <b>YOUR_SUPABASE_URL</b> and <b>YOUR_SUPABASE_ANON_KEY</b> in CONFIG before deploying.</div>`;return}
 if (!window.supabase || typeof window.supabase.createClient !== "function") {
    throw new Error("Supabase library could not be loaded. Check internet/CDN access.");
  }
  state.sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
 const {data:{session}}=await state.sb.auth.getSession();
 if(!session){
    document.body.innerHTML=loginHTML();
    const savedEmail=localStorage.getItem("jnv_login_email");
    if(savedEmail && $("email")) $("email").value=savedEmail;
    $("password")?.addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});
    return;
  }
 state.user=session.user;await loadProfile();renderShell();await go("dashboard");
 state.sb.auth.onAuthStateChange((_e,s)=>{state.user=s?.user||null;if(!s)location.reload()});
}
async function signIn(){
  const errEl=$("loginErr"),btn=$("signBtn");
  errEl.style.color="#b3261e";
  errEl.textContent="";
  const email=$("email").value.trim().toLowerCase(), password=$("password").value;
  localStorage.setItem("jnv_login_email",email);

  if(!email||!password){
    errEl.textContent="Please enter both email and password.";
    return;
  }
  if(!state.sb){
    errEl.textContent="Supabase is not initialized. Please refresh the page.";
    return;
  }

  btn.disabled=true;
  btn.textContent="Signing in…";

  try{
    const result=await Promise.race([
      state.sb.auth.signInWithPassword({email,password}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Connection timed out. Check your internet connection and Supabase project status.")),15000))
    ]);

    const {data,error}=result;

    if(error){
      const raw=error.message||"Unable to sign in.";
      let msg=raw;

      if(/invalid login credentials/i.test(raw))
        msg="Invalid email or password. Verify the password in Supabase Authentication → Users.";
      else if(/email not confirmed/i.test(raw))
        msg="Email is not confirmed. In Supabase Authentication → Users, confirm this account first.";
      else if(/failed to fetch|network/i.test(raw))
        msg="Cannot connect to Supabase. Check the Supabase URL, key, internet connection, and project status.";
      else if(/rate limit/i.test(raw))
        msg="Too many login attempts. Please wait a few minutes and try again.";

      errEl.textContent="Sign-in error: "+msg;
      return;
    }

    if(!data?.user || !data?.session){
      errEl.textContent="Authentication succeeded but no session was returned. Check Supabase Auth configuration.";
      return;
    }

    state.user=data.user;

    // Profile lookup must happen only after authentication.
    await loadProfile();

    // A missing profile should not prevent a valid authenticated session
    // from opening the application. Role defaults to teacher until a profile
    // is configured.
    renderShell();
    await go("dashboard");

  }catch(e){
    console.error("JNV sign-in error:",e);
    errEl.textContent="Sign-in error: "+(e?.message||String(e));
  }finally{
    btn.disabled=false;
    btn.textContent="Sign in";
  }
}
async function resetPassword(){
 const email=$("email").value.trim().toLowerCase(),errEl=$("loginErr");
 if(!email){errEl.textContent="Enter your email address first, then tap Forgot password.";return}
 try{
  const {error}=await state.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  if(error) throw error;
  errEl.style.color="#187a45";errEl.textContent="Password reset email sent. Check your inbox.";
 }catch(e){errEl.style.color="#b3261e";errEl.textContent="Password reset error: "+(e?.message||e)}
}
async function signOut(){await state.sb.auth.signOut();location.reload()}
async function loadProfile(){
 try{
  const r=await state.sb.from("profiles").select("*").eq("id",state.user.id).maybeSingle();
  if(r.error){console.warn("Profile lookup failed:",r.error.message);state.profile={role:"teacher",full_name:state.user.email};return}
  state.profile=r.data||{role:"teacher",full_name:state.user.email};
 }catch(e){state.profile={role:"teacher",full_name:state.user.email}}
}
function renderShell(){document.body.innerHTML=shellHTML()}
async function go(page){
 state.page=page;renderShell();$("content").innerHTML='<div class="card">Loading…</div>';
 const titles={dashboard:"Dashboard",students:"Students",classes:"Classes & Sections",subjects:"Subjects",exams:"Examinations",marks:"Marks Entry",results:"Results",teachers:"Teachers",assign:"Assignments"};
 $("pageTitle").textContent=titles[page]||"JNV Result";
 try{
  if(page==="dashboard")await dashboard();else if(page==="students")await students();else if(page==="classes")await classes();else if(page==="subjects")await subjects();else if(page==="exams")await exams();else if(page==="marks")await marks();else if(page==="results")await results();else if(page==="teachers")await teachers();else if(page==="assign")await assignments();
 }catch(e){$("content").innerHTML=`<div class="card"><b>Unable to load this module</b><div class="err">${esc(e.message)}</div></div>`}
}
async function count(table){const r=await state.sb.from(table).select("*",{count:"exact",head:true});if(r.error)throw r.error;return r.count||0}
async function dashboard(){
 const [st,cl,su,ex]=await Promise.all([count("students"),count("classes"),count("subjects"),count("examinations")]);
 $("content").innerHTML=`<div class="grid"><div class="card kpi"><div class="label">Students</div><div class="num">${st}</div></div><div class="card kpi"><div class="label">Classes</div><div class="num">${cl}</div></div><div class="card kpi"><div class="label">Subjects</div><div class="num">${su}</div></div><div class="card kpi"><div class="label">Examinations</div><div class="num">${ex}</div></div></div>
 <div class="section-title"><h3>Quick actions</h3></div><div class="quick">
 <div class="card"><h3>Students</h3><p>Add, edit and manage student records or import CSV.</p><button class="secondary" onclick="go('students')">Open Students</button></div>
 <div class="card"><h3>Marks Entry</h3><p>Enter subject-wise marks for your assigned classes.</p><button class="secondary" onclick="go('marks')">Enter Marks</button></div>
 <div class="card"><h3>Results</h3><p>Calculate totals, percentage, grades, status and rank.</p><button class="secondary" onclick="go('results')">View Results</button></div>
 <div class="card"><h3>Examinations</h3><p>Create PWT, Term, Half-Yearly, Annual and other exams.</p><button class="secondary" onclick="go('exams')">Manage Exams</button></div></div>
 <div class="section-title"><h3>Workflow</h3></div><div class="notice">Admin: setup classes → subjects → examinations → teachers → assignments → students. Teacher: select examination → class → section → subject → enter marks → save/submit. Admin: edit student/class/section/subject/exam records and manage teacher details. Marks use the examination Maximum Marks; no <b>max_marks</b> column is required in the marks table.</div>`;
}
async function loadLookups(){
 const [c,s,st,sub,e,t,a]=await Promise.all([
  state.sb.from("classes").select("*").order("display_order",{ascending:true}),
  state.sb.from("sections").select("*").order("name"),
  state.sb.from("students").select("*").order("roll_no"),
  state.sb.from("subjects").select("*").order("name"),
  state.sb.from("examinations").select("*").order("exam_date",{ascending:false}),
  state.sb.from("profiles").select("*").order("full_name"),
  state.sb.from("teacher_subjects").select("*")
 ]);
 if(c.error)throw c.error;if(s.error)throw s.error;if(st.error)throw st.error;if(sub.error)throw sub.error;if(e.error)throw e.error;
 state.classes=c.data||[];state.sections=s.data||[];state.students=st.data||[];state.subjects=sub.data||[];state.exams=e.data||[];state.teachers=t.data||[];state.assignments=a.data||[];
}
function className(id){return state.classes.find(x=>x.id===id)?.name||id||""}
function sectionName(id){return state.sections.find(x=>x.id===id)?.name||id||""}
function subjectName(id){return state.subjects.find(x=>x.id===id)?.name||id||""}
function teacherName(id){return state.teachers.find(x=>x.id===id)?.full_name||id||""}

async function students(){
 await loadLookups();
 $("content").innerHTML=`<div class="toolbar"><input id="studentSearch" placeholder="Search name / roll / admission" oninput="filterStudents()">${isAdmin()?'<button class="primary" onclick="studentModal()">+ Add Student</button><button class="secondary" onclick="importStudentsModal()">⇧ Bulk Import</button><button class="ghost" onclick="downloadStudentTemplate()">⇩ Template</button>':""}</div><div id="studentTable"></div>`;
 renderStudentTable();
}
function filterStudents(){renderStudentTable(($("studentSearch")?.value||"").toLowerCase())}
function renderStudentTable(q=""){
 const d=state.students.filter(s=>!q||[s.full_name,s.roll_no,s.admission_no,className(s.class_id),sectionName(s.section_id)].some(x=>String(x||"").toLowerCase().includes(q)));
 $("studentTable").innerHTML=d.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Roll</th><th>Admission</th><th>Name</th><th>Gender</th><th>Class</th><th>Section</th><th>House</th><th>Action</th></tr></thead><tbody>${d.map(st=>`<tr><td>${esc(st.roll_no)}</td><td>${esc(st.admission_no)}</td><td>${esc(st.full_name)}</td><td>${esc(st.gender)}</td><td>${esc(className(st.class_id))}</td><td>${esc(sectionName(st.section_id))}</td><td>${esc(st.house)}</td><td>${isAdmin()?`<div class="actions"><button class="secondary smallbtn" onclick="studentEditModal('${st.id}')">Edit</button><button class="danger smallbtn" onclick="deleteStudent('${st.id}')">Delete</button></div>`:""}</td></tr>`).join("")}</tbody></table></div>`:'<div class="card empty">No students found.</div>'
}
function studentModal(id=null){
 const st=id?state.students.find(x=>x.id===id):null;
 const title=st?"Edit Student":"Add Student";
 $("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid">
<div class="field"><label>Admission No *</label><input id="s_adm" value="${esc(st?.admission_no)}"></div><div class="field"><label>Roll No *</label><input id="s_roll" value="${esc(st?.roll_no)}"></div><div class="field full"><label>Full Name *</label><input id="s_name" value="${esc(st?.full_name)}"></div>
<div class="field"><label>Gender</label><select id="s_gender"><option value="">Select</option><option ${st?.gender==="Male"?"selected":""}>Male</option><option ${st?.gender==="Female"?"selected":""}>Female</option></select></div><div class="field"><label>Date of Birth</label><input id="s_dob" type="date" value="${esc(st?.dob)}"></div>
<div class="field"><label>Class *</label><select id="s_class">${state.classes.map(x=>`<option value="${x.id}" ${x.id===st?.class_id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section *</label><select id="s_section">${state.sections.map(x=>`<option value="${x.id}" ${x.id===st?.section_id?"selected":""}>${esc(x.name)} — ${esc(className(x.class_id))}</option>`).join("")}</select></div>
<div class="field"><label>House</label><input id="s_house" value="${esc(st?.house)}"></div><div class="field"><label>Father Name</label><input id="s_father" value="${esc(st?.father_name)}"></div><div class="field"><label>Mother Name</label><input id="s_mother" value="${esc(st?.mother_name)}"></div>
</div><button class="primary full" onclick="saveStudent('${id||""}')">${st?"Update Student":"Save Student"}</button></div></div>`
}
function studentEditModal(id){studentModal(id)}
async function saveStudent(id=""){
 const x={admission_no:$("s_adm").value.trim(),roll_no:$("s_roll").value.trim(),full_name:$("s_name").value.trim(),gender:$("s_gender").value||null,dob:$("s_dob").value||null,class_id:$("s_class").value||null,section_id:$("s_section").value||null,house:$("s_house").value.trim()||null,father_name:$("s_father").value.trim()||null,mother_name:$("s_mother").value.trim()||null};
 if(!x.admission_no||!x.roll_no||!x.full_name){toast("Admission No, Roll No and Name are required",false);return}
 const r=id?await state.sb.from("students").update(x).eq("id",id):await state.sb.from("students").insert(x);
 if(r.error){toast(r.error.message,false);return}
 closeModal();toast(id?"Student updated":"Student saved");students()
}
async function deleteStudent(id){if(!confirm("Delete this student? Existing marks may also be affected by database constraints."))return;const r=await state.sb.from("students").delete().eq("id",id);if(r.error){toast(r.error.message,false);return}toast("Student deleted");students()}

function downloadStudentTemplate(){
 const csv="admission_no,roll_no,full_name,gender,dob,class,section,house,father_name,mother_name\nADM001,1,Sample Student,Male,2012-01-15,VI,A,Aravali,Father Name,Mother Name\n";
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="JNV_Student_Import_Template.csv";a.click()
}
function importStudentsModal(){
 $("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>Bulk Student Import</h3><button class="close" onclick="closeModal()">×</button></div>
<div class="import-box"><p><b>CSV format</b></p><p style="color:var(--muted);font-size:13px">Columns: admission_no, roll_no, full_name, gender, dob, class, section, house, father_name, mother_name</p><input id="studentFile" type="file" accept=".csv,text/csv" onchange="previewStudentImport(event)"></div>
<div id="importPreview" style="margin-top:14px"></div><div class="sticky-actions"><button class="ghost" onclick="downloadStudentTemplate()">Download Template</button><button class="primary" onclick="runStudentImport()">Import Students</button></div></div></div>`
}
let importRows=[];
function previewStudentImport(e){
 const f=e.target.files[0];if(!f)return;
 Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{importRows=r.data||[];$("importPreview").innerHTML=`<div class="notice">${importRows.length} rows detected. Click Import Students to continue.</div><div class="table-wrap" style="margin-top:10px;max-height:280px"><table class="table"><thead><tr><th>Admission</th><th>Roll</th><th>Name</th><th>Class</th><th>Section</th></tr></thead><tbody>${importRows.slice(0,10).map(x=>`<tr><td>${esc(x.admission_no)}</td><td>${esc(x.roll_no)}</td><td>${esc(x.full_name)}</td><td>${esc(x.class)}</td><td>${esc(x.section)}</td></tr>`).join("")}</tbody></table></div>`}})
}
async function runStudentImport(){
 if(!importRows.length){toast("Choose a CSV file first",false);return}
 const classMap=new Map(state.classes.map(x=>[String(x.name).trim().toLowerCase(),x.id]));
 const sectionMap=new Map(state.sections.map(x=>[`${String(x.name).trim().toLowerCase()}|${String(className(x.class_id)).trim().toLowerCase()}`,x.id]));
 const rows=importRows.map(x=>({admission_no:String(x.admission_no||"").trim(),roll_no:String(x.roll_no||"").trim(),full_name:String(x.full_name||"").trim(),gender:String(x.gender||"").trim()||null,dob:String(x.dob||"").trim()||null,class_id:classMap.get(String(x.class||"").trim().toLowerCase())||null,section_id:sectionMap.get(`${String(x.section||"").trim().toLowerCase()}|${String(x.class||"").trim().toLowerCase()}`)||null,house:String(x.house||"").trim()||null,father_name:String(x.father_name||"").trim()||null,mother_name:String(x.mother_name||"").trim()||null})).filter(x=>x.admission_no&&x.roll_no&&x.full_name);
 const bad=rows.filter(x=>!x.class_id||!x.section_id);if(bad.length){toast(`${bad.length} rows have unmatched Class/Section names. Use exact names from the app.`,false);return}
 const r=await state.sb.from("students").upsert(rows,{onConflict:"admission_no"});if(r.error){toast("Import failed: "+r.error.message,false);return}closeModal();toast(`${rows.length} students imported successfully`);students()
}

function examModal(id=null){
 const x=id?state.exams.find(v=>v.id===id):null;

 $("modal").innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><h3>${x?"Edit Examination":"Create Examination"}</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Examination Name *</label><input id="e_name" value="${esc(x?.name)}" placeholder="PWT I"></div><div class="field"><label>Academic Year</label><input id="e_year" value="${esc(x?.academic_year||YEAR)}"></div><div class="field"><label>Exam Date</label><input id="e_date" type="date" value="${esc(x?.exam_date)}"></div><div class="field"><label>Class *</label><select id="e_class" onchange="examSectionOptions()"><option value="">Select class</option>${cls.map(v=>`<option value="${v.id}" ${v.id===x?.class_id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div><div class="field"><label>Section *</label><select id="e_section"><option value="">Select section</option></select></div><div class="field"><label>Maximum Marks *</label><input id="e_max" type="number" min="1" value="${esc(x?.maximum_marks??100)}"></div><div class="field"><label>Pass Marks / Percentage</label><input id="e_pass" type="number" min="0" value="${esc(x?.pass_marks??33)}"></div><div class="field"><label>Status</label><select id="e_status"><option value="draft" ${x?.status!=="published"?"selected":""}>Draft</option><option value="published" ${x?.status==="published"?"selected":""}>Published</option></select></div></div><div class="hint">Select the class first to load its sections.</div><button class="primary full" onclick="saveExam('${id||""}')">${x?"Update Examination":"Create Examination"}</button></div></div>`;

function examSectionOptions(selectedId=""){
 const classId=$("e_class")?.value;
 const list=state.sections.filter(v=>v.active!==false && v.class_id===classId);
 const sel=$("e_section");
 if(!sel)return;
 if(!classId){sel.disabled=true;sel.innerHTML='<option value="">Select class first</option>';return}
 sel.disabled=false;
 sel.innerHTML='<option value="">Select section</option>'+list.map(v=>`<option value="${v.id}" ${v.id===selectedId?"selected":""}>${esc(v.name)}</option>`).join("");
 if(!list.length)sel.innerHTML='<option value="">No sections found for this class</option>';
}
async function saveExam(id=""){
 const x={
    name:$("e_name").value.trim(),
    academic_year:$("e_year").value.trim()||YEAR,
    exam_date:$("e_date").value||null,
    class_id:$("e_class").value||null,
    section_id:$("e_section").value||null,
    maximum_marks:Number($("e_max").value)||100,
    pass_marks:Number($("e_pass").value)||33,
    status:$("e_status").value||"draft",
    created_by:state.user.id
 };
 if(!x.name){toast("Examination name is required",false);return}
 if(!x.class_id||!x.section_id){toast("Please select class and section",false);return}
 if(!Number.isFinite(x.maximum_marks)||x.maximum_marks<=0){toast("Maximum marks must be greater than 0",false);return}
 if(x.pass_marks<0||x.pass_marks>x.maximum_marks){toast("Pass marks cannot exceed maximum marks",false);return}
 const validSection=state.sections.some(v=>v.id===x.section_id&&v.class_id===x.class_id&&v.active!==false);
 if(!validSection){toast("Selected section does not belong to the selected class",false);return}
 delete x.created_by;
 const r=id?await state.sb.from("examinations").update(x).eq("id",id):await state.sb.from("examinations").insert({...x,created_by:state.user.id});
 if(r.error){toast((id?"Update":"Create")+" examination failed: "+r.error.message,false);return}
 closeModal();toast(id?"Examination updated":"Examination created successfully");exams()
}
async function toggleExamStatus(id,status){const next=status==="published"?"draft":"published";const r=await state.sb.from("examinations").update({status:next}).eq("id",id);if(r.error){toast(r.error.message,false);return}toast("Examination status updated");exams()}

async function saveTeacher(id=""){
 const authId=$("t_id").value.trim();
 const payload={employee_id:$("t_emp").value.trim(),full_name:$("t_name").value.trim(),designation:$("t_desig").value.trim()||null,role:$("t_role").value,phone:$("t_phone").value.trim()||null,active:$("t_active").value==="true",updated_at:new Date().toISOString()};
 if(!authId||!payload.employee_id||!payload.full_name){toast("Auth User ID, Employee ID and Full Name are required",false);return}
 let r;
 if(id){
   r=await state.sb.from("profiles").update(payload).eq("id",id);
 }else{
   r=await state.sb.from("profiles").insert({id:authId,...payload});
 }
 if(r.error){toast("Unable to save teacher details: "+r.error.message,false);return}
 closeModal();toast(id?"Teacher details updated":"Teacher details added");teachers()
}

async function marks(){
 await loadLookups();
 let classes=state.classes,subjects=state.subjects;
 if(!isAdmin()){const mine=state.assignments.filter(a=>a.teacher_id===state.user.id&&a.active!==false);classes=classes.filter(c=>mine.some(a=>a.class_id===c.id));subjects=subjects.filter(s=>mine.some(a=>a.subject_id===s.id))}
 if(!classes.length){$("content").innerHTML='<div class="card empty">No class assignments are available for this teacher. Ask the administrator to assign a class, section and subject.</div>';return}
 $("content").innerHTML=`<div class="card"><div class="form-grid"><div class="field"><label>Examination</label><select id="m_exam" onchange="loadMarksGrid()">${state.exams.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.academic_year)}</option>`).join("")}</select></div><div class="field"><label>Class</label><select id="m_class" onchange="loadMarksGrid()">${classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="m_section" onchange="loadMarksGrid()">${state.sections.filter(s=>classes.some(c=>c.id===s.class_id)).map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(className(x.class_id))}</option>`).join("")}</select></div><div class="field"><label>Subject</label><select id="m_subject" onchange="loadMarksGrid()">${subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div></div></div><div id="marksGrid" style="margin-top:14px"></div>`;
 await loadMarksGrid();
}
async function loadMarksGrid(){
 const ex=$("m_exam")?.value,cl=$("m_class")?.value,se=$("m_section")?.value,sub=$("m_subject")?.value;if(!ex||!cl||!se||!sub)return;
 if(!teacherAllowed(sub,cl,se)){ $("marksGrid").innerHTML='<div class="card empty">This teacher is not assigned to the selected subject/class/section.</div>';return}
 const students=state.students.filter(s=>s.class_id===cl&&s.section_id===se).sort((a,b)=>String(a.roll_no).localeCompare(String(b.roll_no),undefined,{numeric:true}));
 const exInfo=state.exams.find(x=>x.id===ex)||{};
 const maxForExam=Number(exInfo.maximum_marks)||100;
 const mr=await state.sb.from("marks").select("id,examination_id,subject_id,student_id,marks,attendance_status,status,entered_by,entered_at,updated_at").eq("examination_id",ex).eq("subject_id",sub);
 if(mr.error){$("marksGrid").innerHTML=`<div class="card err"><b>Unable to load marks</b><br>${esc(mr.error.message)}</div>`;return}
 const map=new Map((mr.data||[]).map(x=>[x.student_id,x]));
 $("marksGrid").innerHTML=`<div class="section-title"><h3>${esc(subjectName(sub))} — ${esc(className(cl))} ${esc(sectionName(se))}</h3><div><span class="badge">Maximum: ${maxForExam}</span><button class="secondary" onclick="saveMarks(false)">Save Draft</button><button class="primary" style="margin-left:6px" onclick="saveMarks(true)">Submit Marks</button></div></div><div class="table-wrap marks-table"><table class="table"><thead><tr><th>Roll</th><th>Admission</th><th>Student</th><th>Max Marks</th><th>Marks</th><th>Attendance</th><th>Status</th></tr></thead><tbody>${students.map(s=>{const m=map.get(s.id);return `<tr><td>${esc(s.roll_no)}</td><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td><span class="badge">${maxForExam}</span></td><td><input class="markval" data-id="${s.id}" type="number" value="${m?.marks??""}" min="0" max="${maxForExam}" step="0.01"></td><td><select class="attval" data-id="${s.id}"><option ${!m||m.attendance_status==="Present"?"selected":""}>Present</option><option ${m?.attendance_status==="Absent"?"selected":""}>Absent</option></select></td><td>${m?.status?`<span class="badge ${m.status==="submitted"?"":"warn"}">${esc(m.status)}</span>`:"<span class='badge'>New</span>"}</td></tr>`}).join("")}</tbody></table></div>`
}
async function saveMarks(submit){
 const ex=$("m_exam").value,cl=$("m_class").value,se=$("m_section").value,sub=$("m_subject").value;
 const exInfo=state.exams.find(x=>x.id===ex)||{};
 const max_marks=Number(exInfo.maximum_marks)||100;
 if(!teacherAllowed(sub,cl,se)){toast("You are not assigned to this subject/class/section",false);return}
 const ids=[...document.querySelectorAll(".markval")].map(e=>e.dataset.id);const rows=[];
 for(const id of ids){const markEl=document.querySelector(`.markval[data-id="${id}"]`),att=document.querySelector(`.attval[data-id="${id}"]`);const raw=markEl.value.trim();if(raw===""&&att.value==="Present")continue;const marks=raw===""?0:Number(raw);if(!Number.isFinite(marks)||marks<0||marks>max_marks){toast(`Invalid marks for ${id}. Maximum is ${max_marks}.`,false);return}rows.push({examination_id:ex,subject_id:sub,student_id:id,marks,attendance_status:att.value,status:submit?"submitted":"draft",entered_by:state.user.id,entered_at:new Date().toISOString(),updated_at:new Date().toISOString()})}
 if(!rows.length){toast("No marks entered",false);return}
 for(const row of rows){
   const old=await state.sb.from("marks").select("id").eq("examination_id",row.examination_id).eq("subject_id",row.subject_id).eq("student_id",row.student_id).maybeSingle();
   if(old.error){toast("Could not check existing mark: "+old.error.message,false);return}
   let r=old.data?await state.sb.from("marks").update(row).eq("id",old.data.id):await state.sb.from("marks").insert(row);
   if(r.error){toast("Marks save failed: "+r.error.message,false);return}
 }
 toast(`${rows.length} marks ${submit?"submitted":"saved"}`);await loadMarksGrid()
}

async function results(){
 await loadLookups();
 if(!state.exams.length){$("content").innerHTML='<div class="card empty">Create an examination first.</div>';return}
 $("content").innerHTML=`<div class="card"><div class="form-grid"><div class="field"><label>Examination</label><select id="r_exam" onchange="buildResults()">${state.exams.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.academic_year)}</option>`).join("")}</select></div><div class="field"><label>Class</label><select id="r_class" onchange="buildResults()"><option value="">All Classes</option>${state.classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="r_section" onchange="buildResults()"><option value="">All Sections</option>${state.sections.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(className(x.class_id))}</option>`).join("")}</select></div></div></div><div id="resultTable" style="margin-top:14px"></div>`;
 await buildResults()
}
function grade(p){return p>=91?"A1":p>=81?"A2":p>=71?"B1":p>=61?"B2":p>=51?"C1":p>=41?"C2":p>=33?"D":"E"}
function pctText(v){return Number(v||0).toFixed(2)}
function analysisBar(label,value,max,extra=""){
 const pct=max?Math.max(0,Math.min(100,(Number(value)||0)/max*100)):0;
 return `<div class="analysis-row"><div class="analysis-label"><span>${esc(label)}</span><b>${esc(extra||String(value))}</b></div><div class="analysis-track"><div class="analysis-fill" style="width:${pct}%"></div></div></div>`
}
async function buildResults(){
 const exId=$("r_exam").value,cl=$("r_class").value,se=$("r_section").value;
 const ex=state.exams.find(x=>x.id===exId)||{};
 const passPct=Number(ex.pass_marks ?? ex.pass_percentage ?? 33) || 33;
 let students=state.students.filter(s=>(!cl||s.class_id===cl)&&(!se||s.section_id===se));
 if(!isAdmin())students=students.filter(s=>state.assignments.some(a=>a.teacher_id===state.user.id&&a.class_id===s.class_id&&a.section_id===s.section_id&&a.active!==false));
 const mr=await state.sb.from("marks").select("student_id,marks,subject_id,status,attendance_status").eq("examination_id",exId);if(mr.error)throw mr.error;
 const marks=mr.data||[];
 const by=new Map();marks.forEach(m=>{if(!by.has(m.student_id))by.set(m.student_id,[]);by.get(m.student_id).push(m)});
 const subjectIds=[...new Set(marks.map(m=>m.subject_id).filter(Boolean))];
 let rows=students.map(s=>{
   const a=by.get(s.id)||[];
   const total=a.reduce((x,m)=>x+(Number(m.marks)||0),0);
   const max=a.length*(Number(ex.maximum_marks)||100);
   const pct=max?total/max*100:0;
   const submitted=a.filter(m=>m.status==="submitted"||m.status==="approved").length;
   const absent=a.filter(m=>String(m.attendance_status||"").toLowerCase()==="absent").length;
   const incomplete=a.length<subjectIds.length;
   const subjectFail=a.some(m=>String(m.attendance_status||"").toLowerCase()==="absent" || (Number(ex.maximum_marks||100)>0 && (Number(m.marks)||0)/(Number(ex.maximum_marks)||100)*100 < passPct));
   const status=!a.length?"NO MARKS":incomplete?"INCOMPLETE":subjectFail?"FAIL":submitted<subjectIds.length?"DRAFT":"PASS";
   return {...s,total,max,pct,grade:grade(pct),status,entered:a.length,submitted,absent,subjectFail};
 }).sort((a,b)=>b.pct-a.pct);
 let rank=0,lastPct=null;rows.forEach((r,i)=>{if(r.status!=="NO MARKS"&&r.status!=="INCOMPLETE"){if(lastPct===null||r.pct!==lastPct)rank=i+1;r.rank=rank;lastPct=r.pct}else r.rank="—"});
 state.resultRows=rows;
 const activeRows=rows.filter(r=>r.status!=="NO MARKS"&&r.status!=="INCOMPLETE");
 const appeared=rows.filter(r=>r.entered>0).length;
 const absentStudents=rows.filter(r=>r.absent>0).length;
 const passed=rows.filter(r=>r.status==="PASS").length;
 const failed=rows.filter(r=>r.status==="FAIL").length;
 const incomplete=rows.filter(r=>r.status==="INCOMPLETE"||r.status==="DRAFT").length;
 const avg=activeRows.length?activeRows.reduce((a,r)=>a+r.pct,0)/activeRows.length:0;
 const highest=activeRows.length?Math.max(...activeRows.map(r=>r.pct)):0;
 const lowest=activeRows.length?Math.min(...activeRows.map(r=>r.pct)):0;
 const passRate=appeared?passed/appeared*100:0;
 const gradeCounts={A1:0,A2:0,B1:0,B2:0,C1:0,C2:0,D:0,E:0};
 activeRows.forEach(r=>{if(gradeCounts[r.grade]!=null)gradeCounts[r.grade]++});
 const subjectStats=subjectIds.map(id=>{
   const arr=marks.filter(m=>m.subject_id===id && students.some(s=>s.id===m.student_id));
   const valid=arr.filter(m=>String(m.attendance_status||"").toLowerCase()!=="absent");
   const avgSub=valid.length?valid.reduce((a,m)=>a+(Number(ex.maximum_marks)>0?(Number(m.marks)||0)/Number(ex.maximum_marks)*100:0),0)/valid.length:0;
   const passedSub=valid.filter(m=>Number(ex.maximum_marks)>0 && (Number(m.marks)||0)/Number(ex.maximum_marks)*100>=passPct).length;
   const highestSub=valid.length?Math.max(...valid.map(m=>Number(ex.maximum_marks)>0?(Number(m.marks)||0)/Number(ex.maximum_marks)*100:0)):0;
   return {id,name:subjectName(id),count:arr.length,avg:avgSub,pass:valid.length?passedSub/valid.length*100:0,highest:highestSub};
 });
 const top=activeRows.slice(0,5);
 const weak=rows.filter(r=>r.status==="FAIL"||r.status==="INCOMPLETE").sort((a,b)=>a.pct-b.pct);
 const selectedLabel=(cl?className(cl):"All Classes")+(se?" — "+sectionName(se):"");
 $("resultTable").innerHTML=`
 <div class="section-title"><h3>Overall Result Analysis — ${esc(selectedLabel)}</h3><div class="actions"><button class="secondary" onclick="window.print()">🖨 Print</button><button class="secondary" onclick="exportResults()">⇩ Export CSV</button></div></div>
 <div class="analysis-kpis">
  <div class="card kpi"><div class="label">Total Students</div><div class="num">${rows.length}</div></div>
  <div class="card kpi"><div class="label">Appeared</div><div class="num">${appeared}</div></div>
  <div class="card kpi"><div class="label">Passed</div><div class="num">${passed}</div></div>
  <div class="card kpi"><div class="label">Failed</div><div class="num">${failed}</div></div>
  <div class="card kpi"><div class="label">Absent</div><div class="num">${absentStudents}</div></div>
  <div class="card kpi"><div class="label">Pass %</div><div class="num">${pctText(passRate)}%</div></div>
  <div class="card kpi"><div class="label">Class Average</div><div class="num">${pctText(avg)}%</div></div>
  <div class="card kpi"><div class="label">Highest</div><div class="num">${pctText(highest)}%</div></div>
 </div>
 <div class="analysis-grid">
  <div class="card"><div class="section-title"><h3>Grade Distribution</h3><span class="badge">${activeRows.length} evaluated</span></div>
   ${Object.entries(gradeCounts).map(([g,c])=>analysisBar(g,c,Math.max(1,activeRows.length),String(c))).join("")}
  </div>
  <div class="card"><div class="section-title"><h3>Class Performance</h3><span class="badge">Pass criterion ${pctText(passPct)}%</span></div>
   <div class="metric-line"><span>Pass %</span><b>${pctText(passRate)}%</b></div><div class="metric-line"><span>Average</span><b>${pctText(avg)}%</b></div><div class="metric-line"><span>Highest</span><b>${pctText(highest)}%</b></div><div class="metric-line"><span>Lowest</span><b>${pctText(lowest)}%</b></div><div class="metric-line"><span>Incomplete / Draft</span><b>${incomplete}</b></div>
  </div>
 </div>
 <div class="section-title"><h3>Subject-wise Analysis</h3></div>
 <div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>Students</th><th>Average %</th><th>Pass %</th><th>Highest %</th><th>Performance</th></tr></thead><tbody>${subjectStats.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.count}</td><td>${pctText(x.avg)}%</td><td>${pctText(x.pass)}%</td><td>${pctText(x.highest)}%</td><td><div class="mini-track"><div style="width:${Math.min(100,Math.max(0,x.avg))}%"></div></div></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No subject marks available.</td></tr>'}</tbody></table></div>
 <div class="analysis-grid" style="margin-top:14px">
  <div class="card"><div class="section-title"><h3>Top Performers</h3><span class="badge">Top 5</span></div><div class="table-wrap"><table class="table" style="min-width:500px"><thead><tr><th>Rank</th><th>Roll</th><th>Name</th><th>%</th><th>Grade</th></tr></thead><tbody>${top.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.roll_no)}</td><td>${esc(r.full_name)}</td><td>${pctText(r.pct)}%</td><td>${r.grade}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No completed results.</td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="section-title"><h3>Needs Improvement</h3><span class="badge danger">${weak.length}</span></div><div class="table-wrap"><table class="table" style="min-width:500px"><thead><tr><th>Roll</th><th>Name</th><th>%</th><th>Status</th></tr></thead><tbody>${weak.slice(0,10).map(r=>`<tr><td>${esc(r.roll_no)}</td><td>${esc(r.full_name)}</td><td>${pctText(r.pct)}%</td><td><span class="badge danger">${r.status}</span></td></tr>`).join("")||'<tr><td colspan="4" class="empty">No students in this category.</td></tr>'}</tbody></table></div></div>
 </div>
 <div class="section-title"><h3>Student-wise Consolidated Result</h3></div>
 <div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Roll</th><th>Admission</th><th>Name</th><th>Subjects</th><th>Total</th><th>%</th><th>Grade</th><th>Status</th><th>Report</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.roll_no)}</td><td>${esc(r.admission_no)}</td><td><b>${esc(r.full_name)}</b></td><td>${r.entered}/${subjectIds.length}</td><td>${r.total}/${r.max}</td><td>${pctText(r.pct)}%</td><td>${r.grade}</td><td><span class="badge ${r.status==="PASS"?"":"danger"}">${r.status}</span></td><td><button class="secondary" onclick="pdfReport('${r.id}','${exId}')">PDF</button></td></tr>`).join("")||'<tr><td colspan="10" class="empty">No students found.</td></tr>'}</tbody></table></div>`;
}
function exportResults(){const rows=state.resultRows||[];const csv=["Rank,Roll,Admission,Name,Total,Max,Percentage,Grade,Status",...rows.map(r=>[r.rank,r.roll_no,r.admission_no,`"${String(r.full_name).replaceAll('"','""')}"`,r.total,r.max,r.pct.toFixed(2),r.grade,r.status].join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="JNV_Consolidated_Result.csv";a.click()}
async function pdfReport(studentId,examId){
 const s=state.students.find(x=>x.id===studentId)||await getStudent(studentId);const ex=state.exams.find(x=>x.id===examId);const mr=await state.sb.from("marks").select("marks,subject_id,status,attendance_status").eq("examination_id",examId).eq("student_id",studentId);if(mr.error){toast(mr.error.message,false);return}
 const rows=mr.data||[];const total=rows.reduce((a,x)=>a+(Number(x.marks)||0),0),max=rows.length*(Number(ex?.maximum_marks)||100),pct=max?total/max*100:0;
 const {jsPDF}=window.jspdf;const d=new jsPDF();d.setFontSize(16);d.text(SCHOOL,105,18,{align:"center"});d.setFontSize(13);d.text("STUDENT REPORT CARD",105,27,{align:"center"});d.setFontSize(10);d.text(`Academic Year: ${YEAR}`,105,35,{align:"center"});d.line(15,40,195,40);d.text(`Examination: ${ex?.name||""}`,20,50);d.text(`Student: ${s.full_name||""}`,20,58);d.text(`Admission No: ${s.admission_no||""}`,20,66);d.text(`Roll No: ${s.roll_no||""}`,20,74);d.text(`Class: ${className(s.class_id)}   Section: ${sectionName(s.section_id)}`,20,82);
 let y=94;d.setFontSize(10);d.text("Subject",20,y);d.text("Marks",125,y);d.text("Max",150,y);d.text("Status",175,y);y+=7;d.line(18,y-4,192,y-4);
 for(const m of rows){d.text(String(subjectName(m.subject_id)).slice(0,38),20,y);d.text(String(m.marks??0),125,y);d.text(String(ex?.maximum_marks??100),150,y);d.text(String(m.status||""),175,y);y+=7;if(y>245){d.addPage();y=20}}
 y+=8;d.text(`Total: ${total} / ${max}`,20,y);y+=8;d.text(`Percentage: ${pct.toFixed(2)}%`,20,y);y+=8;d.text(`Grade: ${grade(pct)}`,20,y);y+=8;d.text(`Result: ${pct>=33?"PASS":"FAIL"}`,20,y);y+=8;const rank=(state.resultRows.find(x=>x.id===studentId)||{}).rank;d.text(`Rank: ${rank||"—"}`,20,y);d.setFontSize(9);d.text("Generated by JNV Result Automation",20,280);d.save(`${String(s.roll_no||"student")}_${String(s.full_name||"Student").replace(/\s+/g,"_")}_Report.pdf`)
}
async function getStudent(id){const r=await state.sb.from("students").select("*").eq("id",id).single();return r.data}

function closeModal(){$("modal").innerHTML=""}
init();
</script>
