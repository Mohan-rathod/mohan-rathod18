<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart School AI — JNV Result Automation</title>
<meta name="theme-color" content="#123f29">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--g:#123f29;--g2:#245d3e;--bg:#f4f7f5;--card:#fff;--txt:#18231d;--muted:#68756e;--line:#dce5df;--danger:#b3261e;--warn:#9a6500}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;background:linear-gradient(145deg,#092f1e,#174d31);display:grid;place-items:center;padding:20px}
.login{width:min(500px,100%);background:#fff;border-radius:25px;padding:32px;box-shadow:0 20px 60px #0005}
.logo{width:90px;height:90px;border-radius:25px;background:#edf4ef;display:grid;place-items:center;margin:auto;color:var(--g);font-weight:900;text-align:center}
.login h1{text-align:center;margin:16px 0 5px}.sub,.year{text-align:center;color:var(--muted)}.year{font-weight:bold}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:90px}.primary,.secondary,.danger,.ghost{padding:10px 14px;border-radius:10px;font-weight:750;border:0}
.primary{background:var(--g);color:#fff}.secondary{background:#eaf2ed;color:var(--g)}.danger{background:#fff0ef;color:var(--danger)}.ghost{background:#fff;border:1px solid var(--line)}.full{width:100%}
.err{color:var(--danger);margin-top:10px;font-weight:700}.hint{font-size:12px;color:var(--muted);margin-top:10px}
.app{display:flex;min-height:100vh}.side{width:255px;background:#103a25;color:#fff;position:fixed;inset:0 auto 0 0;padding:15px;overflow:auto;z-index:10}
.brand{font-size:22px;font-weight:900;margin:8px}.school{font-size:11px;color:#b9d1c4;padding:5px 8px 15px;line-height:1.4}
.nav button{display:block;width:100%;text-align:left;background:none;color:#dceae2;border:0;padding:10px;border-radius:9px;margin:2px 0}
.nav button.active,.nav button:hover{background:#285d41;color:#fff}.main{margin-left:255px;width:calc(100% - 255px);padding:20px}
.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.top h2{margin:0}.role{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #173a2010}
.kpi .label{color:var(--muted)}.kpi .num{font-size:32px;font-weight:900;margin-top:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}.toolbar>*{width:auto}.toolbar .search{min-width:220px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;gap:10px}.section-title h3{margin:0}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}
.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{background:#f4f7f5;font-size:12px;position:sticky;top:0}
.actions{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:bold}
.badge.warn{background:#fff5dc;color:var(--warn)}.badge.danger{background:#fff0ef;color:var(--danger)}
.notice{background:#eef6f1;border:1px solid #d6e8dc;padding:13px;border-radius:12px}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:30}.modal-box{background:#fff;width:min(950px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0}.close{border:0;border-radius:50%;width:34px;height:34px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
.report{background:#fff;border:1px solid #ccd9d0;padding:22px;max-width:1050px;margin:auto}.report table{width:100%;border-collapse:collapse}
.report th,.report td{border:1px solid #ccd9d0;padding:6px;font-size:11px}.report th{background:#eef5f0}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:40px;text-align:center}.sign div{border-top:1px solid #555;padding-top:5px}
.toast{position:fixed;right:18px;bottom:18px;color:#fff;background:#187a45;padding:12px 16px;border-radius:10px;z-index:50;font-weight:bold}
.mini{font-size:12px;color:var(--muted)}.success-text{color:var(--g)}.danger-text{color:var(--danger)}
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grade-input{text-transform:uppercase;font-weight:800;text-align:center}
.report-header{display:grid;grid-template-columns:90px 1fr 90px;gap:15px;align-items:center}.report-logo{width:75px;height:75px;border:1px solid #aaa;display:grid;place-items:center;font-size:9px;text-align:center}
.photo-box{width:70px;height:90px;border:1px solid #777;display:grid;place-items:center;font-size:10px;text-align:center}
.report-title{text-align:center}.report-title h2{margin:2px;font-size:17px}.report-title h3{margin:2px;font-size:13px}.report-title p{margin:2px;font-size:11px}
.student-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 30px;border-top:1px solid #333;border-bottom:1px solid #333;padding:8px 0;margin:10px 0;font-size:11px}
.part-title{font-weight:900;margin:12px 0 4px;font-size:12px}.small-note{font-size:9px;color:#444}
@media(max-width:900px){.side{width:70px;padding:8px}.brand{font-size:0;text-align:center}.brand:after{content:"SS";font-size:19px}.school{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:23px}.main{margin-left:70px;width:calc(100% - 70px);padding:12px}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid,.cs-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{flex-direction:column}.sign{grid-template-columns:1fr;gap:30px}.login{padding:24px}.report-header{grid-template-columns:60px 1fr 60px}.report-logo{width:55px;height:55px}.photo-box{width:55px;height:70px}.student-info{grid-template-columns:1fr}}
@media print{.side,.top,.toolbar,.no-print{display:none!important}.main{margin:0;width:100%;padding:5px}.report{border:0;box-shadow:none;max-width:none}.report-card-print{display:block}}
</style>
</head>
<body><div id="root"></div>
<script>
const CONFIG={
  SUPABASE_URL:"https://mnilsvgjuwnniquukedk.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_7chu45G-OQ6LfdEd4rL-qw_V1VNNbXi"
};
const SCHOOL="PM SHRI Jawahar Navodaya Vidyalaya, Wargal, Siddipet";
const YEAR="2026-27";
const S={
  sb:null,user:null,profile:null,page:"dashboard",
  classes:[],sections:[],students:[],subjects:[],exams:[],teachers:[],assignments:[],co:[],
  selectedClass:"",selectedSection:""
};
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const C=id=>S.classes.find(x=>x.id===id)?.name||"";
const SEC=id=>S.sections.find(x=>x.id===id)?.name||"";
const SUB=id=>S.subjects.find(x=>x.id===id)?.name||"";
const isAdmin=()=>String(S.profile?.role||"teacher").toLowerCase()==="admin";
function toast(x,ok=true){const e=$("toast");if(!e)return;e.textContent=x;e.style.background=ok?"#187a45":"#b3261e";e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),3000)}
function login(){
 document.body.innerHTML=`<div class="login-wrap"><div class="login"><div class="logo">SMART<br>SCHOOL</div>
 <h1>Smart School AI</h1><div class="sub">School Management • Examination • Analytics</div><div class="year">${YEAR}</div>
 <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
 <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
 <button id="loginBtn" class="primary full" onclick="signIn()">Sign in</button>
 <button class="ghost full" style="margin-top:8px" onclick="resetPassword()">Forgot password?</button>
 <div id="loginErr" class="err"></div><div class="hint">Authentication is handled by Supabase. Never share your password or OTP.</div>
 </div></div>`;
 $("password").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});
}
function nav(p,l,i){return `<button class="${S.page===p?"active":""}" onclick="go('${p}')">${i} &nbsp;${l}</button>`}
function shell(){
 document.body.innerHTML=`<div class="app"><aside class="side"><div class="brand">Smart School</div>
 <div class="school">${SCHOOL}<br>Academic Year ${YEAR}</div><div class="nav">
 ${nav("dashboard","Dashboard","▣")}${nav("students","Students","●")}${nav("classes","Classes & Sections","◆")}
 ${nav("subjects","Subjects","◇")}${nav("teachers","Teachers","♟")}${nav("exams","Examinations","▤")}
 ${nav("marks","Marks Entry","✎")}${nav("coscholastic","Co-Scholastic","◆")}${nav("attendance","Attendance","✓")}
 ${nav("results","Results & Analytics","★")}${nav("reportcards","Report Cards","▣")}
 <button onclick="signOut()">⇥ &nbsp;Sign out</button></div></aside>
 <main class="main"><div class="top"><div><h2 id="title">Dashboard</h2><small>${SCHOOL}</small></div>
 <div class="role">${esc(S.profile?.full_name||S.user?.email||"")} · ${esc(S.profile?.role||"teacher")}</div></div>
 <div id="content"></div></main></div><div id="modal"></div><div id="toast" class="toast hidden"></div>`;
}
async function init(){
 if(!window.supabase?.createClient){document.body.innerHTML='<div class="card" style="margin:30px">Supabase library failed to load. Check internet/CDN access.</div>';return}
 S.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
 const {data:{session}}=await S.sb.auth.getSession();
 if(!session){login();return}
 S.user=session.user;await loadProfile();shell();await go("dashboard");
 S.sb.auth.onAuthStateChange((_e,s)=>{if(!s)location.reload()});
}
async function loadProfile(){
 const r=await S.sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();
 S.profile=r.data||{id:S.user.id,full_name:S.user.email,role:"teacher",active:true};
}
async function signIn(){
 const err=$("loginErr"),btn=$("loginBtn");err.textContent="";btn.disabled=true;
 try{const email=$("email").value.trim().toLowerCase(),password=$("password").value;
 if(!email||!password)throw new Error("Enter email and password.");
 const r=await S.sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;
 S.user=r.data.user;await loadProfile();shell();await go("dashboard");
 }catch(e){err.textContent=e.message||String(e)}finally{btn.disabled=false}
}
async function resetPassword(){
 const email=$("email").value.trim();if(!email){$("loginErr").textContent="Enter email first.";return}
 const r=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
 $("loginErr").textContent=r.error?r.error.message:"Password reset email sent.";
}
async function signOut(){await S.sb.auth.signOut();location.reload()}
function modal(title,body){$("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){$("modal").innerHTML=""}
function pageTitle(p){return ({coscholastic:"Co-Scholastic Grades",reportcards:"Report Cards",results:"Results & Analytics",marks:"Marks Entry",exams:"Examinations"})[p]||p[0].toUpperCase()+p.slice(1)}
async function lookups(){
 const [a,b,c,d,e,f,g]=await Promise.all([
  S.sb.from("classes").select("*").order("display_order"),
  S.sb.from("sections").select("*").order("name"),
  S.sb.from("students").select("*").order("roll_no"),
  S.sb.from("subjects").select("*").order("name"),
  S.sb.from("examinations").select("*").order("exam_date",{ascending:false}),
  S.sb.from("teachers").select("*").order("full_name"),
  S.sb.from("teacher_subjects").select("*")
 ]);
 for(const r of[a,b,c,d,e,f,g])if(r.error)throw r.error;
 S.classes=a.data||[];S.sections=b.data||[];S.students=c.data||[];S.subjects=d.data||[];S.exams=e.data||[];S.teachers=f.data||[];S.assignments=g.data||[];
}
async function go(p){
 S.page=p;shell();$("title").textContent=pageTitle(p);$("content").innerHTML='<div class="card">Loading…</div>';
 try{
  if(p==="dashboard")await dashboard();
  else if(p==="students")await students();
  else if(p==="classes")await classes();
  else if(p==="subjects")await subjects();
  else if(p==="teachers")await teachers();
  else if(p==="exams")await exams();
  else if(p==="marks")await marks();
  else if(p==="coscholastic")await coScholastic();
  else if(p==="attendance")await attendance();
  else if(p==="results")await results();
  else if(p==="reportcards")await reports();
 }catch(e){console.error(e);$("content").innerHTML=`<div class="card"><b>Module error</b><div class="err">${esc(e.message||e)}</div></div>`}
}
function tbl(head,rows){
 return `<div class="table-wrap"><table class="table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||'<tr><td colspan="99" style="text-align:center;padding:25px;color:#68756e">No records.</td></tr>'}</tbody></table></div>`
}
async function dashboard(){
 const vals=await Promise.all(["students","classes","subjects","examinations"].map(async t=>{const r=await S.sb.from(t).select("*",{count:"exact",head:true});return r.count||0}));
 $("content").innerHTML=`<div class="grid">${[["Students",vals[0]],["Classes",vals[1]],["Subjects",vals[2]],["Examinations",vals[3]]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}</div>
 <div class="section-title"><h3>JNV Result Automation</h3></div>
 <div class="notice"><b>Bulk Upload is available</b> in Students, Classes/Sections, Subjects, Teachers, Examinations, Marks, Co-Scholastic and Attendance. Individual Edit/Delete controls are also available where supported.</div><div class="notice"><b>Co-Scholastic grades are annual.</b> Enter them once for each student for ${YEAR}; they automatically appear on the student's report card.</div>`
}
async function students(){await lookups();renderStudents(S.students)}
function renderStudents(arr){
 $("content").innerHTML=`<div class="toolbar"><input class="search" id="studentSearch" placeholder="Search student / roll / admission" oninput="filterStudents()">
 <button class="primary" onclick="studentForm()">+ Add Student</button></div>${tbl(["Roll","Admission","Name","Class","Section","House","Action"],arr.map(x=>`<tr><td>${esc(x.roll_no)}</td><td>${esc(x.admission_no)}</td><td><b>${esc(x.full_name)}</b></td><td>${C(x.class_id)}</td><td>${SEC(x.section_id)}</td><td>${esc(x.house)}</td>
 <td class="actions"><button class="secondary" onclick="studentForm('${x.id}')">Edit</button><button class="danger" onclick="delRow('students','${x.id}','Student')">Delete</button></td></tr>`).join(""))}`
}
function filterStudents(){const q=$("studentSearch").value.toLowerCase();renderStudents(S.students.filter(x=>(x.full_name+" "+x.roll_no+" "+x.admission_no).toLowerCase().includes(q)))}
function studentForm(id){
 const x=S.students.find(a=>a.id===id)||{};
 modal(id?"Edit Student":"Add Student",`<div class="form-grid">
 <div class="field"><label>Admission No</label><input id="ad" value="${esc(x.admission_no)}"></div>
 <div class="field"><label>Roll No</label><input id="ro" value="${esc(x.roll_no)}"></div>
 <div class="field wide"><label>Full Name</label><input id="nm" value="${esc(x.full_name)}"></div>
 <div class="field"><label>Gender</label><select id="ge"><option>Male</option><option ${x.gender==="Female"?"selected":""}>Female</option><option ${x.gender==="Other"?"selected":""}>Other</option></select></div>
 <div class="field"><label>Class</label><select id="cl">${S.classes.map(c=>`<option value="${c.id}" ${x.class_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
 <div class="field"><label>Section</label><select id="se">${S.sections.map(c=>`<option value="${c.id}" ${x.section_id===c.id?"selected":""}>${C(c.class_id)} - ${esc(c.name)}</option>`).join("")}</select></div>
 <div class="field"><label>House</label><input id="ho" value="${esc(x.house)}"></div><div class="field"><label>Father Name</label><input id="fa" value="${esc(x.father_name)}"></div>
 <div class="field"><label>Mother Name</label><input id="mo" value="${esc(x.mother_name)}"></div><div class="field"><label>Parent Phone</label><input id="ph" value="${esc(x.parent_phone||x.phone)}"></div>
 <div class="field wide"><label>Address</label><textarea id="addr">${esc(x.address)}</textarea></div></div>
 <button class="primary full" onclick="saveStudent('${id||""}')">Save Student</button>`)
}
async function saveStudent(id){
 const o={admission_no:$("ad").value.trim(),roll_no:$("ro").value.trim(),full_name:$("nm").value.trim(),gender:$("ge").value,class_id:$("cl").value,section_id:$("se").value,house:$("ho").value,apar_id:$("apar").value.trim(),date_of_birth:$("dob").value||null,father_name:$("fa").value,mother_name:$("mo").value,parent_phone:$("ph").value,address:$("addr").value,active:true};
 const r=id?await S.sb.from("students").update(o).eq("id",id):await S.sb.from("students").insert(o);
 if(r.error)return toast(r.error.message,false);closeModal();toast("Student saved");students();
}
async function classes(){
  await lookups();
  $("content").innerHTML=`<div class="section-title"><h3>Classes</h3><div class="actions">
  ${bulkButton("classes","Class",["name","display_order","active"],[["VI",6,true]])}
  </div></div>
  ${tbl(["Class","Order","Active","Action"],S.classes.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.display_order??""}</td><td>${x.active===false?"No":"Yes"}</td><td class="actions"><button class="secondary" onclick="editSimple('classes','${x.id}','Class')">Edit</button><button class="danger" onclick="deleteWithConfirm('classes','${x.id}','Class')">Delete</button></td></tr>`).join(""))}
  <div class="section-title"><h3>Sections</h3><div class="actions">
  ${bulkButton("sections","Section",["class_id","name","active"],[["CLASS_ID","A",true]])}
  </div></div>
  ${tbl(["Class","Section","Active","Action"],S.sections.map(x=>`<tr><td>${C(x.class_id)}</td><td>${esc(x.name)}</td><td>${x.active===false?"No":"Yes"}</td><td class="actions"><button class="secondary" onclick="editSimple('sections','${x.id}','Section')">Edit</button><button class="danger" onclick="deleteWithConfirm('sections','${x.id}','Section')">Delete</button></td></tr>`).join(""))}`;
}
function editSimple(table,id,label){
  const fields=table==="classes"?[["name","Class Name"],["display_order","Display Order","number"],["active","Active"]]:[["class_id","Class ID"],["name","Section Name"],["active","Active"]];
  editSimpleCore(table,id,label,fields);
}
function editSimpleCore(table,id,label,fields){
  const x=S[table].find(a=>a.id===id)||{};
  modal("Edit "+label,`<div class="form-grid">${fields.map(([k,l,t])=>`<div class="field"><label>${l}</label><input id="ed_${k}" type="${t||"text"}" value="${esc(x[k])}"></div>`).join("")}</div><button class="primary full" onclick="saveSimpleEdit('${table}','${id}','${label}',${JSON.stringify(fields.map(f=>f[0]))})">Save Changes</button>`);
}
(){
 await lookups();$("content").innerHTML=`<div class="notice">Subjects are read directly from Supabase. Examination/report-card subject lists are dynamic; there is no six-subject limit.</div>
 <div class="section-title"><h3>Subjects</h3></div>${tbl(["Subject","ID"],S.subjects.map(x=>`<tr><td>${esc(x.name||x.subject_name)}</td><td class="mini">${esc(x.id)}</td></tr>`).join(""))}`
}
async function teachers(){
  await lookups();
  $("content").innerHTML=`<div class="section-title"><h3>Teachers</h3><div class="actions">
  ${bulkButton("teachers","Teacher",["full_name","email","phone","employee_id","active"],[["Sample Teacher","teacher@example.com","9999999999","EMP001",true]])}
  <button class="primary" onclick="teacherForm()">+ Add Teacher</button></div></div>
  ${tbl(["Teacher","Email","Phone","Employee ID","Active","Action"],S.teachers.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.employee_id)}</td><td>${x.active===false?"No":"Yes"}</td><td class="actions"><button class="secondary" onclick="teacherForm('${x.id}')">Edit</button><button class="danger" onclick="deleteWithConfirm('teachers','${x.id}','Teacher')">Delete</button></td></tr>`).join(""))}`;
}
function teacherForm(id){
  const x=S.teachers.find(a=>a.id===id)||{};
  modal(id?"Edit Teacher":"Add Teacher",`<div class="form-grid">
  <div class="field"><label>Full Name</label><input id="tn" value="${esc(x.full_name)}"></div>
  <div class="field"><label>Email</label><input id="te" type="email" value="${esc(x.email)}"></div>
  <div class="field"><label>Phone</label><input id="tp" value="${esc(x.phone)}"></div>
  <div class="field"><label>Employee ID</label><input id="tei" value="${esc(x.employee_id)}"></div>
  </div><button class="primary full" onclick="saveTeacher('${id||""}')">Save Teacher</button>`);
}
async function saveTeacher(id){
  const o={full_name:$("tn").value.trim(),email:$("te").value.trim(),phone:$("tp").value.trim(),employee_id:$("tei").value.trim(),active:true};
  if(!o.full_name)return toast("Teacher name is required",false);

/* =========================
   BULK UPLOAD + CRUD HELPERS
   ========================= */
function downloadTemplate(filename, headers, sampleRows=[]){
  const ws=XLSX.utils.aoa_to_sheet([headers,...sampleRows]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Template");
  XLSX.writeFile(wb,filename);
}
function bulkButton(table,label,headers,sampleRows=[]){
  return `<button class="secondary" onclick='downloadTemplate(${JSON.stringify(label+"_Template.xlsx")},${JSON.stringify(headers)},${JSON.stringify(sampleRows)})'>Template</button>
  <label class="secondary" style="display:inline-block;cursor:pointer">Bulk Upload
  <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="bulkUpload('${table}','${label}',this.files[0],this)"></label>`;
}
function normalizeHeader(x){
  return String(x??"").trim().toLowerCase().replace(/[\s\-]+/g,"_");
}
function parseBulkFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
        resolve(rows);
      }catch(err){reject(err)}
    };
    reader.onerror=()=>reject(reader.error||new Error("Unable to read file"));
    reader.readAsArrayBuffer(file);
  });
}
function cleanBulkObject(row,allowed){
  const o={};
  for(const key of Object.keys(row)){
    const nk=normalizeHeader(key);
    if(allowed.includes(nk)){
      let v=row[key];
      if(typeof v==="string")v=v.trim();
      if(v!=="")o[nk]=v;
    }
  }
  return o;
}
async function bulkUpload(table,label,file,input){
  if(!file)return;
  try{
    const rows=await parseBulkFile(file);
    if(!rows.length)throw new Error("No rows found in the uploaded file.");
    if(!confirm(`Import ${rows.length} ${label} record(s) into ${table}?`)){input.value="";return}
    const configs={
      students:["admission_no","roll_no","full_name","gender","class_id","section_id","house","apar_id","date_of_birth","father_name","mother_name","parent_phone","address","active"],
      subjects:["name","subject_name","code","class_id","active"],
      teachers:["full_name","email","phone","employee_id","active"],
      examinations:["name","exam_name","title","exam_date","class_id","max_marks","active"],
      classes:["name","display_order","active"],
      sections:["class_id","name","active"]
    };
    const allowed=configs[table]||Object.keys(rows[0]).map(normalizeHeader);
    const payload=rows.map(r=>cleanBulkObject(r,allowed)).filter(o=>Object.keys(o).length);
    if(!payload.length)throw new Error("No usable columns were found. Use the Template button first.");
    // Convert common boolean text values.
    for(const o of payload){
      if("active" in o)o.active=!["false","no","0","inactive"].includes(String(o.active).toLowerCase());
      if("display_order" in o && o.display_order!=="")o.display_order=Number(o.display_order);
      if("max_marks" in o && o.max_marks!=="")o.max_marks=Number(o.max_marks);
    }
    const r=await S.sb.from(table).upsert(payload,{onConflict:table==="students"?"admission_no":undefined});
    if(r.error){
      // If the table has no suitable conflict target, retry as insert.
      if(String(r.error.message).toLowerCase().includes("on conflict")){
        const rr=await S.sb.from(table).insert(payload);
        if(rr.error)throw rr.error;
      }else throw r.error;
    }
    toast(`${payload.length} ${label} record(s) uploaded successfully`);
    input.value="";
    await go(S.page);
  }catch(e){
    toast(e.message||String(e),false);
    input.value="";
  }
}
