<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart School AI — JNV Result Automation</title>
<meta name="theme-color" content="#123f29">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--g:#123f29;--g2:#245d3e;--bg:#f4f7f5;--card:#fff;--txt:#18231d;--muted:#68756e;--line:#dce5df;--danger:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:var(--txt)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;background:linear-gradient(145deg,#092f1e,#174d31);display:grid;place-items:center;padding:20px}
.login{width:min(500px,100%);background:white;border-radius:25px;padding:32px;box-shadow:0 20px 60px #0005}
.logo{width:90px;height:90px;border-radius:25px;background:#edf4ef;display:grid;place-items:center;margin:auto;color:var(--g);font-weight:900;text-align:center}
h1{text-align:center;margin:16px 0 5px}.sub,.year{text-align:center;color:var(--muted)}.year{font-weight:bold}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:100px}.primary,.secondary,.danger,.ghost{padding:10px 14px;border-radius:10px;font-weight:bold;border:0}
.primary{background:var(--g);color:#fff}.secondary{background:#eaf2ed;color:var(--g)}.danger{background:#fff0ef;color:var(--danger)}.ghost{background:#fff;border:1px solid var(--line)}
.full{width:100%}.err{color:var(--danger);margin-top:10px;font-weight:bold}.hint{font-size:12px;color:var(--muted);margin-top:10px}
.app{display:flex;min-height:100vh}.side{width:255px;background:#103a25;color:#fff;position:fixed;inset:0 auto 0 0;padding:15px;overflow:auto}
.brand{font-size:22px;font-weight:900;margin:8px}.school{font-size:11px;color:#b9d1c4;padding:5px 8px 15px}.nav button{display:block;width:100%;text-align:left;background:none;color:#dceae2;border:0;padding:10px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#285d41;color:#fff}
.main{margin-left:255px;width:calc(100% - 255px);padding:20px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.top h2{margin:0}.role{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #173a2010}.kpi .label{color:var(--muted)}.kpi .num{font-size:32px;font-weight:900;margin-top:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{width:auto}.toolbar .search{min-width:220px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section-title h3{margin:0}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f4f7f5;font-size:12px}.actions{display:flex;gap:5px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:bold}.notice{background:#eef6f1;border:1px solid #d6e8dc;padding:13px;border-radius:12px}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:30}.modal-box{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}.modal-head{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:34px;height:34px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .wide{grid-column:1/-1}
.analysis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.analysis .card{padding:12px}.analysis .num{font-size:22px;font-weight:900}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.track{height:8px;background:#e7eee9;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--g2)}
.report{background:#fff;border:1px solid #ccd9d0;padding:22px;max-width:900px;margin:auto}.report table{width:100%;border-collapse:collapse}.report th,.report td{border:1px solid #ccd9d0;padding:7px;font-size:12px}.report th{background:#eef5f0}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:40px;text-align:center}.sign div{border-top:1px solid #555;padding-top:5px}
.toast{position:fixed;right:18px;bottom:18px;color:#fff;background:#187a45;padding:12px 16px;border-radius:10px;z-index:50;font-weight:bold}
@media(max-width:900px){.side{width:70px;padding:8px}.brand{font-size:0;text-align:center}.brand:after{content:"SS";font-size:19px}.school{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:23px}.main{margin-left:70px;width:calc(100% - 70px);padding:12px}.grid{grid-template-columns:1fr 1fr}.analysis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid,.two,.analysis{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.top{flex-direction:column}.sign{grid-template-columns:1fr}.toolbar>*{width:100%}}
@media print{.side,.top,.toolbar,.no-print{display:none!important}.main{margin:0;width:100%;padding:5px}.report{border:0}}
</style>
</head>
<body><div id="root"></div>
<script>
const CONFIG={SUPABASE_URL:"https://mnilsvgjuwnniquukedk.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_7chu45G-OQ6LfdEd4rL-qw_V1VNNbXi"};
const SCHOOL="PM SHRI Jawahar Navodaya Vidyalaya, Wargal, Siddipet",YEAR="2026-27";
const S={sb:null,user:null,profile:null,page:"dashboard",classes:[],sections:[],students:[],subjects:[],exams:[],teachers:[],assignments:[]};
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const C=id=>S.classes.find(x=>x.id===id)?.name||"",SEC=id=>S.sections.find(x=>x.id===id)?.name||"",SUB=id=>S.subjects.find(x=>x.id===id)?.name||"",TC=id=>S.teachers.find(x=>x.id===id)?.full_name||"";
const admin=()=>String(S.profile?.role||"teacher").toLowerCase()==="admin";
function toast(x,ok=true){let e=$("toast");e.textContent=x;e.style.background=ok?"#187a45":"#b3261e";e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2800)}
function login(){document.body.innerHTML=`<div class="login-wrap"><div class="login"><div class="logo">SMART<br>SCHOOL</div><h1>Smart School AI</h1><div class="sub">School Management • Examination • Analytics</div><div class="year">${YEAR}</div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary full" onclick="signIn()">Sign in</button><button class="ghost full" style="margin-top:8px" onclick="reset()">Forgot password?</button><div id="loginErr" class="err"></div><div class="hint">Authentication is handled by Supabase.</div></div></div>`}
function nav(p,l,i){return `<button class="${S.page===p?"active":""}" onclick="go('${p}')">${i} ${l}</button>`}
function shell(){document.body.innerHTML=`<div class="app"><aside class="side"><div class="brand">Smart School</div><div class="school">${SCHOOL}<br>Academic Year ${YEAR}</div><div class="nav">
${nav("dashboard","Dashboard","▣")}${nav("students","Students","●")}${nav("classes","Classes & Sections","◆")}${nav("subjects","Subjects","◇")}${nav("teachers","Teachers","♟")}${nav("assign","Assignments","⇄")}${nav("exams","Examinations","▤")}${nav("marks","Marks Entry","✎")}${nav("attendance","Attendance","✓")}${nav("results","Results & Analytics","★")}${nav("reportcards","Report Cards","▣")}${nav("questions","Question Bank","☷")}${nav("quiz","Online Quiz","⚡")}${nav("timetable","Timetable","▦")}${nav("certificates","Certificates","✦")}${nav("ai","AI Assistant","✧")}<button onclick="signOut()">⇥ Sign out</button></div></aside><main class="main"><div class="top"><div><h2 id="title">Dashboard</h2><small>${SCHOOL}</small></div><div class="role">${esc(S.profile?.full_name||S.user?.email)} · ${esc(S.profile?.role||"teacher")}</div></div><div id="content"></div></main></div><div id="modal"></div><div id="toast" class="toast hidden"></div>`}
async function init(){S.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);let {data:{session}}=await S.sb.auth.getSession();if(!session){login();return}S.user=session.user;await profile();shell();await go("dashboard")}
async function profile(){let r=await S.sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();S.profile=r.data||{id:S.user.id,full_name:S.user.email,role:"teacher",active:true}}
async function signIn(){let e=$("email").value.trim().toLowerCase(),p=$("password").value,err=$("loginErr");try{let r=await S.sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;S.user=r.data.user;await profile();shell();await go("dashboard")}catch(x){err.textContent=x.message}}
async function reset(){let e=$("email").value.trim();if(!e){$("loginErr").textContent="Enter email first";return}let r=await S.sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});$("loginErr").textContent=r.error?r.error.message:"Password reset email sent."}
async function signOut(){await S.sb.auth.signOut();location.reload()}
function modal(title,body){$("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){$("modal").innerHTML=""}
async function lookups(){let [a,b,c,d,e,f,g]=await Promise.all([S.sb.from("classes").select("*").order("display_order"),S.sb.from("sections").select("*").order("name"),S.sb.from("students").select("*").order("roll_no"),S.sb.from("subjects").select("*").order("name"),S.sb.from("examinations").select("*").order("exam_date",{ascending:false}),S.sb.from("profiles").select("*").order("full_name"),S.sb.from("teacher_subjects").select("*")]);for(let r of[a,b,c,d,e,f,g])if(r.error)throw r.error;S.classes=a.data||[];S.sections=b.data||[];S.students=c.data||[];S.subjects=d.data||[];S.exams=e.data||[];S.teachers=f.data||[];S.assignments=g.data||[]}
async function go(p){S.page=p;shell();$("title").textContent=p==="assign"?"Assignments":p==="reportcards"?"Report Cards":p[0].toUpperCase()+p.slice(1);$("content").innerHTML='<div class="card">Loading…</div>';try{if(p==="dashboard")await dashboard();else if(p==="students")await students();else if(p==="classes")await classes();else if(p==="subjects")await subjects();else if(p==="teachers")await teachers();else if(p==="assign")await assignments();else if(p==="exams")await exams();else if(p==="marks")await marks();else if(p==="attendance")await attendance();else if(p==="results")await results();else if(p==="reportcards")await reports();else if(p==="questions")await questions();else if(p==="quiz")simple("Online Quiz","Quiz tables are connected. Add quizzes/questions from Supabase.");else if(p==="timetable")simple("Timetable","Timetable table is connected.");else if(p==="certificates")simple("Certificates","Certificate module is connected.");else if(p==="ai")ai()}catch(e){$("content").innerHTML=`<div class="card"><b>Module error</b><div class="err">${esc(e.message)}</div></div>`}}
async function dashboard(){let n=await Promise.all(["students","classes","subjects","examinations"].map(async t=>{let r=await S.sb.from(t).select("*",{count:"exact",head:true});return r.count||0}));$("content").innerHTML=`<div class="grid">${[["Students",n[0]],["Classes",n[1]],["Subjects",n[2]],["Examinations",n[3]]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}</div><div class="section-title"><h3>Dynamic multi-subject result system</h3></div><div class="notice"><b>Unlimited subjects enabled.</b> Report Cards, Results & Analytics and Marks Entry do not use a fixed six-subject limit. Add any number of active subjects.</div>`}
function tbl(head,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||'<tr><td colspan="99" class="empty">No records.</td></tr>'}</tbody></table></div>`}
async function students(){await lookups();$("content").innerHTML=`<div class="toolbar"><input class="search" id="sq" placeholder="Search name / roll / admission" oninput="filterS()"><button class="primary" onclick="studentForm()">+ Add Student</button><button class="secondary" onclick="importStudents()">⇧ Bulk Import</button><button class="ghost" onclick="template()">⇩ Template</button></div>${tbl(["Roll","Admission","Name","Class","Section","House","Action"],S.students.map(x=>`<tr><td>${esc(x.roll_no)}</td><td>${esc(x.admission_no)}</td><td><b>${esc(x.full_name)}</b></td><td>${C(x.class_id)}</td><td>${SEC(x.section_id)}</td><td>${esc(x.house)}</td><td class="actions"><button class="secondary" onclick="studentForm('${x.id}')">Edit</button><button class="danger" onclick="del('students','${x.id}','Student')">Delete</button></td></tr>`).join(""))}`)}
function filterS(){let q=$("sq").value.toLowerCase();let r=S.students.filter(x=>(x.full_name+" "+x.roll_no+" "+x.admission_no).toLowerCase().includes(q));let b=r.map(x=>`<tr><td>${esc(x.roll_no)}</td><td>${esc(x.admission_no)}</td><td>${esc(x.full_name)}</td><td>${C(x.class_id)}</td><td>${SEC(x.section_id)}</td><td>${esc(x.house)}</td><td class="actions"><button class="secondary" onclick="studentForm('${x.id}')">Edit</button><button class="danger" onclick="del('students','${x.id}','Student')">Delete</button></td></tr>`).join("");document.querySelector(".table tbody").innerHTML=b}
function studentForm(id){let x=S.students.find(a=>a.id===id)||{};modal(id?"Edit Student":"Add Student",`<div class="form-grid"><div class="field"><label>Admission No</label><input id="ad" value="${esc(x.admission_no)}"></div><div class="field"><label>Roll No</label><input id="ro" value="${esc(x.roll_no)}"></div><div class="field wide"><label>Full Name</label><input id="nm" value="${esc(x.full_name)}"></div><div class="field"><label>Gender</label><select id="ge"><option>Male</option><option ${x.gender==="Female"?"selected":""}>Female</option><option ${x.gender==="Other"?"selected":""}>Other</option></select></div><div class="field"><label>Class</label><select id="cl">${S.classes.map(c=>`<option value="${c.id}" ${x.class_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Section</label><select id="se">${S.sections.map(c=>`<option value="${c.id}" ${x.section_id===c.id?"selected":""}>${C(c.class_id)} - ${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>House</label><input id="ho" value="${esc(x.house)}"></div><div class="field"><label>Father Name</label><input id="fa" value="${esc(x.father_name)}"></div><div class="field"><label>Mother Name</label><input id="mo" value="${esc(x.mother_name)}"></div><div class="field"><label>Parent Phone</label><input id="ph" value="${esc(x.parent_phone||x.phone)}"></div><div class="field wide"><label>Address</label><textarea id="addr">${esc(x.address)}</textarea></div></div><button class="primary full" onclick="saveStudent('${id||""}')">Save Student</button>`)}
async function saveStudent(id){let o={admission_no:$("ad").value,roll_no:$("ro").value,full_name:$("nm").value,gender:$("ge").value,class_id:$("cl").value,section_id:$("se").value,house:$("ho").value,father_name:$("fa").value,mother_name:$("mo").value,parent_phone:$("ph").value,address:$("addr").value,active:true};let r=id?await S.sb.from("students").update(o).eq("id",id):await S.sb.from("students").insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast("Student saved");students()}
function importStudents(){modal("Bulk Import",`<div class="notice">CSV/XLSX headers: admission_no, roll_no, full_name, gender, class_id, section_id, house, father_name, mother_name, parent_phone, address.</div><br><input id="sf" type="file" accept=".csv,.xlsx,.xls"><br><br><button class="primary" onclick="doImport()">Import</button>`)}
async function doImport(){let f=$("sf").files[0];if(!f)return toast("Select file",false);try{let rows;if(f.name.endsWith(".csv")){let t=await f.text(),a=t.trim().split(/\r?\n/).map(x=>x.split(",")),h=a.shift();rows=a.map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]||""])))}else{let w=XLSX.read(await f.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:""})}let clean=rows.filter(x=>x.full_name).map(x=>({...x,active:true}));let r=await S.sb.from("students").insert(clean);if(r.error)throw r.error;closeModal();toast(clean.length+" students imported");students()}catch(e){toast(e.message,false)}}
function template(){let w=XLSX.utils.book_new(),s=XLSX.utils.json_to_sheet([{admission_no:"1",roll_no:"1",full_name:"Student Name",gender:"Male",class_id:"",section_id:"",house:"Aravali",father_name:"",mother_name:"",parent_phone:"",address:""}]);XLSX.utils.book_append_sheet(w,s,"Students");XLSX.writeFile(w,"student_import_template.xlsx")}
async function classes(){await lookups();$("content").innerHTML=`<div class="section-title"><h3>Classes</h3><button class="primary" onclick="classForm()">+ Add Class</button></div>${tbl(["Class","Order","Active","Action"],S.classes.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.display_order}</td><td>${x.active?"Yes":"No"}</td><td class="actions"><button class="secondary" onclick="classForm('${x.id}')">Edit</button><button class="danger" onclick="del('classes','${x.id}','Class')">Delete</button></td></tr>`).join(""))}<div class="section-title"><h3>Sections</h3><button class="primary" onclick="sectionForm()">+ Add Section</button></div>${tbl(["Class","Section","Active","Action"],S.sections.map(x=>`<tr><td>${C(x.class_id)}</td><td>${esc(x.name)}</td><td>${x.active?"Yes":"No"}</td><td class="actions"><button class="secondary" onclick="sectionForm('${x.id}')">Edit</button><button class="danger" onclick="del('sections','${x.id}','Section')">Delete</button></td></tr>`).join(""))}`}
function classForm(id){let x=S.classes.find(a=>a.id===id)||{};modal("Class",`<div class="field"><label>Name</label><input id="cn" value="${esc(x.name)}"></div><div class="field"><label>Order</label><input id="co" type="number" value="${x.display_order||1}"></div><button class="primary full" onclick="saveClass('${id||""}')">Save</button>`)}
async function saveClass(id){let o={name:$("cn").value,display_order:+$("co").value||1,active:true},r=id?await S.sb.from("classes").update(o).eq("id",id):await S.sb.from("classes").insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast("Class saved");classes()}
function sectionForm(id){let x=S.sections.find(a=>a.id===id)||{};modal("Section",`<div class="field"><label>Class</label><select id="sc">${S.classes.map(c=>`<option value="${c.id}" ${x.class_id===c.id?"selected":""}>${C(c.id)}</option>`).join("")}</select></div><div class="field"><label>Section</label><input id="sn" value="${esc(x.name)}"></div><button class="primary full" onclick="saveSection('${id||""}')">Save</button>`)}
async function saveSection(id){let o={class_id:$("sc").value,name:$("sn").value,active:true},r=id?await S.sb.from("sections").update(o).eq("id",id):await S.sb.from("sections").insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast("Section saved");classes()}
async function subjects(){await lookups();$("content").innerHTML=`<div class="toolbar"><button class="primary" onclick="subjectForm()">+ Add Subject</button><button class="secondary" onclick="bulkSub()">⇧ Bulk Add</button></div><div class="notice"><b>Unlimited subjects:</b> the system no longer assumes six subjects. Every active subject is loaded dynamically.</div><br>${tbl(["Code","Subject","Active","Action"],S.subjects.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.active?"Yes":"No"}</td><td class="actions"><button class="secondary" onclick="subjectForm('${x.id}')">Edit</button><button class="danger" onclick="del('subjects','${x.id}','Subject')">Delete</button></td></tr>`).join(""))}`}
function subjectForm(id){let x=S.subjects.find(a=>a.id===id)||{};modal("Subject",`<div class="form-grid"><div class="field"><label>Code</label><input id="sbc" value="${esc(x.code)}"></div><div class="field"><label>Name</label><input id="sbn" value="${esc(x.name)}"></div></div><button class="primary full" onclick="saveSubject('${id||""}')">Save</button>`)}
async function saveSubject(id){let o={code:$("sbc").value,name:$("sbn").value,active:true},r=id?await S.sb.from("subjects").update(o).eq("id",id):await S.sb.from("subjects").insert(o);if(r.error)return toast(r.error.message,false);closeModal();toast("Subject saved");subjects()}
function bulkSub(){modal("Bulk Add Subjects",`<div class="field"><label>CODE | Subject Name, one per line</label><textarea id="bs" placeholder="Eng | English\nHN | HINDI\nMT | Maths\nSc | Science\nSSc | Social Science\nTel | TELUGU\nCS | Computer Science\nPhy | Physics\nChem | Chemistry"></textarea></div><button class="primary full" onclick="saveBulkSub()">Add</button>`)}
async function saveBulkSub(){let rows=$("bs").value.split(/\r?\n/).filter(Boolean).map(x=>{let a=x.split("|");return{code:a[0].trim(),name:a.slice(1).join("|").trim(),active:true}}).filter(x=>x.code&&x.name);let r=await S.sb.from("subjects").insert(rows);if(r.error)return toast(r.error.message,false);closeModal();toast(rows.length+" subjects added");subjects()}
async function teachers(){await lookups();$("content").innerHTML=`<div class="section-title"><h3>Teachers</h3><button class="primary" onclick="teacherForm()">+ Add Teacher Details</button></div>${tbl(["Employee ID","Name","Designation","Department","Specialization","Phone","Role","Action"],S.teachers.map(x=>`<tr><td>${esc(x.employee_id)}</td><td>${esc(x.full_name)}</td><td>${esc(x.designation)}</td><td>${esc(x.department)}</td><td>${esc(x.specialization)}</td><td>${esc(x.phone)}</td><td>${esc(x.role)}</td><td class="actions"><button class="secondary" onclick="teacherForm('${x.id}')">Edit</button>${x.id!==S.user.id?`<button class="danger" onclick="del('profiles','${x.id}','Teacher')">Delete</button>`:""}</td></tr>`).join(""))}`}

function grade(p){if(p==null)return null;if(p>=91)return"A1";if(p>=81)return"A2";if(p>=71)return"B1";if(p>=61)return"B2";if(p>=51)return"C1";if(p>=41)return"C2";if(p>=33)return"D";return"E"}

async function reportData(student,examId){let selected=S.exams.find(e=>e.id===examId);if(!selected)throw Error("Exam not found");
 let rpc=await S.sb.rpc("get_student_report_card",{p_student_id:student.id,p_examination_id:examId});
 if(!rpc.error&&rpc.data?.length)return rpc.data;
 let er=await S.sb.from("examinations").select("*").eq("name",selected.name).eq("academic_year",selected.academic_year).eq("class_id",selected.class_id).eq("section_id",selected.section_id);
 if(er.error)throw er.error;let es=er.data||[],ids=es.map(e=>e.id),mr=ids.length?await S.sb.from("marks").select("*").eq("student_id",student.id).in("examination_id",ids):{data:[]};
 return es.map(e=>{let m=(mr.data||[]).find(x=>x.examination_id===e.id),p=m?.marks==null?null:+m.marks/+e.maximum_marks*100;return{subject_id:e.subject_id,subject_code:S.subjects.find(s=>s.id===e.subject_id)?.code||"",subject_name:SUB(e.subject_id),marks:m?.marks??null,max_marks:e.maximum_marks,percentage:p,grade:grade(p),result_status:status(m?.marks,m?.attendance_status,e.pass_marks,e.maximum_marks)}})}

async function analyse(){let g=RG[$("rg").value];if(!g)return;$("resArea").innerHTML='<div class="card">Calculating all subjects…</div>';let first=g[0],students=S.students.filter(s=>s.class_id===first.class_id&&s.section_id===first.section_id),arr=[];for(let s of students){let rows=await reportData(s,first.id),ev=rows.filter(r=>r.marks!=null),tot=ev.reduce((a,r)=>a+ +r.marks,0),max=ev.reduce((a,r)=>a+ +r.max_marks,0),pct=max?tot/max*100:0;arr.push({s,rows,tot,max,pct,grade:grade(pct),status:rows.some(r=>r.result_status==="ABSENT")?"ABSENT":rows.some(r=>r.result_status==="FAIL")?"FAIL":rows.some(r=>r.result_status==="INCOMPLETE")?"INCOMPLETE":"PASS"})}arr.sort((a,b)=>b.pct-a.pct);arr.forEach((x,i)=>x.rank=x.pct?i+1:"—");window.RESULTS=arr;
 let app=arr.filter(x=>x.rows.some(r=>r.marks!=null)),pass=arr.filter(x=>x.status==="PASS"),avg=app.length?app.reduce((a,x)=>a+x.pct,0)/app.length:0,high=app.length?Math.max(...app.map(x=>x.pct)):0,low=app.length?Math.min(...app.map(x=>x.pct)):0;
 let ids=[...new Set(g.map(e=>e.subject_id))],sa=ids.map(id=>{let rs=arr.flatMap(x=>x.rows.filter(r=>r.subject_id===id&&r.marks!=null)),a=rs.length?rs.reduce((z,r)=>z+ +(r.percentage||0),0)/rs.length:0,p=rs.length?rs.filter(r=>r.result_status==="PASS").length/rs.length*100:0;return{name:SUB(id),n:rs.length,a,p,h:rs.length?Math.max(...rs.map(r=>+r.percentage)):0}});
 $("resArea").innerHTML=`<div class="analysis">${[["Students",arr.length],["Appeared",app.length],["Passed",pass.length],["Pass %",app.length?(pass.length/app.length*100).toFixed(2)+"%":"0%"],["Average",avg.toFixed(2)+"%"],["Highest",high.toFixed(2)+"%"],["Lowest",low.toFixed(2)+"%"]].map(x=>`<div class="card"><div style="color:var(--muted)">${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}</div><div class="two"><div class="card"><h3>Grade Distribution</h3>${["A1","A2","B1","B2","C1","C2","D","E"].map(z=>{let n=arr.filter(x=>x.grade===z).length;return`<p>${z} <b style="float:right">${n}</b></p><div class="track"><div class="fill" style="width:${arr.length?n/arr.length*100:0}%"></div></div>`}).join("")}</div><div class="card"><h3>Subject-wise Analysis — ALL SUBJECTS</h3>${sa.map(x=>`<p><b>${esc(x.name)}</b> — ${x.a.toFixed(2)}% average — ${x.p.toFixed(2)}% pass</p><div class="track"><div class="fill" style="width:${x.a}%"></div></div>`).join("")}</div></div><div class="section-title"><h3>Student-wise Consolidated Result</h3></div>${tbl(["Rank","Roll","Name","Subjects","Total","Max","%","Grade","Status","Report"],arr.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.s.roll_no)}</td><td>${esc(x.s.full_name)}</td><td>${x.rows.length}</td><td>${x.tot.toFixed(2)}</td><td>${x.max.toFixed(2)}</td><td>${x.pct.toFixed(2)}%</td><td>${x.grade}</td><td>${x.status}</td><td><button class="secondary" onclick="showReport('${x.s.id}','${first.id}')">View</button></td></tr>`).join(""))}`}

async function saveQ(){let r=await S.sb.from("question_bank").insert({subject_id:$("qs").value,question_type:$("qt").value,marks:+$("qm").value,question_text:$("qq").value,answer_key:$("qa").value,created_by:S.user.id});if(r.error)return toast(r.error.message,false);closeModal();toast("Question saved")}
function simple(t,p){$("content").innerHTML=`<div class="card"><h3>${t}</h3><p>${p}</p></div>`}
function ai(){$("content").innerHTML=`<div class="card"><h3>Smart School AI Assistant</h3><div class="field"><label>Request</label><textarea id="aiq" placeholder="Example: Prepare a remedial plan for students below 40% in Physics."></textarea></div><button class="primary" onclick="aigen()">Generate Draft</button><div id="aio" style="white-space:pre-wrap;margin-top:15px"></div></div>`}
function aigen(){let q=$("aiq").value.trim();$("aio").textContent=q?`Draft for: ${q}\n\n1. Identify students requiring support.\n2. Analyse subject/topic gaps.\n3. Conduct targeted remedial teaching.\n4. Give practice and short assessment.\n5. Review progress weekly.`:"Enter a request."}
async function del(table,id,label){if(!confirm("Delete this "+label+"?"))return;let r=await S.sb.from(table).delete().eq("id",id);if(r.error)return toast(r.error.message,false);toast(label+" deleted");go(S.page)}
init();
</script>
</body>
